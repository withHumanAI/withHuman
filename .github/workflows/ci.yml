name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Pull requests from forks run on GitHub-hosted runners: anyone can open
# one, and the Ubicloud runners are paid for by the maintainers.
jobs:
  verify:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the frontend build stage in the Dockerfile.
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify
        # -short skips the integration tests that boot embedded PostgreSQL
        # and Temporal; the archives they download make them too slow for
        # every pull request.
        run: make verify GOTESTFLAGS=-short

      - name: CLI race and real provider integration
        run: |
          go test -race ./internal/cli/...
          go test -race ./internal/httpapi -run TestAAPLibraryAgainstProvider
          go test ./internal/postgres -run 'TestStoreAgainstRealPostgres|TestPipelineSuspensions'

      - name: Cross-build embedded CLI
        run: sh scripts/check-cli-builds.sh

  image-build:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only: PR builds exist to catch a broken Dockerfile, and
      # multi-arch would roughly double the build time. The cache scope is
      # separate from the release workflow's so PR builds never pollute
      # release caches.
      - name: Build bundle image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record artifact would be public on a public repository.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: bundle
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-bundle
          cache-to: type=gha,scope=ci-bundle,mode=max
