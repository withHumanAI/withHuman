name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Pull requests from forks run on GitHub-hosted runners: anyone can open
# one, and the Ubicloud runners are paid for by the maintainers.
jobs:
  verify:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the frontend build stage in the Dockerfile.
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify
        # -short skips the integration tests that boot embedded PostgreSQL
        # and Temporal; the archives they download make them too slow for
        # every pull request.
        env:
          AAP_MODULE_TOKEN: ${{ secrets.AAP_MODULE_TOKEN }}
        run: sh scripts/private-go-modules.sh make verify GOTESTFLAGS=-short

      - name: CLI race and real provider integration
        env:
          AAP_MODULE_TOKEN: ${{ secrets.AAP_MODULE_TOKEN }}
        run: |
          sh scripts/private-go-modules.sh go test -race ./internal/cli/...
          sh scripts/private-go-modules.sh go test -race ./internal/httpapi -run TestAAPLibraryAgainstProvider
          sh scripts/private-go-modules.sh go test ./internal/postgres -run 'TestStoreAgainstRealPostgres|TestPipelineSuspensions'

      - name: Cross-build embedded CLI
        env:
          AAP_MODULE_TOKEN: ${{ secrets.AAP_MODULE_TOKEN }}
        run: sh scripts/private-go-modules.sh sh scripts/check-cli-builds.sh

  image-build:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # amd64 only: PR builds exist to catch a broken Dockerfile, and
      # multi-arch would roughly double the build time. The cache scope is
      # separate from the release workflow's so PR builds never pollute
      # release caches.
      - name: Build bundle image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          secrets: |
            github_token=${{ secrets.AAP_MODULE_TOKEN }}
          context: .
          target: bundle
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-bundle
          cache-to: type=gha,scope=ci-bundle,mode=max
