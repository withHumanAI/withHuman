name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive image version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_RELEASE_USERNAME }}
          password: ${{ secrets.QUAY_RELEASE_TOKEN }}

      # The single binary is the one image this repository ships.
      - name: Build and push bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record artifact would be public on a public repository.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: bundle
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            quay.io/withhuman/bundle:${{ steps.version.outputs.version }}
            quay.io/withhuman/bundle:latest
          cache-from: type=gha,scope=bundle
          cache-to: type=gha,scope=bundle,mode=max

  # The withhuman CLI is a standalone binary people install on the machines
  # their agents run on. It is cross-compiled here and published, with the
  # install script, to the R2 bucket behind downloads.withhuman.ai; see
  # deployment/cli/README.md for the bucket setup.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/cli/$VERSION/withhuman-$os-$arch" ./cmd/withhuman-cli
          done
          (cd "dist/cli/$VERSION" && sha256sum withhuman-* > SHA256SUMS && cat SHA256SUMS)
          # Every target compiles the same modules, so one notices file
          # covers all four binaries.
          cp LICENSE "dist/cli/$VERSION/LICENSE"
          sh scripts/third-party-notices.sh go ./cmd/withhuman-cli > "dist/cli/$VERSION/THIRD_PARTY_NOTICES"
          cp -r "dist/cli/$VERSION" dist/cli/latest
          printf '%s\n' "$VERSION" > dist/cli/latest/version
          cp deployment/cli/install.sh dist/install.sh

      - name: Upload to R2
        env:
          VERSION: ${{ steps.version.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
        run: |
          set -eu
          aws s3 cp --recursive --endpoint-url "$AWS_ENDPOINT_URL" \
            --cache-control "public, max-age=31536000, immutable" \
            "dist/cli/$VERSION" "s3://$BUCKET/cli/$VERSION"
          aws s3 cp --recursive --endpoint-url "$AWS_ENDPOINT_URL" \
            --cache-control "public, max-age=300" \
            dist/cli/latest "s3://$BUCKET/cli/latest"
          aws s3 cp --endpoint-url "$AWS_ENDPOINT_URL" \
            --cache-control "public, max-age=300" --content-type "text/x-shellscript" \
            dist/install.sh "s3://$BUCKET/install.sh"
