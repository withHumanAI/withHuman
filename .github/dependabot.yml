version: 2
updates:
  # Workflows pin actions to commit SHAs; this keeps the pins current.
  # Major versions can change behaviour, so they are bumped by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
