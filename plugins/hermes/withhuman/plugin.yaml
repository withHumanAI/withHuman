name: withhuman
version: 1.2.2
manifest_version: 2
api_version: 1
description: >-
  Approve or deny Hermes tool calls before they run. Each call waits for
  withHuman's decision, by your rules or a person on your team.
author: withHumanAI
license: Elastic-2.0
homepage: https://withhuman.ai/docs
tags: [approvals, human-in-the-loop, security]
requires_hermes: ">=0.22.5"
provides_hooks:
  - pre_tool_call
config_schema:
  url:
    type: str
    default: https://app.withhuman.ai
    label: withHuman address
    description: Change it only for self-hosted withHuman.
  agent_key:
    type: secret
    env: WITHHUMAN_AGENT_TOKEN
    label: Agent key
    description: Set by hermes withhuman setup.
