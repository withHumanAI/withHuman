name: withhuman
version: 1.5.1
manifest_version: 2
api_version: 1
description: >-
  Human in the loop approval for Hermes tool calls. Set rules for what runs
  automatically, approve the rest from Slack, Discord or your phone, and keep
  an audit log.
author: withHumanAI
license: Elastic-2.0
homepage: https://withhuman.ai/docs
tags: [approvals, human-in-the-loop, security]
requires_hermes: ">=0.21.5"
provides_hooks:
  - pre_tool_call
config_schema:
  url:
    type: str
    default: https://app.withhuman.ai
    label: withHuman address
    description: Change it only for self-hosted withHuman.
  agent_key:
    type: secret
    env: WITHHUMAN_AGENT_TOKEN
    label: Agent key
    description: Set by hermes withhuman setup.
