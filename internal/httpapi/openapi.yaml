            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointRevision" }
        "400": { $ref: "#/components/responses/Error", description: "`revision` is not a positive integer" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read webhook endpoints" }
        "404": { $ref: "#/components/responses/Error", description: "No such revision" }
    put:
      summary: Update a draft webhook endpoint revision
      operationId: updateWebhookEndpointRevision
      x-withhuman-permission: webhook.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Webhook endpoints]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Replaces the name and URL of a draft revision, one that has never
        been active. The revision keeps its number and the endpoint keeps
        its signing secret, which is never included. Once a revision has
        been active it can no longer change.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointKey"
        - $ref: "#/components/parameters/PipelineRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEndpointDocument" }
      responses:
        "200":
          description: The updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointRevision" }
        "400": { $ref: "#/components/responses/Error", description: "The name is empty, or the URL fails the egress policy" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot edit webhook endpoints" }
        "404": { $ref: "#/components/responses/Error", description: "No such revision" }
        "409": { $ref: "#/components/responses/Error", description: "The revision has been active (`revision_not_draft`)" }
        "501": { $ref: "#/components/responses/Error", description: "This deployment has no secrets key, so webhook endpoints are unavailable" }
  /api/v1/webhook_endpoints/{endpoint_key}/revisions/{revision}/activate:
    post:
      summary: Activate a webhook endpoint revision
      operationId: activateWebhookEndpointRevision
      x-withhuman-permission: webhook.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Webhook endpoints]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Makes a revision the active one. Deliveries go to its URL from the
        next request on. A request that is paused on a webhook block and
        resumes later delivers to whichever revision is active at that
        moment. Activating an older revision is how you roll back.

        Pass the revision you expect to be active in `If-Match`, quoted,
        as returned in `ETag`. Pass `"0"` if no revision is active. If the
        active revision changed in the meantime, the call fails with 412
        and nothing changes.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointKey"
        - $ref: "#/components/parameters/PipelineRevision"
        - $ref: "#/components/parameters/ActiveRevisionIfMatch"
      responses:
        "200":
          description: The revision, now active
          headers:
            ETag:
              description: The active revision number, quoted
              schema: { type: string, example: '"3"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointRevision" }
        "400": { $ref: "#/components/responses/Error", description: "`revision` or `If-Match` is malformed" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot edit webhook endpoints" }
        "404": { $ref: "#/components/responses/Error", description: "No such revision" }
        "412": { $ref: "#/components/responses/PreconditionFailed", description: "`If-Match` does not match the active revision" }
        "428": { $ref: "#/components/responses/PreconditionRequired", description: "The `If-Match` header is missing" }
        "501": { $ref: "#/components/responses/Error", description: "This deployment has no secrets key, so webhook endpoints are unavailable" }
  /api/v1/webhook_endpoints/{endpoint_key}/revisions/{revision}/test:
    post:
      summary: Test a webhook endpoint revision
      operationId: testWebhookEndpointRevision
      x-withhuman-permission: webhook.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Webhook endpoints]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Sends one signed test delivery to the revision's URL and reports
        what came back. The payload has type `webhook_endpoint.test` and
        is flagged as a preview, so your receiver can tell it from a real
        request. It is signed with the endpoint's secret, so the test also
        checks your signature verification. The call waits up to 10
        seconds for an answer.

        You can test a revision before activating it. Each test is
        recorded in the audit log.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointKey"
        - $ref: "#/components/parameters/PipelineRevision"
      responses:
        "200":
          description: What the endpoint answered
          content:
            application/json:
              schema:
                type: object
                required: [test]
                properties:
                  test: { $ref: "#/components/schemas/WebhookEndpointTest" }
        "400": { $ref: "#/components/responses/Error", description: "`revision` is not a positive integer" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot edit webhook endpoints" }
        "404": { $ref: "#/components/responses/Error", description: "No such revision" }
        "501": { $ref: "#/components/responses/Error", description: "This deployment has no secrets key, so webhook endpoints are unavailable" }
  /api/v1/webhook_endpoints/{endpoint_key}/uses:
    get:
      summary: List where a webhook endpoint is used
      operationId: listWebhookEndpointUses
      x-withhuman-permission: webhook.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Webhook endpoints]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
