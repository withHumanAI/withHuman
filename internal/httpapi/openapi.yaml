      tags: [Escalation paths]
      description: >-
        Makes a revision the active one. Requests that reach a person from
        then on are routed with it. A request already waiting for review
        stays with the revision it was routed with, so its reviewers and
        timers do not change. Activating an older revision is how you roll
        back.

        Pass the revision you expect to be active in `If-Match`, quoted,
        as returned in `ETag`. Pass `"0"` if no revision is active. If the
        active revision changed in the meantime, the call fails with 412
        and nothing changes.

        A revision of an archived path cannot be activated; the call fails
        with 409 `escalation_path_archived`.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathKey"
        - $ref: "#/components/parameters/PipelineRevision"
        - $ref: "#/components/parameters/ActiveRevisionIfMatch"
      responses:
        "200":
          description: The revision, now active
          headers:
            ETag:
              description: The active revision number, quoted
              schema: { type: string, example: '"3"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EscalationPathRevision" }
        "400": { $ref: "#/components/responses/Error", description: "`revision` or `If-Match` is malformed" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot activate escalation paths" }
        "404": { $ref: "#/components/responses/Error", description: "No such revision" }
        "409": { $ref: "#/components/responses/Error", description: "The path is archived" }
        "412": { $ref: "#/components/responses/PreconditionFailed", description: "`If-Match` does not match the active revision" }
        "428": { $ref: "#/components/responses/PreconditionRequired", description: "The `If-Match` header is missing" }
  /api/v1/escalation-paths/{path_key}/uses:
    get:
      summary: List the active pipeline revisions that name an escalation path
      operationId: listEscalationPathUses
      x-withhuman-permission: escalation_path.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      description: The same set that refuses archiving the path, so the page can explain a refusal before the click. A revision appears once per block naming the path and once more, without block_key, when it names the path as its default.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathKey"
      responses:
        "200":
          description: Active uses, empty when the path can be archived
          content:
            application/json:
              schema:
                type: object
                required: [uses]
                properties:
                  uses:
                    type: array
                    items: { $ref: "#/components/schemas/PipelineUse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/password/reset:
    post:
      summary: Request a password reset link
      description: >-
        Mails a single-use reset link, valid for one hour, to the address
        when an active account with a password uses it. The response is the
        same whether or not such an account exists, so the form cannot be
        used to discover addresses. Delivery is best effort.
      operationId: requestPasswordReset
      x-withhuman-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Accepted, whether or not a link was sent
        "400": { $ref: "#/components/responses/Error" }
  /auth/password/reset/preview:
    post:
      summary: Check a password reset link
      description: Reports whether the link is live without consuming it.
      operationId: previewPasswordReset
      x-withhuman-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The link is live
          content:
            application/json:
              schema:
                type: object
                required: [expires_at]
                properties:
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /auth/password/reset/complete:
    post:
      summary: Set a new password with a reset link
      description: >-
        Consumes the link, replaces the password, and revokes every session
        of the account. The password is validated before the link is
        consumed, so a rejected password leaves the link usable.
      operationId: completePasswordReset
      x-withhuman-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "204":
          description: Password replaced; sign in again
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /auth/invitations/preview:
    post:
      summary: Preview an invitation by its token
      operationId: previewInvitation
      x-withhuman-permission: public
      security: []
      description: The token in the body is the authorization. Tokens never appear in URL paths because paths are logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Invitation preview for the public accept page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/invitations/accept:
    post:
      summary: Accept an invitation and create the membership
      operationId: acceptInvitation
      x-withhuman-permission: public
      security: []
      description: >-
        Redeems an invitation. A new user supplies display_name and password,
        an existing local user supplies password, and a signed-in user whose
        email matches accepts with the token alone. Sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                display_name: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "200":
          description: Membership created and session issued
          content:
            application/json:
              schema:
                type: object
                required: [principal]
                properties:
                  principal: { $ref: "#/components/schemas/Principal" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/slack/events:
    post:
      summary: Receive Slack lifecycle events
      operationId: receiveSlackEvents
      x-withhuman-permission: public
      description: Verifies Slack signatures and timestamps, answers URL verification challenges, and durably receives app_uninstalled and bot tokens_revoked events. No session is required.
      security: []
      parameters:
        - name: X-Slack-Request-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Slack-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Slack Events API envelope or URL verification challenge.
      responses:
        "200":
          description: Event persisted or ignored, or URL verification challenge returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /auth/slack/interactions:
    post:
      summary: Acknowledge Slack link-button interactions
      operationId: receiveSlackInteractions
      x-withhuman-permission: public
      description: Verifies the Slack signature over the original form body, requires a timestamp within five minutes and the configured api_app_id, and acknowledges block_actions without recording a decision or performing external calls. No session is required. Unsupported interaction types are rejected.
      security: []
      parameters:
        - name: X-Slack-Request-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Slack-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: Form-encoded body, limited to 1 MiB, with exactly one nonempty payload field.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              additionalProperties: true
              properties:
                payload:
                  type: string
                  minLength: 1
                  description: JSON-encoded Slack interaction object with type block_actions and the configured api_app_id. Additional Slack fields are accepted and ignored.
      responses:
        "200": { description: Interaction acknowledged with an empty body. No decision is recorded. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /auth/slack/callback:
    get:
      summary: Complete a Slack workspace install
      operationId: completeSlackInstall
      x-withhuman-permission: public
      description: Slack sends the installing admin back here. The browser arrives cross-site without a session, so the install state minted at the start, redeemed exactly once, is what binds the workspace to its organization. Redirects to Integrations, or to the guided setup at /welcome when the install began there, with slack=connected or a slack_error code. A revoked previous connection can be reclaimed; a healthy connection remains workspace_taken. An inconclusive check returns connection_check_unavailable and requires a new installation attempt.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          description: Set by Slack when the admin declined the install.
          schema: { type: string }
      responses:
        "302": { description: Redirect to Integrations or the guided setup }
  /auth/discord/callback:
    get:
      summary: Complete a Discord server install
      operationId: completeDiscordInstall
      x-withhuman-permission: public
      description: Discord sends the installing admin back here. The browser arrives cross-site without a session, so the install state minted at the start, redeemed exactly once, is what binds the server to its organization. The guild is taken from the token exchange rather than the guild_id query parameter. Redirects to Integrations, or to the guided setup at /welcome when the install began there, with either discord=connected or a discord_error code.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: guild_id
          in: query
          description: The server the admin chose, as Discord reports it; informational only.
          schema: { type: string }
        - name: error
          in: query
          description: Set by Discord when the admin declined the install.
          schema: { type: string }
      responses:
        "302": { description: Redirect to Integrations or the guided setup }
  /auth/discord/link/callback:
    get:
      summary: Complete linking a Discord account
      operationId: completeDiscordLink
      x-withhuman-permission: public
      description: Discord sends the person back here after authorizing the identify scope. The link state minted at the start, redeemed exactly once, identifies the person and organization; the bot then confirms the account is in the connected server. Redirects to the Notifications page, or to the guided setup at /welcome when the link began there, with either discord=linked or a discord_link_error code.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          description: Set by Discord when the person declined.
          schema: { type: string }
      responses:
        "302": { description: Redirect to Notifications or the guided setup }
  /api/v1/me/password:
    post:
      summary: Change the signed-in person's password
      description: >-
        Proves the current password, sets the new one, and revokes every
        other session of the account; the session making the change stays.
        A wrong current password answers 403 password_mismatch, distinct
        from a dead session.
      operationId: changePassword
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 1024 }
                new_password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "204":
          description: Password changed
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/me/api_keys:
    get:
      summary: List your API keys
      description: "Every personal API key you minted, newest first, with its status, and what the create form needs: whether the organization allows personal keys, whether this deployment and plan let a key carry a permission list, and the permissions you could place on one. Never the secret."
      operationId: listMyAPIKeys
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      tags: [API keys]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Your keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyAPIKeysEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Create an API key
      description: >-
        Mints a personal API key bound to your membership. The raw token
        is returned exactly once; withHuman stores only its hash. Without
        `permissions` the key inherits everything you hold, live, so a role
        change reaches the key on its next request. With `permissions`
        (hosted edition) the key is narrowed to that
        list; every entry must be a permission you hold, and the list can
        only remove, never add. A key that could decide requests or use a
        dangerous permission is minted only from a session that passes the
        organization's re-authentication and MFA rules right now, and the
        key keeps that session's assurance for later decisions. 403
        api_keys_disabled when the organization has turned personal keys
        off, 403 api_key_scoping_unavailable when this edition cannot scope
        keys, 403 plan_required when the plan cannot, 403
        authentication_stale or authentication_weak when the session must
        sign in again or with MFA first.
      operationId: createAPIKey
      x-withhuman-permission: api_key.issue
      x-withhuman-credential-kinds: [session]
      tags: [API keys]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAPIKeyRequest" }
      responses:
        "201":
          description: The key and, once, its token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedAPIKeyEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/api_keys/verify:
    get:
      summary: Verify an API key
      description: "The first call a script makes with a fresh key. Answers the key's own row and the permissions it holds right now, after narrowing and your current roles. Only a request authenticated with a key can verify one; a session answers 400."
      operationId: verifyAPIKey
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [personal_api_key, organization_api_key]
      tags: [API keys]
      security: [{ apiKeyAuth: [] }]
      responses:
        "200":
          description: The key behind this request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifiedAPIKeyEnvelope" }
        "400": { $ref: "#/components/responses/Error", description: "The request did not authenticate with an API key" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/me/api_keys/{id}:
    delete:
      summary: Revoke one of your API keys
      description: Revokes a key you minted. It stops working immediately. Revoking an already revoked key answers 204 again.
      operationId: revokeMyAPIKey
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      tags: [API keys]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/APIKeyID"
      responses:
        "204": { description: The key is revoked }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error", description: "No such key of yours" }
  /api/v1/api_keys:
    get:
      summary: List every API key in the organization
      description: The oversight list for owners, admins, and auditors. Both personal and organization keys, newest first, with creator provenance. Never the secret.
      operationId: listOrganizationAPIKeys
      x-withhuman-permission: api_key.read
      x-withhuman-credential-kinds: [session]
      tags: [API keys]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [personal, organization] }
          description: Omit to return both key kinds.
      responses:
        "200":
          description: The organization's keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeysEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/api_keys/{id}:
    get:
      summary: Inspect an API key
      description: Returns metadata, configured grants, effective organization-key grants, and policy availability. Never returns a secret.
      operationId: getAPIKey
      x-withhuman-permission: api_key.read
      x-withhuman-credential-kinds: [session]
      tags: [API keys]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/APIKeyID"
      responses:
        "200":
          description: Key metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKey" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Revoke any API key
      description: Revokes anyone's key. It stops working immediately and the audit log records who revoked it.
      operationId: revokeOrganizationAPIKey
      x-withhuman-permission: api_key.revoke
      x-withhuman-credential-kinds: [session]
      tags: [API keys]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/APIKeyID"
      responses:
        "204": { description: The key is revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error", description: "No such key" }
  /api/v1/members:
    get:
      summary: List members
      description: Returns every member of the organization, with their status and the roles they hold, directly or through their teams.
      operationId: listMembers
      x-withhuman-permission: membership.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Members]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: limit
          in: query
          description: "How many members to return. Defaults to 200."
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read members" }
  /api/v1/roles:
    get:
      summary: List predefined roles
      operationId: listRoles
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Members]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: The predefined roles a person can be invited with or given, owner first, with the permissions each
        holds. They are the same in every organization.
      responses:
        "200":
          description: The predefined roles
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
  /api/v1/members/{id}/role:
    put:
      summary: Give a member a predefined role
      operationId: setMemberRole
      x-withhuman-permission: permission_policy.write
      x-withhuman-credential-kinds: [session]
      tags: [Members]
      security: [{ cookieAuth: [] }]
      description: >-
        Gives the member one predefined role everywhere in the organization,
        replacing every permission they hold directly, custom permission
        policies included. What they inherit from teams and what your
        directory manages stay.

        You cannot change your own role. Only an owner may grant the owner
        role or change a member who holds it, the organization must keep at
        least one active owner, and a role holding a sensitive permission
        needs a fresh sign-in.
      parameters:
        - $ref: "#/components/parameters/MembershipID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/RoleKey" }
      responses:
        "200":
          description: The updated membership
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Error", description: "The role is unknown" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot change permissions, this is your own membership, the role or the member is an owner and you are not, or the role needs a fresher sign-in" }
        "404": { $ref: "#/components/responses/Error", description: "No such member" }
        "409": { $ref: "#/components/responses/Error", description: "The member is managed by your directory, or is the last active owner" }
  /api/v1/members/{id}:
    patch:
      summary: Suspend or reactivate a member
      operationId: updateMember
      x-withhuman-permission: membership.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Members]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Sets a member's status to `suspended` or `active`. A suspended
        member cannot sign in or act until reactivated. Permissions are changed
        through `PUT /api/v1/members/{id}/role` or, where the edition offers
        custom permissions, the member's permission policies.

        You cannot change your own membership. Changing a member who holds
        the owner role requires holding it yourself. Members managed by
        your directory cannot be changed here, and the organization must
        keep at least one active owner.

        Suspending a member that an active escalation path or team
        escalation policy still targets is refused with
        `membership_in_escalation_path`; the paths are listed in
        `details.escalation_paths` and the policies in
        `details.team_escalation_policies`. Pass `force` to suspend anyway.
        Those targets then reach nobody until the path or policy is edited.
      parameters:
        - $ref: "#/components/parameters/MembershipID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, suspended]
                  description: "`active` or `suspended`."
                force:
                  type: boolean
                  default: false
                  description: Suspend even while an active escalation path targets the member.
      responses:
        "200":
          description: The updated membership
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Error", description: "`status` is not `active` or `suspended`" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot change members, this is your own membership, or the member holds the owner role and you do not" }
        "404": { $ref: "#/components/responses/Error", description: "No such member" }
        "409": { $ref: "#/components/responses/Error", description: "The member is managed by your directory, is already removed, or is the last active owner. Or an active escalation path targets the member: `error.code` is `membership_in_escalation_path` and `error.details.escalation_paths` lists the paths" }
    delete:
      summary: Remove a member
      operationId: removeMember
      x-withhuman-permission: membership.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Members]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Removes a member from the organization. Their sessions are revoked
        at once. The membership record is kept with status
        `deprovisioned`, because decisions and audit events refer to it.

        You cannot remove yourself. Removing a member who holds the owner
        role requires holding it yourself, and the organization must keep
        at least one active owner.

        Removing a member that an active escalation path or team escalation
        policy still targets is refused with `membership_in_escalation_path`;
        the paths are listed in `details.escalation_paths` and the policies
        in `details.team_escalation_policies`. Pass `force=true` to remove
        anyway. Those targets then reach nobody until the path or policy is
        edited, and the audit event records which paths and policies were
        left behind.
      parameters:
        - $ref: "#/components/parameters/MembershipID"
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Remove even while an active escalation path targets the member.
      responses:
        "204": { description: The member is removed }
        "403": { $ref: "#/components/responses/Error", description: "You cannot change members, this is your own membership, or the member holds the owner role and you do not" }
        "404": { $ref: "#/components/responses/Error", description: "No such member" }
        "409": { $ref: "#/components/responses/Error", description: "The member is managed by your directory or is the last active owner. Or an active escalation path targets the member: `error.code` is `membership_in_escalation_path` and `error.details.escalation_paths` lists the paths" }
  /api/v1/permissions:
