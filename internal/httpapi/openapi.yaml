      x-withhuman-permission: permission_policy.write
      x-withhuman-credential-kinds: [session]
      tags:
      - Teams
      summary: Delete teams permission policy
      description: Refused with 403 `custom_permissions_unavailable` where the edition offers predefined roles alone (`custom_permissions_enabled` false).
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Policy operation completed
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
  /api/v1/agent_instances/self:
    get:
      summary: Read the calling instance's identity
      operationId: getAgentInstanceSelf
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [agent_instance]
      security: [{ bearerAuth: [] }]
      description: >-
        Answers with the agent and instance the credential resolves to. The
        withhuman CLI reads it to check that a saved credential still
        authenticates. Nothing about which calls to hold comes from the
        provider: an adapter sends every intercepted call and the pipeline
        decides. This product endpoint is outside AAP.
      responses:
        "200":
          description: The calling instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInstanceSelf" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/agent_instances/self/tool_catalog:
    put:
      tags: [Agents]
      summary: Report the calling instance's tool catalogue
      operationId: reportToolCatalog
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [agent_instance]
      security: [{ bearerAuth: [] }]
      description: >-
        Replaces complete source snapshots in one discovery context. Failed sources
        retain their last successful definitions. The instance credential supplies
        organization and instance identity. No arguments or credentials belong in a
        report. This product endpoint is outside AAP. Maximum body size is 8 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolCatalogReport" }
      responses:
        "204": { description: Catalogue report recorded }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/tool_catalog:
    get:
      tags: [Agents]
      summary: List known tool definitions
      operationId: listToolCatalog
      x-withhuman-permission: agent.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Returns definitions within the caller's agent scope. An edition's own
        tool source (the hosted gateway) is refreshed on read through a
        five-minute shared cache, with that edition's live grants applied. Failed
        refreshes retain the last successful definitions and mark their source stale.
        Catalogue information is advisory and never changes approval decisions.
      parameters:
        - { name: agent_slug, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: source, in: query, schema: { type: string }, description: "Only tools from this source: `builtin`, `mcp`, or a source an edition adds (the hosted gateway's `gateway`)." }
        - { name: status, in: query, schema: { type: string, enum: [available, unavailable, stale] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: refresh, in: query, schema: { type: boolean, default: false }, description: Bypass the edition's tool source discovery cache. Local tools require a CLI report. }
      responses:
        "200":
          description: Known definitions and source discovery status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolCatalogPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/tool_catalog/{id}:
    get:
      tags: [Agents]
      summary: Read a tool definition
      operationId: getToolCatalogEntry
      x-withhuman-permission: agent.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: agent_slug, in: query, schema: { type: string } }
      responses:
        "200":
          description: Definition and its discovery provenance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolCatalogEntry" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tool_definitions:
    get:
      tags: [Agents]
      summary: List distinct tool definitions
      operationId: listToolDefinitions
      x-withhuman-permission: agent.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Returns the catalogue within the caller's agent scope in one response,
        folded to distinct definitions: a tool name on a server with one
        schema and description appears once, listing every runtime and
        instance that offers it, however many agents see it. Also returns
        every server a catalogue source names, including sources where
        discovery found no tools. The edition's own tool source is refreshed
        as for the catalogue listing. Useful for suggesting tools and argument
        fields while writing pipeline conditions; the information is advisory
        and never changes approval decisions.
      responses:
        "200":
          description: Distinct definitions and the servers the catalogue names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolDefinitionList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  examples:
    AAPPendingRequest:
      summary: Pending review
      value:
        id: "7ab8c8ec-7b2d-4fd6-9b52-752f9515eb71"
        tool: "issue_refund"
        arguments: {"amount": 4900, "reason": "duplicate_charge"}
        timeout: "30m"
        status: "pending"
        created_at: "2026-09-17T12:00:00Z"
        deadline_at: "2026-09-17T12:30:00Z"
    AAPApprovedRequest:
      summary: Approved, with the window to start the call
      value:
        id: "7ab8c8ec-7b2d-4fd6-9b52-752f9515eb71"
        tool: "issue_refund"
        arguments: {"amount": 4900, "reason": "duplicate_charge"}
        timeout: "30m"
        status: "approved"
        created_at: "2026-09-17T12:00:00Z"
        deadline_at: "2026-09-17T12:30:00Z"
        decision: {"status": "approved", "note": "Refund the duplicate charge.", "decided_at": "2026-09-17T12:02:00Z", "expires_at": "2026-09-17T12:07:00Z"}
    AAPConsumedRequest:
      summary: Approved and consumed
      value:
        id: "7ab8c8ec-7b2d-4fd6-9b52-752f9515eb71"
        tool: "issue_refund"
        arguments: {"amount": 4900, "reason": "duplicate_charge"}
        timeout: "30m"
        status: "approved"
        created_at: "2026-09-17T12:00:00Z"
        deadline_at: "2026-09-17T12:30:00Z"
        decision: {"status": "approved", "note": "Refund the duplicate charge.", "decided_at": "2026-09-17T12:02:00Z", "expires_at": "2026-09-17T12:07:00Z"}
        consumption: {"consumed_at": "2026-09-17T12:02:04Z"}
    AAPReportedRequest:
      summary: Consumed with its outcome
      value:
        id: "7ab8c8ec-7b2d-4fd6-9b52-752f9515eb71"
        tool: "issue_refund"
        arguments: {"amount": 4900, "reason": "duplicate_charge"}
        timeout: "30m"
        status: "approved"
        created_at: "2026-09-17T12:00:00Z"
        deadline_at: "2026-09-17T12:30:00Z"
        decision: {"status": "approved", "note": "Refund the duplicate charge.", "decided_at": "2026-09-17T12:02:00Z", "expires_at": "2026-09-17T12:07:00Z"}
        consumption: {"consumed_at": "2026-09-17T12:02:04Z", "outcome": {"status": "succeeded", "note": "Refund issued", "reported_at": "2026-09-17T12:02:06Z"}}
    AAPCancelledRequest:
      summary: Cancelled by the adapter
      value:
        id: "7ab8c8ec-7b2d-4fd6-9b52-752f9515eb71"
        tool: "issue_refund"
        arguments: {"amount": 4900, "reason": "duplicate_charge"}
        timeout: "30m"
        status: "cancelled"
        created_at: "2026-09-17T12:00:00Z"
        deadline_at: "2026-09-17T12:30:00Z"
        decision: {"status": "cancelled", "note": "The agent stopped waiting.", "decided_at": "2026-09-17T12:02:00Z"}
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    cookieAuth: { type: apiKey, in: cookie, name: withhuman_session }
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: whk_ / who_
      description: "A personal whk_ or organization who_ API key sent as Authorization: Bearer <token>. Personal keys act as their member with live, optionally narrowed access. Organization keys act as themselves with live RBAC permission policies. The x-withhuman-credential-kinds extension lists the kinds supported by each operation. Revocation, expiry, organization status, and the policy switch for that key kind are checked on every request."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "A key of your choosing that identifies this call, so a retry does not act twice. See Idempotency in the API overview."
      schema: { type: string, minLength: 1, example: 4f1c9a2e-7b3d-4e8f-a1c5-2d6b8e0f9a31 }
    RequestID:
      name: id
      in: path
      required: true
      description: The request's id.
      schema: { type: string, format: uuid }
    AgentSlug:
      name: slug
      in: path
      required: true
      description: "The agent's slug: the identity chosen when it was created, never changed and never reused."
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
    CredentialID:
      name: id
      in: path
      required: true
      description: The credential's id.
      schema: { type: string, format: uuid }
    APIKeyID:
      name: id
      in: path
      required: true
      description: The API key's id, the part after `whk_` or `who_` in the token.
      schema: { type: string, format: uuid }
    ProvisionerID:
      name: id
      in: path
      required: true
      description: The provisioner's id.
      schema: { type: string, format: uuid }
    AgentInstanceID:
      name: id
      in: path
      required: true
      description: The instance's id.
      schema: { type: string, format: uuid }
    MembershipID:
      name: id
      in: path
      required: true
      description: The membership's id.
      schema: { type: string, format: uuid }
    InvitationID:
      name: id
      in: path
      required: true
      description: The invitation's id.
      schema: { type: string, format: uuid }
    ProviderObjectID:
      name: provider_object_id
      in: path
      required: true
      description: The directory provider's identifier for the group
      schema: { type: string }
    WebhookEndpointKey:
      name: endpoint_key
      in: path
      required: true
      description: "The endpoint's key. Lowercase letters, digits, dots, underscores and hyphens, up to 63 characters. You choose it when you create the first revision."
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
    TeamID:
      name: id
      in: path
      required: true
      description: The team's id.
      schema: { type: string, format: uuid }
    PipelineKey:
      name: pipeline_key
      in: path
      required: true
      description: "The pipeline's key. `entry` is the pipeline every request starts in; every other key was chosen when the pipeline was created. Lowercase letters, digits, dots, underscores and hyphens, up to 63 characters."
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
    PathKey:
      name: path_key
      in: path
      required: true
      description: "The path's key. Lowercase letters, digits, dots, underscores and hyphens, up to 63 characters. You choose it when you create the first revision."
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
    PipelineRevision:
      name: revision
      in: path
      required: true
      description: The revision number. Revisions count up from 1.
      schema: { type: integer, format: int64, minimum: 1 }
    ActiveRevisionIfMatch:
      name: If-Match
      in: header
      required: true
      description: "The revision you expect to be active, quoted, for example `\"2\"`. Take it from the `ETag` of your last read. If the active revision changed in the meantime, the call fails with 412 and nothing changes. Escalation paths and webhook endpoints accept `\"0\"` when no revision is active. Pipelines always have an active revision."
      schema: { type: string, pattern: '^"[0-9]+"$', example: '"2"' }
  responses:
    OAuthError:
      description: "An OAuth refusal in RFC 6749's shape, the one surface that does not use the product error envelope because OAuth clients parse this and nothing else."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OAuthError" }
    Error:
      description: Error response. A 403 from a permission check carries ForbiddenDetails in error.details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PreconditionFailed:
      description: If-Match no longer equals the active revision
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PreconditionRequired:
      description: The required If-Match header was omitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string, example: invalid_grant }
        error_description: { type: string }
    OAuthAuthorizationServerMetadata:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, registration_endpoint, response_types_supported, grant_types_supported, code_challenge_methods_supported]
      properties:
        issuer: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        registration_endpoint: { type: string, format: uri }
        scopes_supported: { type: array, items: { type: string } }
        response_types_supported: { type: array, items: { type: string } }
        response_modes_supported: { type: array, items: { type: string } }
        grant_types_supported: { type: array, items: { type: string } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        code_challenge_methods_supported: { type: array, items: { type: string } }
        authorization_response_iss_parameter_supported: { type: boolean }
        service_documentation: { type: string, format: uri }
    OAuthProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      properties:
        resource: { type: string, format: uri }
        authorization_servers: { type: array, items: { type: string, format: uri } }
        scopes_supported: { type: array, items: { type: string } }
        bearer_methods_supported: { type: array, items: { type: string } }
        resource_name: { type: string }
        resource_documentation: { type: string, format: uri }
    OAuthClientRegistration:
      type: object
      required: [redirect_uris]
      properties:
        client_name: { type: string, maxLength: 100 }
        redirect_uris: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uri } }
        client_uri: { type: string, format: uri }
        token_endpoint_auth_method: { type: string, enum: [none] }
        grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
        response_types: { type: array, items: { type: string, enum: [code] } }
    OAuthRegisteredClient:
      type: object
      required: [client_id, client_id_issued_at, client_name, redirect_uris, token_endpoint_auth_method, grant_types, response_types]
      properties:
        client_id: { type: string, format: uuid }
        client_id_issued_at: { type: integer, format: int64 }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        client_uri: { type: string, format: uri }
        token_endpoint_auth_method: { type: string, enum: [none] }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
    OAuthTokenResponse:
      type: object
      required: [access_token, token_type, scope]
      properties:
        access_token: { type: string, description: "A personal whk_ API key, shown once." }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, format: int64, description: "Seconds until the key expires; absent for a key with no expiry." }
        scope: { type: string, description: "Space-separated permission keys the key carries." }
    OAuthAuthorizationRequest:
      type: object
      required: [client_id, redirect_uri, code_challenge, code_challenge_method]
      properties:
        client_id: { type: string, format: uuid }
        redirect_uri: { type: string, format: uri }
        state: { type: string }
        code_challenge: { type: string }
        code_challenge_method: { type: string, enum: [S256] }
        scope: { type: string, description: "Space-separated permission keys the client asked for." }
        resource: { type: string, format: uri }
        response_type: { type: string, enum: [code] }
    OAuthAuthorizationPreview:
      type: object
      required: [client, requested_permissions, bearable_permissions, scoping_enabled, personal_api_keys_allowed]
      properties:
        client:
          type: object
          required: [id, name, redirect_uri]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            client_uri: { type: string }
            redirect_uri: { type: string, format: uri }
        requested_permissions: { type: array, items: { type: string } }
        bearable_permissions: { type: array, items: { $ref: "#/components/schemas/APIKeyPermission" } }
        scoping_enabled: { type: boolean }
        personal_api_keys_allowed: { type: boolean }
    OAuthAuthorizationDecision:
      allOf:
        - { $ref: "#/components/schemas/OAuthAuthorizationRequest" }
        - type: object
          required: [approve]
          properties:
            approve: { type: boolean }
            permissions:
              type: array
              items: { type: string }
              description: "The permissions to place on the key; omit to inherit everything the person holds."
            expires_at: { type: string, format: date-time }
    ToolDefinition:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 256, description: Exact tool name sent in approval requests }
        display_name: { type: string, maxLength: 512 }
        description: { type: string, maxLength: 65536 }
        input_schema: { type: object, additionalProperties: true, description: "Original JSON Schema, at most 256 KiB. Absence means unknown." }
        annotations: { $ref: "#/components/schemas/OnboardingToolAnnotations" }
    ToolCatalogSourceReport:
      type: object
      additionalProperties: false
      required: [source, complete, tools]
      properties:
        source: { type: string, enum: [builtin, mcp] }
        server: { type: string, maxLength: 256 }
        complete: { type: boolean }
        error: { type: string, maxLength: 1024 }
        tools: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/ToolDefinition" } }
    ToolCatalogReport:
      type: object
      additionalProperties: false
      required: [runtime, discovery_context, complete, sources]
      properties:
        runtime: { type: string, minLength: 1, maxLength: 128 }
        discovery_context: { type: string, minLength: 1, maxLength: 256, description: Stable opaque identifier for this local project or runtime context }
        complete: { type: boolean, description: Whether all configured sources in this context were enumerated }
        sources: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ToolCatalogSourceReport" } }
    ToolCatalogEntry:
      allOf:
        - $ref: "#/components/schemas/ToolCatalogEntryDefinition"
        - type: object
          required: [id, agent_slug, discovery_context, runtime, source, available, stale, schema_fingerprint, last_seen_at, last_attempt_at]
          properties:
            id: { type: string, format: uuid }
            agent_slug: { type: string }
            agent_instance_id: { type: string, format: uuid }
            instance_name: { type: string }
            discovery_context: { type: string }
            runtime: { type: string }
            source: { type: string, description: "`builtin`, `mcp`, or a source an edition adds (the hosted gateway's `gateway`)" }
            server: { type: string }
            available: { type: boolean }
            stale: { type: boolean }
            error: { type: string }
            schema_fingerprint: { type: string }
            last_seen_at: { type: string, format: date-time }
            last_attempt_at: { type: string, format: date-time }
    ToolCatalogEntryDefinition:
      type: object
      required: [name]
      properties:
        name: { type: string }
        display_name: { type: string }
        description: { type: string }
        input_schema: { type: object, additionalProperties: true }
        annotations: { $ref: "#/components/schemas/OnboardingToolAnnotations" }
    ToolCatalogSource:
      type: object
      required: [id, agent_slug, available, runtime, discovery_context, source, last_attempt_at, last_success_at]
      properties:
        id: { type: string, format: uuid }
        agent_slug: { type: string }
        agent_instance_id: { type: string, format: uuid }
        instance_name: { type: string, description: "The instance that reported the source, when an instance did" }
        available: { type: boolean, description: "Whether the source's owner can serve now: the reporting instance is active with a live credential, or the edition reports the external source live" }
        runtime: { type: string }
        discovery_context: { type: string }
        source: { type: string, description: "`builtin`, `mcp`, or a source an edition adds (the hosted gateway's `gateway`)" }
        server: { type: string }
        last_attempt_at: { type: string, format: date-time }
        last_success_at: { type: [string, 'null'], format: date-time }
        error: { type: string, description: "Why the last discovery failed, as the reporting instance or the edition described it. Empty after a successful discovery" }
    ToolDefinitionUse:
      type: object
      required: [runtime, available, stale]
      properties:
        runtime: { type: string, description: "The runtime that offers the definition, or the source an edition adds (the hosted gateway's `gateway`)" }
        instance_name: { type: string, description: "The instance that reported the definition, when an instance did" }
        available: { type: boolean }
        stale: { type: boolean }
    CatalogToolDefinition:
      type: object
      required: [name, uses]
      properties:
        name: { type: string, description: Exact tool name sent in approval requests }
        server: { type: string }
        description: { type: string }
        input_schema: { type: object, additionalProperties: true }
        uses: { type: array, items: { $ref: "#/components/schemas/ToolDefinitionUse" } }
    ToolDefinitionList:
      type: object
      required: [tool_definitions, servers]
      properties:
        tool_definitions: { type: array, items: { $ref: "#/components/schemas/CatalogToolDefinition" } }
        servers: { type: array, items: { type: string } }
    ToolCatalogPage:
      type: object
      required: [tools, sources, total, next_offset]
      properties:
        tools: { type: array, items: { $ref: "#/components/schemas/ToolCatalogEntry" } }
        sources: { type: array, items: { $ref: "#/components/schemas/ToolCatalogSource" } }
        total: { type: integer, minimum: 0 }
        next_offset: { type: [integer, 'null'] }
    OnboardingMachine:
      type: object
      properties:
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        cli_version: { type: string }
        user: { type: string }
    OnboardingMCPServer:
      type: object
      required: [name, transport, source]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http, sse] }
        source: { type: string, description: The configuration file the entry came from }
    OnboardingDetection:
      type: object
      required: [runtime, installed, already_hooked, mcp_servers]
      properties:
        runtime: { type: string, enum: [claude-code, codex, openclaw, pi, hermes, deepseek] }
        installed: { type: boolean }
        version: { type: string }
        binary_path: { type: string }
        config_path: { type: string }
        already_hooked: { type: boolean }
        mcp_servers:
          type: array
          items: { $ref: "#/components/schemas/OnboardingMCPServer" }
    OnboardingToolAnnotations:
      type: object
      properties:
        title: { type: string }
        read_only_hint: { type: boolean }
        destructive_hint: { type: boolean }
        idempotent_hint: { type: boolean }
        open_world_hint: { type: boolean }
    OnboardingReportedTool:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        annotations: { $ref: "#/components/schemas/OnboardingToolAnnotations" }
        input_schema: { type: object, additionalProperties: true }
        display_name: { type: string }
    OnboardingReportedTools:
      type: object
      required: [builtin, mcp]
      properties:
        builtin:
          type: array
          items: { $ref: "#/components/schemas/OnboardingReportedTool" }
        mcp:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/OnboardingReportedTool" }
        errors:
          type: array
          items:
            type: object
            required: [server, message]
            properties:
              server: { type: string }
              message: { type: string }
    OnboardingTool:
      type: object
      required: [name, source, suggested, reason]
      properties:
        name: { type: string }
        source: { type: string, enum: [builtin, mcp] }
        server: { type: string }
        description: { type: string }
        input_schema: { type: object, additionalProperties: true }
        display_name: { type: string }
        kind: { type: string, enum: [shell, edit, read, other] }
        annotations: { $ref: "#/components/schemas/OnboardingToolAnnotations" }
        suggested: { type: boolean }
        reason: { type: string, description: "shell, edit_not_suggested, read_only_builtin, annotation_read_only, annotation_destructive, annotation_mutating, verb:<verb>, or unknown" }
    OnboardingGenerated:
      type: object
      required: [escalation_path_key, escalation_path_name, escalation_path_revision, pipelines]
      properties:
        escalation_path_key: { type: string }
        escalation_path_name: { type: string }
        escalation_path_revision: { type: integer, format: int64 }
        pipelines:
          type: object
          description: "Per selected runtime: the pipeline the setup wrote into (always `entry`), the branch that holds the runtime's rules, and the entry revision it activated. `revision` equals `replaced_active_revision` when a rerun changed nothing."
          additionalProperties:
            type: object
            required: [pipeline_key, branch_key, revision, replaced_active_revision]
            properties:
              pipeline_key: { type: string }
              branch_key: { type: string }
              revision: { type: integer, format: int64 }
              replaced_active_revision: { type: integer, format: int64, minimum: 1 }
    OnboardingEnrollment:
      type: object
      required: [runtime, agent_slug, agent_name, agent_instance_id, agent_instance_name, credential_id]
      properties:
        runtime: { type: string }
        agent_slug: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
        agent_name: { type: string }
        agent_instance_id: { type: string, format: uuid }
        agent_instance_name: { type: string }
        credential_id: { type: string, format: uuid }
    OnboardingEnrollmentIssued:
      type: object
      required: [runtime, agent, agent_instance, credential]
      properties:
        runtime: { type: string }
        agent:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
            name: { type: string }
        agent_instance:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        credential: { $ref: "#/components/schemas/IssuedCredential" }
    OnboardingHookPlan:
      type: object
      required: [matcher, tools]
      properties:
        matcher: { type: string, description: Empty for runtimes whose hook registration has no matcher }
        tools:
          type: array
          items: { type: string }
    OnboardingInstallResult:
      type: object
      required: [runtime, ok]
      properties:
        runtime: { type: string }
        ok: { type: boolean }
        changes:
          type: array
          items:
            type: object
            required: [path, action]
            properties:
              path: { type: string }
              action: { type: string }
        notes:
          type: array
          items: { type: string }
        manual: { type: boolean }
        message: { type: string }
        snippet: { type: string }
    OnboardingTestCommand:
      type: object
      required: [tool, command]
      properties:
        tool: { type: string }
        command: { type: string }
        note: { type: string }
    OnboardingError:
      type: object
      required: [source, code, message]
      properties:
        source: { type: string, enum: [server, cli] }
        code: { type: string }
        message: { type: string }
    OnboardingSession:
      type: object
      description: The shared setup session. Never carries the setup code, the CLI bearer, or an agent credential.
      required: [id, organization_id, membership_id, status, version, machine, detections, selected_runtimes, tools, discovery_errors, generated, enrollments, install_results, test_commands, test_request_id, tested_at, channels_set_at, rules_set_at, last_error, created_at, updated_at, expires_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        membership_id: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_cli, connected, detected, agents_selected, tools_discovered, provisioning, enrolled, installed, tested, completed, skipped] }
        version: { type: integer, format: int64 }
        machine: { $ref: "#/components/schemas/OnboardingMachine" }
        detections:
          type: array
          items: { $ref: "#/components/schemas/OnboardingDetection" }
        selected_runtimes:
          type: array
          items: { type: string }
        tools:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/OnboardingTool" }
        discovery_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [server, message]
              properties:
                server: { type: string }
                message: { type: string }
        generated: { $ref: "#/components/schemas/OnboardingGenerated" }
        enrollments:
          type: array
          items: { $ref: "#/components/schemas/OnboardingEnrollment" }
        install_results:
          type: array
          items: { $ref: "#/components/schemas/OnboardingInstallResult" }
        test_commands:
          type: object
          description: "Per runtime, the command that makes it make a call the active rules send to the caller. Chosen when the caller leaves the rules step; a runtime is missing when no stock test call would reach them."
          additionalProperties: { $ref: "#/components/schemas/OnboardingTestCommand" }
        test_request_id: { type: [string, "null"], format: uuid }
        tested_at: { type: [string, "null"], format: date-time }
        channels_set_at: { type: [string, "null"], format: date-time, description: "When the caller passed the notification steps; provisioning requires it." }
        rules_set_at: { type: [string, "null"], format: date-time, description: "When the caller left the rules step for the test." }
        last_error:
          oneOf:
            - $ref: "#/components/schemas/OnboardingError"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              enum: [invalid_request, authentication, authorization, not_found, conflict, rate_limit, dependency, internal]
            code: { type: string }
            message: { type: string }
            param: { type: string }
            request_id: { type: string }
            details:
              description: Structured detail for codes that carry one. quota_exceeded carries QuotaExceededDetails; a forbidden error from a permission check carries ForbiddenDetails; a decision the routing rule refused carries RoutingRejectionDetails.
              anyOf:
                - $ref: "#/components/schemas/QuotaExceededDetails"
                - $ref: "#/components/schemas/ForbiddenDetails"
                - $ref: "#/components/schemas/RoutingRejectionDetails"
                - type: object
    QuotaExceededDetails:
      description: The details object on a quota_exceeded error, so a client can offer the purchase that resolves it.
      type: object
      additionalProperties: false
      required: [dimension, limit, used]
      properties:
        dimension: { type: string, description: "The plan dimension that is full, such as seats or agents." }
        limit: { type: integer, format: int64, minimum: 0 }
        used: { type: integer, format: int64, minimum: 0 }
    ForbiddenDetails:
      description: The details on a 403 from a permission check. They name the permission that was needed and the thing it was checked against.
      type: object
      additionalProperties: false
      required: [permission, resource_kind]
      properties:
        permission: { type: string, description: "The permission you needed.", example: request.decide }
        resource_kind: { type: string, enum: [organization, team, agent, pipeline, request], description: "What kind of thing the check was about." }
        resource_id: { type: string, description: "The team, agent slug, pipeline key, or request the check was about. Absent for the organization." }
    RoutingRejectionDetails:
      description: The details object on a forbidden error raised by the routing rule at decision time. not_targeted means the request was routed to other people; break_glass_only means the organization sends unrouted requests to holders of request.decide.unrouted; outside_routing_required means the reviewer holds break glass but did not send outside_routing.
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [not_targeted, break_glass_only, outside_routing_required] }
    OrganizationPolicy:
      description: The settable part of the organization's approval policy. Durations are Go duration strings.
      type: object
      additionalProperties: false
      required: [mfa_mode, approval_reauth_window, claim_retrigger_window, unrouted_requests, request_visibility, personal_api_keys_allowed, organization_api_keys_allowed]
      properties:
        organization_api_keys_allowed: { type: boolean, description: Independently controls creation and authentication of organization API keys. }
        personal_api_keys_allowed:
          type: boolean
          description: Whether members may mint personal API keys. Off refuses minting and every existing personal key without deleting any; on again brings them back.
        mfa_mode:
          type: string
          enum: [optional, reviewers_required, everyone_required]
          description: Whose sessions must carry strong assurance to decide or hand out dangerous roles.
        approval_reauth_window:
          type: string
          description: How recently a reviewer must have authenticated to decide, such as 24h0m0s.
          example: 24h0m0s
        claim_retrigger_window:
          type: string
          description: How long a reviewer claim holds before it lapses and escalation resumes, such as 15m0s. At most 24h.
          example: 15m0s
        unrouted_requests:
          type: string
          enum: [any_reviewer, break_glass_only]
          description: Who may decide a request no escalation path matched. any_reviewer admits everyone holding request.decide; break_glass_only admits only holders of request.decide.unrouted, who must acknowledge deciding outside routing.
        request_visibility:
          type: string
          enum: [all_readers, routed_only]
          description: Who sees a request. all_readers shows every request to everyone holding request.read; routed_only shows readers what was routed to them (directly, through a team, or by being added) plus unrouted requests. Anyone holding request.read.unrouted (owners and auditors) sees everything either way.
    Installation:
      type: object
      additionalProperties: false
      required: [id, version, latest_version, update_available, advisories, checked_at]
      properties:
        id: { type: string, format: uuid, description: The random installation ID the heartbeat reports. }
        version: { type: string, description: The running version. }
        latest_version: { type: [string, "null"], description: "The latest release, or null before a heartbeat has been answered." }
        update_available: { type: boolean, description: Whether latest_version is newer than the running version. }
        advisories:
          type: array
          description: Security advisories that affect the running version.
          items: { $ref: "#/components/schemas/SecurityAdvisory" }
        checked_at: { type: [string, "null"], format: date-time, description: When the last heartbeat was answered. }
    SecurityAdvisory:
      type: object
      additionalProperties: false
      required: [id, summary, severity, url, fixed_in]
      properties:
        id: { type: string, description: "The advisory's identifier, such as a GHSA ID." }
        summary: { type: string }
        severity: { type: string, description: "low, medium, high or critical." }
        url: { type: string, format: uri, description: Where the advisory is published. }
        fixed_in: { type: string, description: "The first release with the fix, or empty when none is released yet." }
    OrganizationPolicyEnvelope:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        organization_api_keys_allowed: { type: boolean, description: Independently controls creation and authentication of organization API keys. }
        policy: { $ref: "#/components/schemas/OrganizationPolicy" }
    OrganizationPolicyPatch:
      description: Any subset of the settable policy fields. An omitted field keeps its stored value.
      type: object
      additionalProperties: false
      properties:
        organization_api_keys_allowed: { type: boolean, description: Independently controls creation and authentication of organization API keys. }
        mfa_mode: { type: string, enum: [optional, reviewers_required, everyone_required] }
        approval_reauth_window: { type: string, description: "A duration such as 12h or 24h", example: 24h }
        claim_retrigger_window: { type: string, description: "A duration such as 15m, at most 24h", example: 15m }
        unrouted_requests: { type: string, enum: [any_reviewer, break_glass_only] }
        request_visibility: { type: string, enum: [all_readers, routed_only] }
        personal_api_keys_allowed: { type: boolean }
    APIKey:
      type: object
      additionalProperties: false
      description: "An API key without its secret. Personal prefixes start with `whk_`; organization prefixes start with `who_`."
      required: [grants, usable, id, prefix, kind, name, permissions, assurance_at_issue, status, created_at, expires_at, last_used_at, revoked_at]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
          description: Current organization-key grants projected from RBAC permission policies. Empty for personal keys.
        effective_grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
          description: On detail responses, currently allowed organization-key grants.
        usable: { type: boolean, description: Whether the key is active and not blocked by organization policy or status. }
        blocked_reason: { type: string, enum: [organization_inactive, api_keys_disabled] }
        id: { type: string, format: uuid }
        prefix: { type: string, example: whk_4f1c9a2e-7b3d-4e8f-a1c5-2d6b8e0f9a31 }
        kind: { type: string, enum: [personal, organization], description: "Personal keys act as a member; organization keys act as themselves." }
        membership_id: { type: string, format: uuid, description: The member a personal key acts as. }
        created_by:
          type: object
          additionalProperties: false
          description: Who minted it. Present on the organization-wide list.
          required: [membership_id, display_name, email]
          properties:
            membership_id: { type: string, format: uuid }
            display_name: { type: string }
            email: { type: string }
        name: { type: string }
        permissions:
          type: [array, "null"]
          items: { type: string }
          description: "The narrowing list, or `null` when the key inherits everything its member holds. The key's effective permissions are always this list intersected with the member's current grants."
        assurance_at_issue: { type: string, description: "The assurance of the session that minted the key (`strong`, `single_factor`), presented as the key's own when it decides." }
        oauth_client:
          type: object
          additionalProperties: false
          description: The MCP client the key was minted for through the consent page. Absent for a key made by hand.
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        status: { type: string, enum: [active, expired, revoked] }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time, description: "`null` when the key lives until revoked." }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revocation_reason: { type: string, enum: [manual, membership_deprovisioned] }
    APIKeyPermission:
      type: object
      additionalProperties: false
      description: One permission the caller could place on a key.
      required: [key, area, description, dangerous]
      properties:
        key: { type: string, example: pipeline.write }
        area: { type: string, example: pipeline }
        description: { type: string }
        dangerous: { type: boolean, description: "Minting a key that carries it needs a fresh, strong session." }
    MyAPIKeysEnvelope:
      type: object
      additionalProperties: false
      required: [keys, personal_api_keys_allowed, scoping_enabled, bearable_permissions]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/APIKey" }
        personal_api_keys_allowed: { type: boolean, description: The organization's switch. }
        scoping_enabled: { type: boolean, description: "Whether a key may carry a permission list here. False in the open edition, where keys inherit the member's role." }
        bearable_permissions:
          type: array
          items: { $ref: "#/components/schemas/APIKeyPermission" }
    APIKeysEnvelope:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/APIKey" }
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: terraform }
        permissions:
          type: array
          items: { type: string }
          minItems: 1
          description: "Narrow the key to these permissions. Omit to inherit everything you hold. Each must be a permission you hold; only in the hosted edition."
          example: [pipeline.read, pipeline.write, pipeline.activate]
        expires_at: { type: string, format: date-time, description: "When the key stops working. Omit for a key that lives until revoked, unless the deployment caps key lifetime." }
    IssuedAPIKeyEnvelope:
      type: object
      additionalProperties: false
      required: [key, token]
      properties:
        key: { $ref: "#/components/schemas/APIKey" }
        token: { type: string, description: "The raw key, shown once: `whk_<id>_<secret>`.", example: whk_4f1c9a2e-7b3d-4e8f-a1c5-2d6b8e0f9a31_x5nH9v… }
    VerifiedAPIKeyEnvelope:
      type: object
      additionalProperties: false
      required: [key, effective_permissions]
      properties:
        effective_grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        key: { $ref: "#/components/schemas/APIKey" }
        effective_permissions:
          type: array
          items: { type: string }
          description: What the key may do right now, after narrowing and the member's current roles.
    RequestApprovalPipelineSummary:
      type: object
      additionalProperties: false
      description: One pipeline and a summary of its history.
      required: [pipeline_key, name, latest_revision, revision_count, latest_created_at, referenced_by]
      properties:
        pipeline_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "The pipeline's key. `entry` is the pipeline every request starts in."
        name: { type: string, description: "The pipeline's display name: the active revision's, or the latest revision's for an archived pipeline." }
        active_revision: { type: integer, format: int64, minimum: 1, description: "The revision in use. Absent only for an archived pipeline." }
        latest_revision: { type: integer, format: int64, minimum: 1, description: "The newest revision, active or not." }
        revision_count: { type: integer, format: int64, minimum: 1 }
        latest_created_at: { type: string, format: date-time, description: When the newest revision was created. }
        archived_at: { type: string, format: date-time, description: "Present when the pipeline was archived: readable, never active again, its key taken for good." }
        referenced_by:
          type: array
          description: "Every delegate block in an active pipeline revision that hands requests to this pipeline, the entry pipeline first, then by pipeline key and block position. Empty when no request can reach it."
          items: { $ref: '#/components/schemas/PipelineDelegation' }
    PipelineDelegation:
      type: object
      additionalProperties: false
      description: One delegate block in an active pipeline revision.
      required: [pipeline_key, pipeline_name, revision, block_key, block_name]
      properties:
        pipeline_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: The key of the pipeline holding the delegate block.
        pipeline_name: { type: string, description: "That pipeline's name as of its active revision." }
        revision: { type: integer, format: int64, minimum: 1, description: "The active revision holding the block." }
        block_key: { type: string, description: "The delegate block's key, unique within the revision." }
        block_name: { type: string, description: "The delegate block's name." }
    RequestApprovalPipelineRevisionSummary:
      type: object
      additionalProperties: false
      description: One pipeline revision, without its blocks.
      required: [id, pipeline_key, name, revision, is_active, block_count, created_by_actor_id, created_at]
      properties:
        id: { type: string, format: uuid }
        pipeline_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "The pipeline's key."
        name: { type: string, description: "The pipeline's display name as of this revision." }
        revision: { type: integer, format: int64, minimum: 1, description: The revision number. Revisions count up from 1. }
        is_active: { type: boolean, description: Whether this is the revision in use. }
        block_count: { type: integer, minimum: 0, maximum: 1000, description: "Every block in the revision, including blocks inside branches." }
        default_escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: The escalation path for requests that reach a person from this pipeline without a block naming a path.
        default_ask_agent_owner:
          type: boolean
          description: "Send requests that reach a person without a block naming a path to the person who owns the agent instance that made them, instead of `default_escalation_path`. The path, if any, is then the fallback for a request whose agent has no owner able to decide it; without one the fallback is the enclosing pipeline's default, else any authorized reviewer."
        created_by_actor_id: { type: string, format: uuid, description: The membership or organization-key actor that created the revision. }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, description: "When the revision was first active. Absent for a draft, which can still be changed." }
        archived_at: { type: string, format: date-time, description: "Present when the pipeline was archived. An archived revision can be read but never activated." }
    RequestApprovalPipelineRevision:
      type: object
      additionalProperties: false
      description: One pipeline revision with its blocks in the order they run.
      required: [id, pipeline_key, name, revision, is_active, block_count, created_by_actor_id, created_at, blocks]
      properties:
        id: { type: string, format: uuid }
        pipeline_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "The pipeline's key."
        name: { type: string, description: "The pipeline's display name as of this revision." }
        revision: { type: integer, format: int64, minimum: 1, description: The revision number. Revisions count up from 1. }
        is_active: { type: boolean, description: Whether this is the revision in use. }
        block_count: { type: integer, minimum: 0, maximum: 1000, description: "Every block in the revision, including blocks inside branches." }
        default_escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: The escalation path for requests that reach a person from this pipeline without a block naming a path.
        default_ask_agent_owner:
          type: boolean
          description: "Send requests that reach a person without a block naming a path to the person who owns the agent instance that made them, instead of `default_escalation_path`. The path, if any, is then the fallback for a request whose agent has no owner able to decide it; without one the fallback is the enclosing pipeline's default, else any authorized reviewer."
        created_by_actor_id: { type: string, format: uuid, description: The membership or organization-key actor that created the revision. }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, description: "When the revision was first active. Absent for a draft, which can still be changed." }
        archived_at: { type: string, format: date-time, description: "Present when the pipeline was archived." }
        blocks:
          type: array
          maxItems: 1000
          description: The blocks, in the order they run. A branch holds its own blocks in `config.blocks`; a delegate names the pipeline it hands matching requests to in `config.pipeline_key`.
          items: { $ref: "#/components/schemas/StoredRequestApprovalBlock" }
    RequestApprovalPipelineDocument:
      type: object
      additionalProperties: false
      description: The complete content of a new pipeline revision.
      required: [blocks]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: "A new display name for the pipeline. Omit to keep the active revision's." }
        blocks:
          type: array
          maxItems: 1000
          description: "The blocks, in the order they should run. A branch holds its own blocks in `config.blocks`, and the pipeline may hold at most 1,000 blocks counting those. An empty list passes every request that enters the pipeline through to a person."
          items: { $ref: "#/components/schemas/RequestApprovalBlockDefinition" }
        default_escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "The escalation path for requests that reach a person from this pipeline without a block naming a path. That includes requests that run out of it. A delegated pipeline without one inherits the defaults of the pipelines that delegated into it, nearest first; with none anywhere, any reviewer who can decide may take the request from the queue. The path must exist when the revision is created, and be active when it is activated."
        default_ask_agent_owner:
          type: boolean
          description: "Send those requests to the person who owns the agent instance that made them instead. `default_escalation_path`, if set, is then the fallback for a request whose agent has no owner able to decide it (a service agent, or an owner who was deactivated); without it the fallback is the enclosing pipeline's default, else any authorized reviewer. The owner is the only reviewer: the request never moves to the path because the owner has not answered."
    RequestApprovalPipelineCreate:
      type: object
      additionalProperties: false
      description: A new pipeline and the content of its first revision.
      required: [pipeline_key, name]
      properties:
        pipeline_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          example: payments
          description: "The pipeline's key. Taken for good once used, archived pipelines included; never `entry`."
        name: { type: string, minLength: 1, maxLength: 120, example: Payments, description: The display name. }
        blocks:
          type: array
          maxItems: 1000
          description: "The first revision's blocks, in the order they should run. Omit for a pipeline that passes every request that enters it through to a person until it is edited."
          items: { $ref: "#/components/schemas/RequestApprovalBlockDefinition" }
        default_escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "The escalation path for requests that reach a person from this pipeline without a block naming a path, as in a document."
        default_ask_agent_owner:
          type: boolean
          description: "Send those requests to the person who owns the agent instance that made them instead. `default_escalation_path`, if set, is then the fallback for a request whose agent has no owner able to decide it (a service agent, or an owner who was deactivated); without it the fallback is the enclosing pipeline's default, else any authorized reviewer. The owner is the only reviewer: the request never moves to the path because the owner has not answered."
    RequestApprovalBlockDefinition:
      description: One block of a pipeline document. The type picks the kind of block and the shape of its config. These are the kinds every edition has (`outcome`, `branch`, `delegate`, `webhook`); "if this, then that" is a branch whose blocks end in an outcome block; an edition may add kinds of its own with their own config shapes (the hosted edition adds `llm_judge`), and a document naming a kind this deployment lacks is refused as invalid.
      oneOf:
        - $ref: "#/components/schemas/OutcomeBlockDefinition"
        - $ref: "#/components/schemas/WebhookBlockDefinition"
        - $ref: "#/components/schemas/BranchBlockDefinition"
        - $ref: "#/components/schemas/DelegateBlockDefinition"
      discriminator:
        propertyName: type
        mapping:
          outcome: "#/components/schemas/OutcomeBlockDefinition"
          webhook: "#/components/schemas/WebhookBlockDefinition"
          branch: "#/components/schemas/BranchBlockDefinition"
          delegate: "#/components/schemas/DelegateBlockDefinition"
    OutcomeBlockDefinition:
      type: object
      additionalProperties: false
      description: A block that returns its configured outcome for every request that reaches it.
      required: [id, name, type, enabled, timeout, max_attempts, config]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          example: review-remaining-requests
          description: A key for the block, unique within the pipeline including blocks inside branches.
        name: { type: string, minLength: 1, example: Review remaining requests, description: A display name. }
        type: { type: string, const: outcome, description: "Always `outcome`." }
        enabled:
          type: boolean
          const: true
          description: "Always `true`. Leave disabled blocks out of the document."
        timeout:
          type: string
          example: 50ms
          description: "How long execution may take, as a duration. At most `1s`."
        max_attempts: { type: integer, const: 1, description: Always 1. }
        config: { $ref: "#/components/schemas/OutcomeBlockConfig" }
    StoredRequestApprovalBlock:
      description: One block as saved in a revision. The same shape as its definition, plus the fields of the saved copy.
      oneOf:
        - $ref: "#/components/schemas/StoredOutcomeBlock"
        - $ref: "#/components/schemas/StoredWebhookBlock"
        - $ref: "#/components/schemas/StoredBranchBlock"
        - $ref: "#/components/schemas/StoredDelegateBlock"
      discriminator:
        propertyName: type
        mapping:
          outcome: "#/components/schemas/StoredOutcomeBlock"
          webhook: "#/components/schemas/StoredWebhookBlock"
          branch: "#/components/schemas/StoredBranchBlock"
    StoredOutcomeBlock:
      type: object
      additionalProperties: false
      description: An outcome block as saved in a revision.
      required: [id, snapshot_id, name, type, enabled, timeout, max_attempts, config, config_version, content_hash]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          example: review-remaining-requests
          description: The block's key, unique within the pipeline including blocks inside branches.
        snapshot_id: { type: string, format: uuid, description: The id of the saved copy. }
        name: { type: string, minLength: 1, example: Review remaining requests, description: The display name. }
        type: { type: string, const: outcome, description: "Always `outcome`." }
        enabled: { type: boolean, const: true, description: "Always `true`." }
        timeout: { type: string, example: 50ms, description: How long execution may take. }
        max_attempts: { type: integer, const: 1, description: Always 1. }
        config: { $ref: "#/components/schemas/OutcomeBlockConfig" }
        config_version: { type: integer, const: 1, description: The version of the config format. Always 1. }
        content_hash: { type: string, pattern: '^[0-9a-f]{64}$', example: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", description: A SHA-256 hash of the block's content. }
    WebhookBlockDefinition:
      type: object
      additionalProperties: false
      description: A block that asks a webhook endpoint of yours for an outcome.
      required: [id, name, type, enabled, timeout, max_attempts, config]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: A key for the block, unique within the pipeline including blocks inside branches.
        name: { type: string, minLength: 1, description: A display name. }
        type: { type: string, const: webhook, description: "Always `webhook`." }
        enabled: { type: boolean, const: true, description: "Always `true`. Leave disabled blocks out of the document." }
        timeout:
          type: string
          example: 5s
          description: "How long one attempt may take, from connecting to the full response, as a duration. At most `30s`."
        max_attempts: { type: integer, minimum: 1, maximum: 3, description: "How many times to try, from 1 to 3." }
        config: { $ref: "#/components/schemas/WebhookBlockConfig" }
    StoredWebhookBlock:
      type: object
      additionalProperties: false
      description: A webhook block as saved in a revision.
      required: [id, snapshot_id, name, type, enabled, timeout, max_attempts, config, config_version, content_hash]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: The block's key, unique within the pipeline including blocks inside branches.
        snapshot_id: { type: string, format: uuid, description: The id of the saved copy. }
        name: { type: string, minLength: 1, description: The display name. }
        type: { type: string, const: webhook, description: "Always `webhook`." }
        enabled: { type: boolean, const: true, description: "Always `true`." }
        timeout: { type: string, example: 5s, description: How long one attempt may take. }
        max_attempts: { type: integer, minimum: 1, maximum: 3, description: How many times to try. }
        config: { $ref: "#/components/schemas/WebhookBlockConfig" }
        config_version: { type: integer, const: 1, description: The version of the config format. Always 1. }
        content_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: A SHA-256 hash of the block's content. }
    BranchBlockDefinition:
      type: object
      additionalProperties: false
      description: A block that runs its own blocks for the requests its condition matches and is skipped by every other request. A request that enters a branch is decided inside it, or goes to a person if none of its blocks decides; nothing after the branch runs for that request.
      required: [id, name, type, enabled, timeout, max_attempts, config]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          example: refunds
          description: A key for the block, unique within the pipeline including blocks inside branches.
        name: { type: string, minLength: 1, example: Refunds, description: A display name. }
        type: { type: string, const: branch, description: "Always `branch`." }
        enabled:
          type: boolean
          const: true
          description: "Always `true`. Leave disabled blocks out of the document."
        timeout:
          type: string
          example: 50ms
          description: "How long the condition may take, as a duration. At most `1s`."
        max_attempts: { type: integer, const: 1, description: Always 1. }
        config: { $ref: "#/components/schemas/BranchBlockConfig" }
    StoredBranchBlock:
      type: object
      additionalProperties: false
      description: A branch as saved in a revision, with its blocks as saved.
      required: [id, snapshot_id, name, type, enabled, timeout, max_attempts, config, config_version, content_hash]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: The block's key, unique within the pipeline including blocks inside branches.
        snapshot_id: { type: string, format: uuid, description: The id of the saved copy. }
        name: { type: string, minLength: 1, description: The display name. }
        type: { type: string, const: branch, description: "Always `branch`." }
        enabled: { type: boolean, const: true, description: "Always `true`." }
        timeout: { type: string, example: 50ms, description: How long the condition may take. }
        max_attempts: { type: integer, const: 1, description: Always 1. }
        config: { $ref: "#/components/schemas/StoredBranchBlockConfig" }
        config_version: { type: integer, const: 1, description: The version of the config format. Always 1. }
        content_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: "A SHA-256 hash of the branch's own content. Each of its blocks has its own." }
    BranchBlockConfig:
      type: object
      additionalProperties: false
      description: "When the condition matches, the branch's blocks run in order and the first to decide ends the pipeline. If none decides, the request goes to a person with this reason and escalation path. When the condition does not match, the branch is skipped and the request passes to the next block. A condition that cannot be evaluated sends the request to a person on the pipeline's default path. \"If this, then that\" is a branch whose blocks end in an outcome block; such a branch never runs out, so it needs no reason or path."
      required: [when, blocks]
      properties:
        when: { $ref: "#/components/schemas/CELCondition" }
        blocks:
          type: array
          minItems: 1
          maxItems: 999
          description: "The branch's blocks, in the order they run. Any type, including further branches. They count toward the pipeline's 1,000 blocks."
          items: { $ref: "#/components/schemas/RequestApprovalBlockDefinition" }
        reason: { type: string, description: "The note recorded when none of the branch's blocks decides; empty when the branch has none." }
        escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "Where the request goes when none of the branch's blocks decides. Defaults to the pipeline's default path. Blocks inside the branch that name no path of their own use the pipeline's default, not this one."
        ask_agent_owner:
          type: boolean
          description: "Send the request to the person who owns the agent instance that made it, instead of `escalation_path`. The path, if set, is then the fallback when the request has no owner able to decide it; without one the fallback is the pipeline default."
    StoredBranchBlockConfig:
      type: object
      additionalProperties: false
      description: A branch configuration as saved, with its blocks as saved.
      required: [when, blocks, reason]
      properties:
        when: { $ref: "#/components/schemas/CELCondition" }
        blocks:
          type: array
          minItems: 1
          description: The branch's blocks, in the order they run.
          items: { $ref: "#/components/schemas/StoredRequestApprovalBlock" }
        reason: { type: string, description: "The note recorded when none of the branch's blocks decides; empty when the branch has none." }
        escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: Where the request goes when none of the branch's blocks decides.
        ask_agent_owner:
          type: boolean
          description: "Send the request to the person who owns the agent instance that made it, instead of `escalation_path`. The path, if set, is then the fallback when the request has no owner able to decide it; without one the fallback is the pipeline default."
    DelegateBlockDefinition:
      type: object
      additionalProperties: false
      description: "A block that hands the requests its condition matches to another pipeline, named by key, and is skipped by every other request. A request that enters the delegated pipeline is decided inside it, or goes to a person under that pipeline's own default escalation path (else the defaults of the pipelines that delegated into it) if none of its blocks decides; nothing after the delegate runs for that request. The condition belongs to the pipeline holding the block; everything after a match belongs to the target pipeline's owners."
      required: [id, name, type, enabled, timeout, max_attempts, config]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          example: to-payments
          description: A key for the block, unique within the pipeline including blocks inside branches.
        name: { type: string, minLength: 1, example: Payments team, description: A display name. }
        type: { type: string, const: delegate, description: "Always `delegate`." }
        enabled:
          type: boolean
          const: true
          description: "Always `true`. Leave disabled blocks out of the document."
        timeout:
          type: string
          example: 50ms
          description: "How long the condition may take, as a duration. At most `1s`."
        max_attempts: { type: integer, const: 1, description: Always 1. }
        config: { $ref: "#/components/schemas/DelegateBlockConfig" }
    StoredDelegateBlock:
      type: object
      additionalProperties: false
      description: A delegate as saved in a revision.
      required: [id, snapshot_id, name, type, enabled, timeout, max_attempts, config, config_version, content_hash]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: The block's key, unique within the pipeline including blocks inside branches.
        snapshot_id: { type: string, format: uuid, description: The id of the saved copy. }
        name: { type: string, minLength: 1, description: The display name. }
        type: { type: string, const: delegate, description: "Always `delegate`." }
        enabled: { type: boolean, const: true, description: "Always `true`." }
        timeout: { type: string, example: 50ms, description: How long the condition may take. }
        max_attempts: { type: integer, const: 1, description: Always 1. }
        config: { $ref: "#/components/schemas/DelegateBlockConfig" }
        config_version: { type: integer, const: 1, description: The version of the config format. Always 1. }
        content_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: "A SHA-256 hash of the block's content." }
    DelegateBlockConfig:
      type: object
      additionalProperties: false
      description: "When the condition matches, the request continues in the named pipeline's active revision and is settled there. When it does not match, the delegate is skipped and the request passes to the next block. A condition that cannot be evaluated sends the request to a person on the default path of the pipeline holding the block. The named pipeline must exist when the revision is created and be active when it is activated; it can never be `entry`, and the activation refuses a delegation that would loop."
      required: [when, pipeline_key]
      properties:
        when: { $ref: "#/components/schemas/CELCondition" }
        pipeline_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          example: payments
          description: The pipeline that takes matching requests.
    WebhookBlockConfig:
      type: object
      additionalProperties: false
      required: [endpoint_key, allowed_outcomes, include, reason]
      description: The block posts the request to a webhook endpoint and the endpoint answers with an outcome. The endpoint is a separate resource, named here by its key. Deliveries go to the key's active revision. If the answer is not in allowed_outcomes, or the call fails, the request goes to a person.
      properties:
        endpoint_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: The webhook endpoint to call.
        allowed_outcomes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [next, human, approve, deny] }
          description: "The outcomes the endpoint may return. Any other answer sends the request to a person. `approve` and `deny` must be listed explicitly. The editor defaults to `next` and `human`."
        include:
          type: object
          additionalProperties: false
          description: What to send with the request.
          required: [agent_reasoning, context, previous_metadata]
          properties:
            agent_reasoning: { type: boolean, description: "Include the agent's own explanation of the call." }
            context: { type: boolean, description: "Include the runtime metadata the adapter reported." }
            previous_metadata: { type: boolean, description: "Include the metadata earlier blocks returned." }
        reason:
          type: string
          minLength: 1
          description: The note recorded on decisions this block makes. The endpoint's own reason is kept as evidence.
        escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "Where the request goes when the endpoint answers `human`, or when the call fails. Defaults to the pipeline's default path."
        ask_agent_owner:
          type: boolean
          description: "Send the request to the person who owns the agent instance that made it, instead of `escalation_path`. The path, if set, is then the fallback when the request has no owner able to decide it; without one the fallback is the pipeline default."
    OutcomeBlockConfig:
      type: object
      additionalProperties: false
      description: Returns outcome for every request that reaches this block. Later blocks do not run.
      required: [outcome, reason]
      example:
        outcome: human
        reason: Requests not handled by earlier blocks need human review.
      dependentSchemas:
        escalation_path:
          properties:
            outcome: { const: human }
      properties:
        outcome: { type: string, enum: [approve, deny, human], description: The outcome returned unconditionally. }
        reason: { type: string, minLength: 1, description: The note recorded on decisions this block makes. }
        escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "Where the request goes for a `human` outcome. Allowed only when `outcome` is `human`. Defaults to the pipeline's default path."
        ask_agent_owner:
          type: boolean
          description: "Send the request to the person who owns the agent instance that made it, instead of `escalation_path`. The path, if set, is then the fallback when the request has no owner able to decide it; without one the fallback is the pipeline default."
    CELCondition:
      description: A condition tree. A leaf tests one field. all and any combine conditions. some and every test the items of a list field.
      oneOf:
        - $ref: "#/components/schemas/CELLeafCondition"
        - $ref: "#/components/schemas/CELAllCondition"
        - $ref: "#/components/schemas/CELAnyCondition"
        - $ref: "#/components/schemas/CELSomeCondition"
        - $ref: "#/components/schemas/CELEveryCondition"
    CELLeafCondition:
      type: object
      additionalProperties: false
      description: A test of one field.
      required: [id, field, operator]
      properties:
        id: { type: string, format: uuid, description: "An id for the condition, unique within the pipeline." }
        field: { type: string, example: /request/arguments/amount_cents, description: "A JSON pointer into the request, such as `/request/tool` or `/request/arguments/amount_cents`." }
        operator:
          type: string
          enum: [exists, not_exists, equals, not_equals, is_null, is_not_null, in, not_in, contains, not_contains, starts_with, ends_with, regex, greater_than, greater_than_or_equal, less_than, less_than_or_equal, is_true, is_false, contains_any, contains_all, is_empty, is_not_empty]
          description: How to compare the field. `contains`, `contains_any` and `contains_all` test substrings of a string field and elements of an array field. `starts_with` takes an array of prefixes and holds when the field begins with any of them.
        value: { description: "The value to compare with. Not used by operators that take none, such as `exists`." }
    CELAllCondition:
      type: object
      additionalProperties: false
      description: Holds when every nested condition holds.
      required: [id, all]
      properties:
        id: { type: string, format: uuid, description: "An id for the condition, unique within the pipeline." }
        all:
          type: array
          minItems: 1
          description: The conditions that must all hold.
          items: { $ref: "#/components/schemas/CELCondition" }
    CELAnyCondition:
      type: object
      additionalProperties: false
      description: Holds when at least one nested condition holds.
      required: [id, any]
      properties:
        id: { type: string, format: uuid, description: "An id for the condition, unique within the pipeline." }
        any:
          type: array
          minItems: 1
          description: The conditions, of which at least one must hold.
          items: { $ref: "#/components/schemas/CELCondition" }
    CELSomeCondition:
      type: object
      additionalProperties: false
      description: Holds when at least one item of a list field matches.
      required: [id, some]
      properties:
        id: { type: string, format: uuid, description: "An id for the condition, unique within the pipeline." }
        some: { $ref: "#/components/schemas/CELQuantifier" }
    CELEveryCondition:
      type: object
      additionalProperties: false
      description: Holds when every item of a list field matches.
      required: [id, every]
      properties:
        id: { type: string, format: uuid, description: "An id for the condition, unique within the pipeline." }
        every: { $ref: "#/components/schemas/CELQuantifier" }
    CELQuantifier:
      type: object
      additionalProperties: false
      description: A list field and the condition each of its items is tested against.
      required: [field, where]
      properties:
        field: { type: string, description: A JSON pointer to a list field. }
        where: { $ref: "#/components/schemas/CELCondition" }
    RequestApprovalPipelinePreviewRequest:
      type: object
      additionalProperties: false
      description: A pipeline document and a sample request to run it against.
      required: [blocks, sample]
      properties:
        blocks:
          type: array
          maxItems: 1000
          description: The blocks, in the order they should run.
          items: { $ref: "#/components/schemas/RequestApprovalBlockDefinition" }
        default_escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "The default escalation path, as in a document. Reported in the result when the outcome is `human`."
        default_ask_agent_owner: { type: boolean, description: "Whether the default asks the agent's owner first, as in a document." }
        sample:
          type: object
          additionalProperties: false
          description: The request to run the pipeline against.
          required: [request, agent]
          properties:
            request:
              type: object
              additionalProperties: false
              description: The tool call.
              required: [tool, arguments]
              properties:
                tool: { type: string, minLength: 1, example: issue_refund, description: The tool the sample agent is calling. }
                server: { type: string, example: stripe, description: "The MCP server that defines the tool, as an adapter would report it. Leave it out for a built-in tool." }
                arguments: { type: object, additionalProperties: true, example: { amount_cents: 12000 }, description: The tool's arguments. }
                agent_reasoning: { type: string, description: The agent's own explanation of the call. Only blocks that include it see it. }
                context: { type: object, additionalProperties: true, description: "Runtime metadata, as an adapter would report it. Only blocks that include it see it." }
            agent:
              type: object
              additionalProperties: false
              description: The agent making the call.
              required: [slug, name]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
                  description: The agent's slug.
                name: { type: string, minLength: 1, description: A name for the sample agent. }
            previous_metadata:
              type: object
              description: Metadata as if earlier blocks had returned it, keyed by pipeline key and then by block key, exactly as conditions read it under `/previous_metadata/<pipeline_key>/<block_key>`.
              additionalProperties: { type: object, additionalProperties: { type: object, additionalProperties: true }, description: "Metadata from one pipeline, by block key." }
    RequestApprovalPipelinePreview:
      type: object
      additionalProperties: false
      description: What the pipeline did with the sample.
      required: [outcome, reason_code, blocks]
      properties:
        outcome: { type: string, enum: [approve, deny, human], description: The final outcome. }
        reason_code: { type: string, enum: [block_outcome, block_error, block_timeout, retries_exhausted, invalid_block_output, end_of_pipeline, end_of_branch], description: "Why the run ended. `block_outcome`: a block decided. `block_error`, `block_timeout`, `retries_exhausted`, `invalid_block_output`: a block failed. `end_of_pipeline`: the request passed every block. `end_of_branch`: the request entered a branch or a delegated pipeline and none of its blocks decided." }
        terminal_block_id: { type: string, description: "The block that ended the run: for `end_of_branch`, the branch or the delegate. Absent when the request passed every block." }
        blocks:
          type: array
          description: "What each block the request reached did, in order, each with the pipeline it belongs to. A branch or delegate appears when its condition is evaluated, and once more with `end_of_branch` when none of the blocks inside decided."
          items: { $ref: "#/components/schemas/RequestApprovalPipelinePreviewBlock" }
        escalation_path:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "The path a `human` outcome goes to: the ending block's path, else the default of the pipeline the request was in, else the defaults of the pipelines that delegated into it. Absent when the outcome is automatic or no path applies."
        escalation_path_reason: { type: string, enum: [block_escalation, pipeline_default, no_escalation], description: "Where the path came from. `block_escalation`: the ending block named it. `pipeline_default`: a pipeline's default. `no_escalation`: no path applies." }
        escalation_path_pipeline_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: "The pipeline whose block or default supplied the path. Absent with `no_escalation`." }
        ask_agent_owner: { type: boolean, description: "Present when the route asks the agent's owner, with `escalation_path` as the fallback. A preview has no real agent instance, so it names the route, never a person." }
    RequestApprovalPipelinePreviewBlock:
      type: object
      additionalProperties: false
      description: What one block did in a preview.
      required: [block_id, pipeline_key, position, outcome, cost, trace]
      properties:
        block_id: { type: string, description: The block's key. }
        pipeline_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: "The pipeline the block belongs to: the previewed document's key, or a delegated pipeline's." }
        position: { type: integer, minimum: 0, description: "The block's position in the effective pipeline, from 0, counting in document order with each branch or delegate before the blocks it holds." }
        outcome: { type: string, enum: [next, approve, deny, human, enter], description: "What the block returned. A branch or delegate returns `enter` when its condition matched and `next` when it did not." }
        reason: { type: string, description: The note the block recorded. }
        metadata: { type: object, additionalProperties: true, description: "The metadata the block returned, if any." }
        cost: { type: integer, format: int64, minimum: 0, description: The cost the block recorded. }
        error_code: { type: string, description: "Why the block failed, if it did: `invalid_input`, `evaluation_error`, `cost_limit_exceeded`, `resource_limit_exceeded`, `timeout`, `invalid_block_output`, `internal_error`, `provider_error`, `endpoint_unreachable`, `endpoint_error`, `endpoint_rejected`, `outcome_not_allowed`, `endpoint_unavailable`, or a code a kind the edition adds reports (the hosted judge's `model_unavailable`)." }
        delivery:
          type: object
          additionalProperties: false
          required: [endpoint_key, endpoint_host, duration_ms]
          description: For webhook blocks. What was called and what came back. Never the bodies, never the secret.
          properties:
            endpoint_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: The endpoint that was called. }
            endpoint_revision: { type: integer, format: int64, minimum: 1, description: The revision that was delivered to. Absent when the endpoint had no active revision. }
            endpoint_host: { type: string, description: The host that was called. }
            http_status: { type: integer, description: The HTTP status the endpoint returned. }
            duration_ms: { type: integer, format: int64, description: "How long the call took, in milliseconds." }
            reason: { type: string, description: "The endpoint's own explanation, at most 1,024 characters." }
        trace:
          type: array
          description: How the condition was evaluated, node by node. For condition blocks and branches.
          items:
            type: object
            additionalProperties: false
            required: [node_id, matched, error]
            properties:
              node_id: { type: string, format: uuid, description: The condition's id. }
              matched: { type: boolean, description: Whether the condition held. }
              error: { type: boolean, description: Whether evaluating it failed. }
        end_of_branch: { type: boolean, description: "Present and true on the step that closes a branch the request entered when none of its blocks decided. The outcome is `human`." }
    EnrollmentCode:
      type: object
      description: The two codes of a pending enrollment.
      required: [enrollment_code, user_code, verification_uri, expires_at]
      properties:
        enrollment_code: { type: string, example: whe_7c1f2a9e-4b3d-4f2e-9a1c-2d6e8b5f0a11_3f6b9c1d0e7a4b2c, description: "The secret the machine keeps. Send it to the exchange endpoint. Never show it to the person." }
        user_code: { type: string, example: K7M-3PQ2, description: "The short code the person enters in the browser. Three letters, a hyphen, and four letters or digits. Case does not matter." }
        verification_uri: { type: string, format: uri, example: https://app.withhuman.ai/connect/authorize, description: "The page where the person enters the user code." }
        expires_at: { type: string, format: date-time, description: "When both codes stop working. Start a new enrollment after this." }
    IssuedCredential:
      type: object
      required: [id, token, expires_at]
      properties:
        id: { type: string, format: uuid, description: "Identifies the credential, for example when revoking it." }
        token: { type: string, description: The secret. It appears only in this response and cannot be retrieved again., example: whc_live_3f6b9c1d0e7a4b2c }
        expires_at: { type: string, format: date-time, description: When the credential stops working. }
    Principal:
      type: object
      description: The identity the API checks permissions against. A person acting through a session, or a machine acting through a credential.
      required: [actor_type, actor_id, organization_id, permissions, grants, auth]
      properties:
        actor_type: { type: string, enum: [human, agent, system, gateway], example: human, description: "`human` for a signed-in person, `agent` for an agent credential, `gateway` for the chokepoint MCP gateway acting for the organization with the deployment's gateway token, `system` for actions the provider takes on its own." }
        actor_id: { type: string, format: uuid, description: "The user's id for a person, an internal id for an agent (address agents by `agent_slug`), or the literal `gateway` for the gateway." }
        organization_id: { type: string, format: uuid, description: The organization every call is scoped to. }
        membership_id: { type: string, format: uuid, description: "The person's membership in the organization. Present for a person only." }
        agent_instance_id: { type: string, format: uuid, description: "The instance the credential belongs to. Present for an agent only." }
        agent_slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          example: claude-code
          description: "The agent's slug. Present for an agent only."
        permissions:
          type: array
          description: "Every permission the actor holds at any scope, such as `request.decide`, sorted and without duplicates. Use it to decide what to show. Whether an action is allowed depends on `grants`."
          items: { type: string }
          example: [request.read, request.decide, agent.credential.issue]
        grants:
          type: array
          description: "Every permission the actor holds, each with the scope it applies at. Flattened from the role assignments."
          items: { $ref: "#/components/schemas/Grant" }
        team_ids:
          type: array
          description: "The teams the member belongs to. Escalation paths can route requests to a team."
          items: { type: string, format: uuid }
        auth: { $ref: "#/components/schemas/AuthContext" }
    Grant:
      type: object
      required: [permission, scope_kind]
      properties:
        permission: { type: string, description: A registry key such as request.decide, example: request.decide }
        scope_kind: { type: string, enum: [organization, team, agent, pipeline] }
        scope_id: { type: string, description: "The team id, agent slug, or pipeline key the grant applies to; absent at organization scope" }
    AuthContext:
      type: object
      description: How a principal was signed in when it acted.
      required: [method, assurance, authenticated_at]
      properties:
        method: { type: string, example: local_password, description: "How the principal signed in, for example `local_password`, `sso`, or `social_google`." }
        assurance: { type: string, example: strong, description: "The strength of that sign-in: `single_factor` or `strong`." }
        authenticated_at: { type: string, format: date-time, description: When the sign-in happened. }
        session_id: { type: string, format: uuid, description: "The session that acted, when a person did." }
        credential_id: { type: string, format: uuid, description: "The credential that acted, when an agent did." }
    Agent:
      type: object
      description: "An agent identity. The slug identifies it everywhere: URLs, role scopes, pipeline scopes, audit data and conditions. The name is a label for people."
      required: [slug, organization_id, created_by_actor_id, name, kind, status, created_at, updated_at]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          example: support-bot
          description: "The agent's identity, chosen once at creation. It never changes and is never reused, not even after the agent is archived."
        organization_id: { type: string, format: uuid }
        created_by_actor_id: { type: string, format: uuid, description: The membership or organization-key actor that created the agent. }
        name: { type: string, example: Support bot, description: "The display name. Reviewers see it on every request. Editable, and unique among the organization's live agents." }
        kind: { type: string, enum: [service, personal], description: "Whose behalf the agent's instances act on, chosen once. A `service` agent is one the organization runs, such as a support bot: its instances share one identity, administrators enroll them, and provisioner tokens mint them. A `personal` agent is one people run for themselves, such as a coding assistant: every instance belongs to the member who enrolled it, any active member may connect their own, and the instances are disabled when that member is removed. Personal agents have no provisioner tokens." }
        status: { type: string, enum: [active, disabled, archived], description: "A `disabled` agent's instances cannot authenticate until it is enabled again. An `archived` agent is retired: nothing of it authenticates, nothing can be enrolled under it, and its status cannot change until it is restored." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, description: "When the agent was archived. Present exactly when `status` is `archived`." }
    AgentInstance:
      type: object
      description: One running copy of an agent.
      required: [id, organization_id, agent_slug, name, status, metadata, created_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        agent_slug: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: The slug of the agent this is an instance of. }
        membership_id: { type: string, format: uuid, description: "The member this instance belongs to and acts for. Present exactly when the agent is `personal`." }
        name: { type: string, example: ci-runner-07, description: Unique within the agent. }
        status: { type: string, enum: [active, disabled], description: A disabled instance cannot create requests. }
        metadata: { type: object, additionalProperties: true, example: { region: eu-west }, description: The JSON stored when the instance was created. }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, description: The last time this instance called the API. }
        delivery: { $ref: "#/components/schemas/AgentInstanceDelivery" }
    AgentInstanceDelivery:
      type: object
      description: The verified receiver of an instance using asynchronous mode, returned when the instance is created. The signing secret is never returned.
      required: [type, url, registration_id]
      properties:
        type: { type: string, enum: [webhook] }
        url: { type: string, format: uri, example: "https://harness.example.com/aap/events" }
        registration_id: { type: string, format: uuid }
    AgentInstanceDeliveryInput:
      type: object
      description: "A webhook receiver for asynchronous mode. Install the registration ID and signing secret on the receiver before calling: the verification message names the registration so the receiver can pick the secret before it knows the instance ID."
      required: [type, url, registration_id, signing_secret]
      additionalProperties: false
      properties:
        type: { type: string, enum: [webhook], description: The only delivery type offered. Another value answers `400` with code `unsupported_delivery_type`. }
        url: { type: string, format: uri, example: "https://harness.example.com/aap/events", description: "The exact HTTPS receiver URL. Private, loopback and other non-public addresses are refused, and redirects are not followed." }
        registration_id: { type: string, format: uuid, description: A UUID you generate for this configuration and associate with the secret on the receiver. It is echoed in the verification message. }
        signing_secret: { type: string, writeOnly: true, pattern: '^whsec_[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$', description: "`whsec_` followed by 32 random bytes in padded base64. Use a separate secret for each instance. It is never returned." }
    AgentInstanceRegistration:
      type: object
      description: A pending webhook registration. Configure your receiver with the registration ID and signing secret.
      required: [registration_id, signing_secret, expires_at]
      properties:
        registration_id: { type: string, format: uuid, description: "The ID the verification message names. Your receiver uses it to choose the signing secret." }
        signing_secret: { type: string, pattern: '^whsec_[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$', description: "The receiver's signing secret: `whsec_` followed by 32 random bytes in padded base64. It is never returned again." }
        expires_at: { type: string, format: date-time, description: When the registration can no longer be completed. }
    AgentInstanceRegistrationDelivery:
      type: object
      description: The receiver for a registration you started. It is verified before the instance is created.
      required: [registration_id, url]
      properties:
        registration_id: { type: string, format: uuid, description: The registration's ID. }
        url: { type: string, format: uri, example: "https://harness.example.com/aap/events", description: "The exact HTTPS receiver URL. Private, loopback and other non-public addresses are refused, and redirects are not followed." }
    AgentCredentialState:
      type: object
      description: One instance credential as the agent page shows it. The token is never included. A credential is live while it is neither expired nor revoked.
      required: [id, issued_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: When the credential stops working. }
        last_used_at: { type: string, format: date-time, description: The last authenticated call made with it. }
        revoked_at: { type: string, format: date-time, description: When it was revoked. Absent while it is not. }
    AgentSummary:
      description: One row of the agent list. An agent with its instance and request counts.
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [instance_count, live_instance_count, recent_request_count, pending_request_count, request_trend]
          properties:
            instance_count: { type: integer, minimum: 0, description: How many instances the agent has. }
            live_instance_count: { type: integer, minimum: 0, description: How many instances are active and hold a credential that is neither expired nor revoked. }
            last_seen_at: { type: string, format: date-time, description: The newest authenticated call from any instance. Absent when the agent has no instances. }
            recent_request_count: { type: integer, minimum: 0, description: Requests made in the last seven days. }
            pending_request_count: { type: integer, minimum: 0, description: Requests still waiting for a decision. }
            request_trend:
              type: array
              minItems: 7
              maxItems: 7
              items: { type: integer, minimum: 0 }
              description: The recent requests split into one bucket per day, oldest first. The last entry is the past 24 hours.
    AgentInstanceDetail:
      description: An instance with its credential history.
      allOf:
        - $ref: "#/components/schemas/AgentInstance"
        - type: object
          required: [credentials, recent_request_count, request_trend]
          properties:
            owner_display_name: { type: string, description: "The name of the member a personal instance belongs to. Absent for a service agent's instance." }
            credentials:
              description: Every credential the instance has held, newest first. Tokens are never included.
              type: array
              items: { $ref: "#/components/schemas/AgentCredentialState" }
            recent_request_count: { type: integer, minimum: 0, description: Requests this instance made in the last seven days. }
            request_trend:
              type: array
              minItems: 7
              maxItems: 7
              items: { type: integer, minimum: 0 }
              description: The instance's recent requests split into one bucket per day, oldest first. The last entry is the past 24 hours.
    AgentDetail:
      description: An agent with a page of instances, aggregate counts, and provisioner tokens.
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [created_by_display_name, instances, provisioners, provisioner_count, matching_provisioner_count, instance_count, live_instance_count, matching_instance_count, request_count, recent_request_count, pending_request_count]
          properties:
            provisioner_count: { type: integer, minimum: 0, description: All provisioner tokens owned by this agent. }
            matching_provisioner_count: { type: integer, minimum: 0, description: Tokens matching the current identifier and status filters before pagination. }
            instance_count: { type: integer, minimum: 0, description: All instances owned by this agent. }
            live_instance_count: { type: integer, minimum: 0, description: Active instances with at least one live credential across all pages. }
            matching_instance_count: { type: integer, minimum: 0, description: Instances matching the current search and status filters before pagination. }
            request_count: { type: integer, minimum: 0, description: All requests made by this agent. }
            created_by_actor_type: { type: string, enum: [human, api_key] }
            created_by_display_name: { type: string, description: The name of the human or organization key that created the agent. }
            instances:
              type: array
              description: The requested page of instances, sorted by last seen, creation time, and id, newest first.
              items: { $ref: "#/components/schemas/AgentInstanceDetail" }
            provisioners:
              type: array
              description: The requested page of provisioner tokens, sorted by issued time and id, newest first. Secrets are never included.
              items: { $ref: "#/components/schemas/AgentProvisioner" }
            recent_request_count: { type: integer, minimum: 0, description: Requests made in the last seven days. }
            pending_request_count: { type: integer, minimum: 0, description: Requests still waiting for a decision. }
    EnrollmentPreview:
      type: object
      required: [runtime, instance_name, expires_at, status]
      properties:
        runtime: { type: string }
        instance_name: { type: string }
        requested_agent_slug: { type: string }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, authorized, consumed] }
        agent: { $ref: "#/components/schemas/Agent" }
    AgentEnrollmentCredential:
      type: object
      description: The selected parent agent, its new instance, and the instance credential shown once.
      required: [agent, agent_instance, credential]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        agent_instance: { $ref: "#/components/schemas/AgentInstance" }
        credential: { $ref: "#/components/schemas/IssuedCredential" }
    AgentInstanceCredential:
      type: object
      description: A newly registered instance and its credential.
      required: [agent_instance, credential]
      properties:
        agent_instance: { $ref: "#/components/schemas/AgentInstance" }
        credential: { $ref: "#/components/schemas/IssuedCredential" }
    AgentProvisioner:
      type: object
      description: A provisioner token as the agent page shows it. The token is never included.
      required: [id, organization_id, agent_slug, created_by_actor_id, issued_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        agent_slug: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: The slug of the agent the token creates instances of. }
        created_by_actor_id: { type: string, format: uuid, description: The membership or organization-key actor that created the token. }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: When the token stops working. }
        last_used_at: { type: string, format: date-time, description: The last time the token created an instance. }
        revoked_at: { type: string, format: date-time, description: When it was revoked. Absent while it is not. }
    AgentProvisionerCredential:
      type: object
      description: A newly created provisioner and its token.
      required: [provisioner, credential]
      properties:
        provisioner: { $ref: "#/components/schemas/AgentProvisioner" }
        credential: { $ref: "#/components/schemas/IssuedCredential" }
    AgentInstanceSelf:
      type: object
      description: The identity an instance credential resolves to.
      required: [agent_slug, agent_instance_id]
      properties:
        agent_slug: { type: string, example: claude-code }
        agent_instance_id: { type: string, format: uuid }
    ToolPresentationKind:
      type: string
      description: "How one argument renders. `text` is a short value; `prose` long plain text; `markdown` and `html` are rendered (HTML in a sandbox that runs no script and loads nothing, with the source one click away); `code` is a mono block labelled with `language`; `shell` a command line; `diff` a unified diff at `path` or the pair at `before` and `after`; `path` a file path; `url` a link shown, never followed; `email` an address; `reference` an opaque identifier; `enum` a badge; `datetime` an instant in the reader's locale; `list` an array rendered per `item`; `json` pretty-printed structure."
      enum: [text, prose, markdown, html, code, shell, diff, path, url, email, reference, enum, datetime, list, json]
    ToolPresentationField:
      type: object
      description: One rendered argument. A field whose path is absent from a request's arguments is skipped; arguments no field names still show after the named ones, rendered by shape.
      required: [kind]
      properties:
        path: { type: string, example: /body, description: "A JSON pointer into the arguments. Required unless the field is a diff pair. Inside a list's `item` it is relative to the element (no leading slash; empty means the element itself)." }
        label: { type: string, example: Body, description: Replaces the humanised key. }
        kind: { $ref: "#/components/schemas/ToolPresentationKind" }
        language: { type: string, example: python, description: Labels a `code` field for the reader. }
        before: { type: string, example: /old_string, description: "For `diff`: the pointer to the text before the change. Requires `after`; excludes `path`." }
        after: { type: string, example: /new_string, description: "For `diff`: the pointer to the text after the change." }
        item:
          description: "For `list`: how each element renders, with paths relative to the element. Omitted, each element is text. An item cannot itself be a list of items."
          $ref: "#/components/schemas/ToolPresentationField"
        role: { type: string, enum: [primary, detail], default: primary, description: "`primary` fields make up the block a reviewer reads first; `detail` fields fold away underneath it." }
    ToolPresentationSpec:
      type: object
      description: One tool's presentation.
      required: [fields]
      properties:
        title: { type: string, maxLength: 200, example: "Edit {{/file_path}}", description: "What the request is called in place of the humanised tool name. May interpolate scalar arguments as `{{/path}}`; when every placeholder is absent the client falls back to the tool name." }
        fields:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/ToolPresentationField" }
    ResolvedToolPresentation:
      type: object
      description: The presentation a request renders with and where it came from.
      required: [source, fields]
      properties:
        source: { type: string, enum: [built_in, organization], description: "`organization` for one of the organization's own entries, `built_in` for the shipped catalog." }
        id: { type: string, format: uuid, description: "The organization entry, when the source is `organization`." }
        title: { type: string, example: "Edit {{/file_path}}" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ToolPresentationField" }
    ToolPresentationBinding:
      type: object
      description: Which calls a presentation applies to. Empty `runtime` and `server` match any; `tool` is exact. The most specific match wins, a server binding counting for more than a runtime one; an organization entry always wins over a shipped one.
      required: [tool]
      properties:
        runtime: { type: string, example: claude-code, description: "The runtime the request's adapter reported, or else the agent's slug. Omit to match any." }
        server: { type: string, example: github, description: "The MCP server alias the adapter reported. Omit to match any, including built-in tools." }
        tool: { type: string, example: create_issue, description: The canonical tool name. }
    ToolPresentationInput:
      allOf:
        - $ref: "#/components/schemas/ToolPresentationBinding"
        - type: object
          required: [spec]
          properties:
            spec: { $ref: "#/components/schemas/ToolPresentationSpec" }
    ToolPresentation:
      allOf:
        - $ref: "#/components/schemas/ToolPresentationInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    BuiltInToolPresentation:
      allOf:
        - $ref: "#/components/schemas/ToolPresentationBinding"
        - type: object
          required: [spec]
          properties:
            spec: { $ref: "#/components/schemas/ToolPresentationSpec" }
    CreateApproval:
      type: object
      additionalProperties: false
      required: [tool, arguments, timeout]
      properties:
        tool: { type: string, example: issue_refund, description: "The name under which the tool is defined: the name an MCP server advertises in `tools/list`, or the runtime's own name for a built-in tool such as `Bash`. Never the runtime's joined spelling such as `mcp__stripe__issue_refund`." }
        server: { type: string, example: stripe, description: "The alias of the MCP server that defines the tool, as the runtime configured it. Present only for tools served over MCP. A label the adapter observed, not a verified identity." }
        arguments:
          type: object
          additionalProperties: true
          description: The exact arguments the tool will run with if approved. Reviewers see this as the description of the action, so it must be complete.
          example: { amount: 4900, reason: duplicate_charge }
        agent_reasoning:
          type: string
          description: The agent's own explanation of why it wants to do this. Reviewers see it as a claim from the agent, separate from the arguments.
          example: Refunding the duplicate charge for jane@northwind.com.
        context:
          type: object
          additionalProperties: true
          description: "Where the call comes from, as observed by the adapter rather than stated by the agent: for example the runtime, session id, or working directory."
          example: { run_id: "4821", framework: claude-code }
        timeout: { type: string, example: 30m, description: "How long the request may wait for a decision, as a duration such as `30m` or `24h`. Between one second and seven days. Once it passes, the request expires." }
    AAPInstance:
      example: {"id": "b29a43a7-1949-4b9f-9d61-b7ae66f85d31", "name": "ci-runner-07", "delivery": {"type": "webhook", "url": "https://harness.example.com/aap/events", "registration_id": "8246931c-4ce0-4c15-a94a-e9c078ad06e2"}}
      type: object
      additionalProperties: false
      required: [id, name]
      description: An instance as the Agent Approval Protocol returns it to a provisioner. Credentials and the signing secret are never included.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, description: Unique within the agent. }
        delivery: { $ref: "#/components/schemas/AgentInstanceDelivery", description: Absent when the instance has no receiver. }
    AAPProvisionedInstance:
      example: {"instance": {"id": "b29a43a7-1949-4b9f-9d61-b7ae66f85d31", "name": "ci-runner-07"}, "credential": {"token": "whc_live_3f6b9c1d0e7a4b2c", "expires_at": "2026-09-18T12:00:00Z"}}
      type: object
      additionalProperties: false
      required: [instance, credential]
      description: A provisioned instance and its credential.
      properties:
        instance: { $ref: "#/components/schemas/AAPInstance" }
        credential:
          type: object
          additionalProperties: false
          required: [token]
          properties:
            token: { type: string, minLength: 1, description: The instance credential. Only a replay with the same provisioner token and idempotency key returns it again. }
            expires_at: { type: string, format: date-time, description: When the credential stops working. }
    AAPDecision:
      example: {"status": "approved", "note": "Refund the duplicate charge.", "decided_at": "2026-09-17T12:02:00Z", "expires_at": "2026-09-17T12:07:00Z"}
      type: object
      additionalProperties: false
      required: [status, decided_at]
      description: "Immutable decision. An approved call must start before expires_at: 30 minutes after decided_at when the instance had webhook delivery at decision time, five minutes otherwise. Reads and retries never extend expires_at."
      properties:
        status: { type: string, enum: [approved, denied, expired, cancelled] }
        note: { type: string }
        decided_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
      oneOf:
        - properties:
            status: { const: approved }
          required: [expires_at]
        - properties:
            status: { enum: [denied, expired, cancelled] }
            expires_at: false
    AAPApprovalRequest:
      example: {"id": "7ab8c8ec-7b2d-4fd6-9b52-752f9515eb71", "tool": "issue_refund", "arguments": {"amount": 4900, "reason": "duplicate_charge"}, "timeout": "30m", "status": "pending", "created_at": "2026-09-17T12:00:00Z", "deadline_at": "2026-09-17T12:30:00Z"}
      type: object
      additionalProperties: false
      required: [id, tool, arguments, timeout, status, created_at, deadline_at]
      description: Submitted fields are immutable. Timeout preserves the submitted duration text. Request idempotency is scoped to the authenticated instance; another instance cannot read or cancel it.
      properties:
        id: { type: string, format: uuid }
        tool: { type: string }
        server: { type: string }
        arguments: { type: object, additionalProperties: true }
        timeout: { type: string, example: 300s }
        agent_reasoning: { type: string }
        context: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, approved, denied, expired, cancelled] }
        created_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        decision: { $ref: "#/components/schemas/AAPDecision" }
        consumption: { $ref: "#/components/schemas/AAPConsumption" }
      oneOf:
        - properties:
            status: { const: pending }
            decision: false
            consumption: false
        - required: [decision]
          properties:
            status: { const: approved }
            decision:
              properties:
                status: { const: approved }
        - required: [decision]
          properties:
            status: { const: denied }
            decision:
              properties:
                status: { const: denied }
            consumption: false
        - required: [decision]
          properties:
            status: { const: expired }
            decision:
              properties:
                status: { const: expired }
            consumption: false
        - required: [decision]
          properties:
            status: { const: cancelled }
            decision:
              properties:
                status: { const: cancelled }
            consumption: false
    AAPConsumption:
      example: {"consumed_at": "2026-09-17T12:02:04Z", "outcome": {"status": "succeeded", "note": "Refund issued", "reported_at": "2026-09-17T12:02:06Z"}}
      type: object
      additionalProperties: false
      required: [consumed_at]
      description: "The creating instance used the approval. Present only once an approved request was consumed. An adapter that finds a consumption it did not make treats the approval as used."
      properties:
        consumed_at: { type: string, format: date-time }
        outcome: { $ref: "#/components/schemas/AAPOutcome" }
    AAPOutcome:
      example: {"status": "succeeded", "note": "Refund issued", "reported_at": "2026-09-17T12:02:06Z"}
      type: object
      additionalProperties: false
      required: [status, reported_at]
      description: How the approved call went, as the adapter reported it. For the record only.
      properties:
        status: { type: string, enum: [succeeded, failed] }
        note: { type: string, minLength: 1, maxLength: 1000 }
        reported_at: { type: string, format: date-time }
    ReportApprovalOutcome:
      example: {"status": "succeeded", "note": "Refund issued"}
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [succeeded, failed], description: Whether the approved call succeeded. }
        note: { type: string, minLength: 1, maxLength: 1000, description: "A short note about the result, such as an error message or a reference." }
    ApprovalRequest:
      type: object
      required: [id, organization_id, agent_slug, agent_instance_id, agent_name, agent_instance_name, tool, arguments, status, deadline_at, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        agent_slug: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', example: support-agent, description: The slug of the agent that made the request. }
        agent_instance_id: { type: string, format: uuid, description: The running copy of the agent that made the request. }
        agent_name: { type: string, example: support-agent, description: The agent's name when the request was made. }
        agent_instance_name: { type: string, example: ci-runner-07, description: The instance's name when the request was made. }
        requester_membership_id: { type: string, format: uuid, description: "The member the instance acts for, when the agent is personal: the owner of the instance at the time the request was made. Absent for a service agent's request, and absent from the response that creates the request." }
        tool: { type: string, example: issue_refund, description: "The tool the agent wants to call, as the server that defines it names it." }
        server: { type: string, example: stripe, description: "The MCP server that defines the tool, as the adapter reported it. Absent for a runtime's built-in tools." }
        arguments: { example: { amount: 4900, reason: duplicate_charge }, description: The exact arguments the tool will run with if approved. }
        agent_reasoning: { type: string, example: Refunding the duplicate charge for jane@northwind.com., description: "The agent's own explanation, if it gave one." }
        context: { example: { run_id: "4821", framework: claude-code }, description: "Where the call comes from, as recorded by the adapter." }
        status: { type: string, enum: [pending, approved, denied, expired, cancelled], example: approved, description: "`pending` while waiting for a decision, then one of the four final states. `cancelled` means the requesting instance withdrew it; treat it as a denial." }
        deadline_at: { type: string, format: date-time, example: "2026-09-09T12:00:00Z", description: "When the request expires if nobody has decided: `created_at` plus the timeout." }
        created_at: { type: string, format: date-time, example: "2026-09-08T12:00:00Z" }
        decision:
          description: Present once the request has been decided.
          $ref: "#/components/schemas/Decision"
        consumption:
          description: "Present once the agent used the approval to run the call, with the call's outcome if the agent reported it."
          $ref: "#/components/schemas/AAPConsumption"
    QueueApprovalRequest:
      description: "An approval request as reviewers see it: the request itself plus the claim a reviewer holds on it, if any. Agents never see claims."
      allOf:
        - $ref: "#/components/schemas/ApprovalRequest"
        - type: object
          required: [updated_at]
          properties:
            updated_at: { type: string, format: date-time, example: "2026-09-08T12:05:00Z", description: "Moves on every change a reviewer should notice, escalation progress included, so a client refetches the review when it changes." }
            claim:
              description: "The live claim on the request. Absent when nobody holds one."
              $ref: "#/components/schemas/Claim"
            requester_display_name: { type: string, example: Chris, description: "The name of the member a personal instance acted for. Absent for a service agent's request." }
            presentation:
              description: "How to show the arguments: the resolved tool presentation, from the organization's own entries or the shipped catalog. Absent when neither names the tool, in which case the client renders the arguments by their shape. A reading aid only: the arguments stay the complete description of the action, and a presentation never hides one."
              $ref: "#/components/schemas/ResolvedToolPresentation"
    Claim:
      type: object
      description: "A reviewer's claim on a pending request: an advisory marker that they are looking at it. Absent once released, lapsed, or the request is no longer pending."
      required: [id, membership_id, claimed_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        membership_id: { type: string, format: uuid, description: The reviewer holding the claim. }
        display_name: { type: string, example: Chris, description: The reviewer's name. }
        claimed_at: { type: string, format: date-time, example: "2026-09-08T12:01:30Z" }
        expires_at: { type: string, format: date-time, example: "2026-09-08T12:16:30Z", description: When the claim lapses on its own. }
    NotificationRule:
      type: object
      required: [delay_seconds, contact_method_id]
      properties:
        delay_seconds: { type: integer, minimum: 0, maximum: 86400 }
        contact_method_id:
          type: [string, "null"]
          description: A contact method you hold, or null for the account email.
    NotificationRules:
      type: object
      required: [standard, interrupt, customized]
      properties:
        standard:
          type: array
          items: { $ref: "#/components/schemas/NotificationRule" }
        interrupt:
          type: array
          items: { $ref: "#/components/schemas/NotificationRule" }
        customized:
          type: object
          required: [standard, interrupt]
          properties:
            standard: { type: boolean }
            interrupt: { type: boolean }
    ContactMethod:
      type: object
      description: Somewhere a person can be reached. Only verified methods are delivered to.
      required: [id, kind, value, verified, available, primary, created_at]
      properties:
        id: { type: string, description: "The literal \"primary\" for the account address, otherwise a uuid." }
        kind:
          type: string
          description: "email, slack, discord, or a kind the edition registers (the hosted edition's sms, whatsapp, and push). An email method belongs to the person everywhere and is proved by a code sent to it; slack and discord methods are their identity in one organization's connected workspace or server, linked by matching addresses (slack) or by the person authorizing their account (discord). An edition's kinds say for themselves whether they are typed in and proved by a code or vouched for on creation."
        value: { type: string, description: "An address, a Slack user id, a Discord user id, or the value an edition's kind takes (a phone number in international format, an app installation id)." }
        organization_id: { type: string, format: uuid, description: Set for organization-scoped kinds only. }
        label: { type: string, description: A display name for kinds whose value is an opaque id. }
        available: { type: boolean, description: "Whether this verified method can currently receive notifications. Slack also requires an active connection and a member match in its current installation." }
        verified: { type: boolean }
        verified_at: { type: string, format: date-time }
        primary:
          type: boolean
          description: The account's own address, verified by sign-in and not removable here.
        created_at: { type: string, format: date-time }
    Decision:
      type: object
      description: The outcome of an approval request and who produced it.
      required: [id, request_id, organization_id, status, channel, authentication, idempotency_key, decided_at]
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        membership_id: { type: string, format: uuid, description: "The member who decided. Absent when the pipeline decided, the request expired, or the agent cancelled it." }
        status: { type: string, enum: [approved, denied, expired, cancelled] }
        note: { type: string, example: "OK, but flag this account for review.", description: "A note the reviewer left for the agent, if any." }
        channel: { type: string, example: web, description: "Where the decision was made, as reported by the client, for example `web` or `slack`. `pipeline` when the pipeline decided, `system` when the request expired, `aap` when the agent cancelled it." }
        reviewer_display_name: { type: string, example: Chris, description: "The reviewer's name, when a person decided." }
        reviewer_email: { type: string, format: email, description: "The reviewer's email, when a person decided." }
        authentication: { $ref: "#/components/schemas/AuthContext", description: How the reviewer was signed in at the time. }
        idempotency_key: { type: string, example: decision-7ab8c8ec, description: The key the decision was recorded with. }
        decided_at: { type: string, format: date-time }
    DecisionOperation:
      type: object
      description: "The record of one decision call and its outcome."
      required: [id, organization_id, request_id, status, created_at]
      properties:
        id: { type: string, format: uuid, description: "The operation's id. The decision itself has its own." }
        organization_id: { type: string, format: uuid }
        request_id: { type: string, format: uuid, description: The request that was decided. }
        status: { type: string, enum: [pending, applied, rejected], example: applied, description: "`applied` once the decision is stored. A `200` response always says `applied`: the call waits for the outcome, and a rejected decision comes back as an error." }
        error_code: { type: string, description: "Why the decision was rejected. Set for `rejected` only." }
        error_message: { type: string, description: "The rejection in plain text. Set for `rejected` only." }
        decision: { description: The stored decision., $ref: "#/components/schemas/Decision" }
        created_at: { type: string, format: date-time, example: "2026-09-08T12:02:11Z" }
        completed_at: { type: string, format: date-time, example: "2026-09-08T12:02:11Z", description: When the decision was stored. }
    Membership:
      type: object
      description: A person's membership of the organization, as stored.
      required: [id, user_id, organization_id, status, admission_source, directory_managed, assignments]
      properties:
        id: { type: string, format: uuid, description: "The membership id. Other endpoints refer to a member by this id." }
        user_id: { type: string, format: uuid, description: "The person's user id, shared across organizations." }
        organization_id: { type: string, format: uuid }
        status: { type: string, enum: [active, suspended, deprovisioned], description: "`active` can sign in and act. `suspended` cannot until reactivated. `deprovisioned` was removed and is kept for the record." }
        admission_source: { type: string, enum: [manual, invite, sso_jit, directory], description: "How the person joined: added by hand, by accepting an invitation, on first SSO sign-in, or by directory sync." }
        directory_managed: { type: boolean, description: "Whether your directory owns this membership. Status changes here are refused." }
        assignments:
          type: array
          description: The roles the member holds, directly and through their teams.
          items: { $ref: "#/components/schemas/RoleAssignment" }
        team_ids:
          type: array
          description: The teams the member is on.
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Member:
      type: object
      description: A member as shown in the member list, with their name and email.
      required: [id, display_name, email, status, assignments, admission_source, directory_managed, team_ids, created_at]
      properties:
        id: { type: string, format: uuid, description: "The membership id. Other endpoints refer to a member by this id." }
        display_name: { type: string, example: Ada Lovelace }
        email: { type: string, example: ada@example.com }
        status: { type: string, enum: [active, suspended, deprovisioned], description: "`active` can sign in and act. `suspended` cannot until reactivated. `deprovisioned` was removed and is kept for the record." }
        assignments:
          type: array
          description: The roles the member holds, directly and through their teams.
          items: { $ref: "#/components/schemas/RoleAssignment" }
        admission_source: { type: string, enum: [manual, invite, sso_jit, directory], description: "How the person joined: added by hand, by accepting an invitation, on first SSO sign-in, or by directory sync." }
        directory_managed: { type: boolean, description: "Whether your directory owns this membership. Status changes here are refused." }
        team_ids:
          type: array
          description: The teams the member is on.
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    WebhookEndpointSummary:
      type: object
      additionalProperties: false
      required: [endpoint_key, name, url, latest_revision, revision_count, latest_created_at, secret_rotated_at, uses]
      description: One webhook endpoint and a summary of its history.
      properties:
        endpoint_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
        name: { type: string, description: The name from the latest revision. }
        url: { type: string, format: uri, description: The URL from the latest revision. }
        active_revision: { type: integer, format: int64, minimum: 1, description: The revision deliveries go to. Absent while the endpoint is archived or no revision has been activated yet. }
        archived_at: { type: string, format: date-time, description: "When the endpoint was archived. Absent for a live endpoint, including one whose revisions are all drafts. Cleared when a revision is activated again." }
        latest_revision: { type: integer, format: int64, minimum: 1, description: "The newest revision, active or not." }
        revision_count: { type: integer, format: int64, minimum: 1 }
        latest_created_at: { type: string, format: date-time, description: When the newest revision was created. }
        secret_rotated_at: { type: string, format: date-time, description: When the signing secret was last created or rotated. }
        uses:
          type: array
          description: The active pipeline revisions that post to the endpoint. Empty when it can be archived.
          items: { $ref: "#/components/schemas/PipelineUse" }
    WebhookEndpointRevision:
      type: object
      additionalProperties: false
      required: [id, endpoint_key, revision, is_active, name, url, created_by_actor_id, created_at]
      description: One revision of a webhook endpoint, a name and a URL. The signing secret belongs to the endpoint key, not to a revision. It is never included, except once, in the response that created the endpoint's first revision.
      properties:
        id: { type: string, format: uuid }
        endpoint_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
        revision: { type: integer, format: int64, minimum: 1, description: The revision number. Revisions count up from 1. }
        is_active: { type: boolean, description: Whether deliveries go to this revision. }
        name: { type: string, example: Fraud check, description: The display name. }
        url: { type: string, format: uri, example: "https://fraud.example.com/approvals", description: Where deliveries go. }
        created_by_actor_id: { type: string, format: uuid, description: The membership or organization-key actor that created the revision. }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, description: "When the revision was first active. Absent for a draft, which can still be changed." }
        signing_secret:
          type: string
          example: whsec_9f2c1b7e4d3a4f8b
          description: "Present only in the response that created the endpoint's first revision. Starts with `whsec_`. Your receiver uses it to verify the `WithHuman-Signature` header."
    WebhookEndpointDocument:
      type: object
      additionalProperties: false
      description: The content of a new webhook endpoint revision.
      required: [name, url]
      properties:
        name: { type: string, minLength: 1, example: Fraud check, description: A display name. Pipeline authors see it when they pick an endpoint. }
        url: { type: string, format: uri, example: "https://fraud.example.com/approvals", description: "An absolute public HTTPS URL. It is checked against the egress policy, which refuses private and internal addresses." }
    WebhookEndpointSecret:
      type: object
      additionalProperties: false
      description: A freshly rotated signing secret.
      required: [endpoint_key, signing_secret, secret_rotated_at]
      properties:
        endpoint_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
        signing_secret:
          type: string
          example: whsec_9f2c1b7e4d3a4f8b
          description: "The new secret. It appears only in this response. Starts with `whsec_`. Your receiver uses it to verify the `WithHuman-Signature` header."
        secret_rotated_at: { type: string, format: date-time, description: When the secret was rotated. }
    PipelineUse:
      type: object
      required: [pipeline_id, pipeline_key, revision]
      description: One place an active pipeline revision uses a shared object, an escalation path, a webhook endpoint, or another pipeline.
      properties:
        pipeline_id: { type: string, format: uuid }
        pipeline_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: The pipeline whose revision uses the object. }
        revision: { type: integer, format: int64, description: The active revision number. }
        block_key: { type: string, description: The block that uses the object. Absent when the revision names an escalation path as its default. }
    PipelineReferences:
      type: object
      required: [escalation_paths, webhook_endpoints, pipelines, blocks, activatable]
      description: What one pipeline revision depends on, and whether each dependency is in place right now. activatable is false while any entry would refuse activation.
      properties:
        pipelines:
          type: array
          description: The pipelines the revision's delegate blocks hand requests to.
          items:
            type: object
            required: [pipeline_key, block_keys, exists, active]
            properties:
              pipeline_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
              name: { type: string, description: The active revision's name. Absent while none is active. }
              block_keys: { type: array, items: { type: string }, description: The delegate blocks that name the pipeline. }
              exists: { type: boolean, description: Whether the pipeline has a live revision (neither never created nor archived). }
              active: { type: boolean, description: Whether a revision of the pipeline is active. }
        escalation_paths:
          type: array
          description: The escalation paths the revision names.
          items:
            type: object
            required: [path_key, block_keys, default, exists, active]
            properties:
              path_key: { type: string }
              block_keys: { type: array, items: { type: string }, description: "The blocks whose `human` outcome names the path." }
              default: { type: boolean, description: Whether the revision names the path as its default. }
              exists: { type: boolean, description: Whether at least one revision of the path exists. }
              active: { type: boolean, description: Whether a revision of the path is active. }
        webhook_endpoints:
          type: array
          description: The webhook endpoints the revision posts to.
          items:
            type: object
            required: [endpoint_key, block_keys, exists, active]
            properties:
              endpoint_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
              name: { type: string, description: The active revision's name. Absent while none is active. }
              block_keys: { type: array, items: { type: string }, description: The webhook blocks that post to the endpoint. }
              exists: { type: boolean, description: Whether at least one revision of the endpoint exists. }
              active: { type: boolean, description: Whether a revision of the endpoint is active. }
        blocks:
          type: array
          description: Blocks the deployment or the plan cannot run right now.
          items:
            type: object
            required: [block_key, type, problem]
            properties:
              block_key: { type: string }
              type: { type: string, description: The kind of block. }
              problem: { type: string, description: "Why it cannot run. `plan`: the plan does not include it. `webhook_unconfigured`: the deployment has no secrets key. A kind the edition adds reports its own codes (the hosted judge's `llm_judge_unconfigured` and `judge_model_unavailable`)." }
        activatable: { type: boolean, description: Whether activating the revision would succeed right now. }
    WebhookEndpointTest:
      type: object
      required: [status_code, duration_ms]
      description: What one test delivery produced. problem is absent when the endpoint answered with a valid outcome.
      properties:
        status_code: { type: integer, description: The HTTP status the endpoint returned. }
        duration_ms: { type: integer, format: int64, description: "How long the call took, in milliseconds." }
        outcome: { type: string, enum: [next, human, approve, deny], description: "The outcome the endpoint answered with, when its answer was valid." }
        reason: { type: string, description: "The reason the endpoint gave, if any." }
        problem: { type: string, enum: [blocked, response_too_large, timeout, unreachable, status, invalid_answer], description: "What went wrong, if anything. `blocked`: the URL fails the egress policy. `response_too_large`: the body was over 64 KiB. `timeout`: no answer within 10 seconds. `unreachable`: the connection failed. `status`: the endpoint answered with a status outside 2xx. `invalid_answer`: the body was not a valid outcome document." }
        message: { type: string, description: "Details about the problem, in plain words." }
    Team:
      type: object
      description: A group of members. A team can be an escalation target, and its members inherit the roles it holds. A team may also own an escalation policy that runs when a path level names it.
      required: [id, name, directory_managed, member_count, assignments, escalation_policy, created_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Payments approvers }
        directory_managed:
          type: boolean
          description: Whether your directory owns this team. Such a team cannot be renamed or archived here.
        member_count: { type: integer, description: "How many members the team has, from every source." }
        assignments:
          type: array
          description: The roles the team holds. Every member inherits them.
          items: { $ref: "#/components/schemas/RoleAssignment" }
        escalation_policy: { $ref: "#/components/schemas/TeamEscalationPolicyStatus" }
        archived_at: { type: [string, "null"], format: date-time, description: "When the team was archived. Null for a live team." }
        created_at: { type: string, format: date-time }
    TeamEscalationPolicyStatus:
      type: object
      additionalProperties: false
      description: The team's escalation policy lineage. Both revisions are null when the team has never had a policy; active_revision alone is null when every revision is archived. Without an active revision a path level that targets the team notifies every member at once.
      required: [active_revision, latest_revision]
      properties:
        active_revision: { type: [integer, "null"], format: int64, minimum: 1 }
        latest_revision: { type: [integer, "null"], format: int64, minimum: 1 }
    TeamMember:
      type: object
      description: One member of a team.
      required: [membership_id, display_name, email, status, sources]
      properties:
        membership_id: { type: string, format: uuid }
        display_name: { type: string, example: Ada Lovelace }
        email: { type: string, example: ada@example.com }
        status: { type: string, enum: [active, suspended, deprovisioned], description: "The member's status in the organization." }
        sources:
          type: array
          description: "How the person got on the team: added by hand, by your directory, or both."
          items: { type: string, enum: [manual, directory] }
    Invitation:
      type: object
      description: An invitation to join the organization.
      required: [id, organization_id, email, grants, invited_by_membership_id, status, expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string, example: ada@example.com, description: "The address the invitation was sent to." }
        grants:
          type: array
          description: The roles the person receives when they accept.
          items: { $ref: "#/components/schemas/InvitationGrant" }
        invited_by_membership_id: { type: string, format: uuid, description: "The member who sent it." }
        status: { type: string, enum: [pending, accepted, revoked, expired], description: "`pending` can still be accepted. `accepted` and `revoked` are final. `expired` passed its expiry without being accepted." }
        expires_at: { type: string, format: date-time, description: "When the link stops working. Seven days from creation or the last resend." }
        accepted_membership_id: { type: string, format: uuid, description: "The membership created on acceptance. Present for `accepted` only." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InvitationWithURL:
      type: object
      description: An invitation and, on a deployment without email delivery, the link to send. Where email is configured the link goes only to the invitee's mailbox and this field is absent.
      required: [invitation]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        invite_url: { type: string, format: uri, description: "The link to send to the person. It contains the invitation's secret token, appears only in this response, and only on a deployment with no email delivery configured." }
    InvitationPreview:
      type: object
      required: [organization_name, organization_slug, email, grants, expires_at, sso_required, existing_user]
      properties:
        organization_name: { type: string }
        organization_slug: { type: string }
        inviter_display_name: { type: string }
        email: { type: string }
        grants:
          type: array
          items: { $ref: "#/components/schemas/InvitationGrant" }
        expires_at: { type: string, format: date-time }
        sso_required: { type: boolean, description: The organization signs in through SSO; the accept page routes there }
        existing_user: { type: boolean }
    SlackConnection:
      type: object
      description: A Slack workspace connected by an organization-level install. The bot token never leaves the server.
      required: [status, team_id, team_name, bot_user_id, scopes, installed_by_membership_id, installed_at, linked_members]
      properties:
        status: { type: string, enum: [connected, disconnected] }
        disconnected_at: { type: string, format: date-time }
        disconnect_reason: { type: string, description: "Reason for disconnection, such as user_disconnected, app_uninstalled, tokens_revoked, or token_revoked." }
        team_id: { type: string }
        team_name: { type: string }
        bot_user_id: { type: string }
        scopes:
          type: array
          items: { type: string }
        installed_by_membership_id: { type: string, format: uuid }
        installed_at: { type: string, format: date-time }
        linked_members:
          type: integer
          description: Active members whose Slack identity has been matched in this workspace.
    OAuthBeginRequest:
      type: object
      additionalProperties: false
      description: Where the browser comes back to after the provider's round trip. No body is the same as `settings`.
      properties:
        return_to:
          type: string
          enum: [settings, onboarding]
          description: "`settings` returns to the page the flow belongs to (Integrations for an install, Notifications for a link); `onboarding` returns to the guided setup at `/welcome`."
    DiscordConnection:
      type: object
      description: A Discord server connected by an organization-level install. The bot token is deployment configuration and never appears here.
      required: [guild_id, guild_name, installed_by_membership_id, installed_at, linked_members]
      properties:
        guild_id: { type: string }
        guild_name: { type: string }
        installed_by_membership_id: { type: string, format: uuid }
        installed_at: { type: string, format: date-time }
        linked_members:
          type: integer
          description: Active members who have linked their Discord account in this organization.
    RoleAssignment:
      type: object
      description: Permissions granted at one scope, with provenance.
      required:
      - id
      - organization_id
      - principal_kind
      - principal_id
      - scope_kind
      - source
      - created_at
      - permissions
      - is_owner
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        principal_kind:
          type: string
          enum:
          - membership
          - team
          - agent
          description: What holds the role.
        principal_id:
          type: string
          format: uuid
          description: The membership, team or agent that holds it.
        scope_kind:
          type: string
          enum:
          - organization
          - team
          - agent
          description: Where the role applies.
        scope_id:
          type: string
          description: The team id or the agent slug. Absent for `organization`.
        scope_name:
          type: string
          description: The team's name, for a team scope.
        source:
          type: string
          enum:
          - manual
          - directory
          description: Whether a person granted it or your directory did.
        source_key:
          type: string
          description: The directory group that produced it. Present for `directory` only.
        granted_by_actor_id:
          type: string
          format: uuid
          description: The member who granted it. Present for `manual` only.
        via_team_id:
          type: string
          format: uuid
          description: The team the role is inherited through. Present when a member holds it through a team rather than
            directly.
        via_team_name:
          type: string
          description: That team's name.
        created_at:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
        is_owner:
          type: boolean
        built_in_role:
          $ref: '#/components/schemas/RoleKey'
          description: The predefined role this assignment grants. Absent for a custom permission policy.
        permission_policy_id:
          type: string
          format: uuid
    RoleKey:
      type: string
      enum: [owner, admin, reviewer, auditor]
      description: A predefined role. `owner` is full control and only an owner may grant it; `admin` manages agents,
        pipelines, paths, members and teams; `reviewer` decides the requests routed to them; `auditor` reads everything
        without changing anything.
    Role:
      type: object
      required: [key, name, description, permissions, dangerous]
      properties:
        key: { $ref: '#/components/schemas/RoleKey' }
        name: { type: string, example: Reviewer }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
          description: Every permission the role holds, including the ones this edition registers.
        dangerous:
          type: boolean
          description: The role holds a sensitive permission, so granting it needs a fresh sign-in.
    InvitationGrant:
      type: object
      description: Permissions granted at one scope, with provenance.
      required:
      - scope_kind
      - permissions
      properties:
        role:
          $ref: '#/components/schemas/RoleKey'
          description: The predefined role the grant makes. Absent for custom permissions.
        role_name:
          type: string
          description: That role's name.
        scope_kind:
          type: string
          enum:
          - organization
          - team
          - agent
          description: Where the role applies.
        scope_id:
          type: string
          description: The team id or the agent slug. Absent for `organization`.
        permissions:
          type: array
          items:
            type: string
    PermissionDescriptor:
      type: object
      description: One permission a role can carry.
      required:
      - key
      - area
      - description
      - holders
      - resource
      - dangerous
      properties:
        key:
          type: string
          example: request.decide
          description: The permission key, shaped `resource.action`.
        area:
          type: string
          example: request
          description: The key's first segment, for grouping.
        description:
          type: string
          example: Approve or deny requests routed to you
          description: What the permission allows.
        holders:
          type: array
          description: 'Who can hold it: people, agents, or the gateway.'
          items:
            type: string
            enum:
            - human
            - agent
            - gateway
            - api_key
            - organization_api_key
        resource:
          type: string
          enum:
          - organization
          - team
          - agent
          - request
          - scope
          description: What kind of thing a check on this permission is about. A grant must cover that thing's scope.
        dangerous:
          type: boolean
          description: Whether granting or using it changes what other people can do, or cannot be undone. Such permissions
            need a fresh, strong sign-in to use and never arrive through directory sync or first SSO sign-in.
    DirectoryGroupLink:
      type: object
      description: 'One provider group as the admin sees it: which team it fills and, when mapped, the grant the team holds
        because of it.'
      required:
      - provider_object_id
      - team_id
      - team_name
      - updated_at
      properties:
        provider_object_id:
          type: string
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
        updated_at:
          type: string
          format: date-time
        permission_policy:
          nullable: true
          $ref: '#/components/schemas/PermissionPolicySpec'
    RuntimeConfig:
      type: object
      description: "What the frontend needs to know about this deployment before anyone signs in. An edition adds entries of its own (the hosted edition's signup_enabled, billing_enabled, and the phone and push channel flags); it never changes the ones listed here."
      additionalProperties: true
      required: [public_origin, version, bootstrap_enabled, custom_permissions_enabled, social_providers, password_login_offers_signup, webhook_enabled, slack_enabled, discord_enabled, agent_mcp_servers, update_checks_enabled]
      properties:
        public_origin: { type: string, format: uri }
        version: { type: string }
        bootstrap_enabled: { type: boolean, description: The first-owner ceremony accepts requests }
        custom_permissions_enabled: { type: boolean, description: "The edition offers custom permission policies beside the predefined roles: a member's or team's own policies, and invitations that carry them. The open edition offers predefined roles alone and reports false." }
        webhook_enabled: { type: boolean, description: "The deployment configured a secrets key, so webhook endpoints can be stored and webhook blocks can run" }
        discord_enabled: { type: boolean, description: "The deployment configured a Discord app, so an organization can connect a server and members can link their accounts" }
        slack_enabled: { type: boolean, description: "The deployment configured a Slack app, so an organization can connect a workspace and members can link their accounts" }
        cli_download_url: { type: string, format: uri, description: "Base URL serving install.sh and cli/<version>/ for the withhuman CLI" }
        password_login_offers_signup: { type: boolean, description: "A refused password login for an email without an account mails the address a link to create one. The response is the same invalid_credentials either way." }
        social_providers:
          type: array
          description: Social login providers registered by this edition, in display order
          items: { $ref: "#/components/schemas/SocialProvider" }
        agent_mcp_servers:
          type: array
          description: "MCP servers this deployment offers every enrolled agent (the hosted edition's gateway), which the withhuman CLI registers with each runtime it installs as its own relay, authenticated with the instance credential. Empty in the open edition."
          items: { $ref: "#/components/schemas/AgentMCPServer" }
        update_checks_enabled: { type: boolean, description: "The deployment's daily heartbeat reports the latest release and security advisories, which administrators read at /api/v1/installation. False in the hosted edition and when the operator turned telemetry off." }
    AgentMCPServer:
      type: object
      additionalProperties: false
      required: [name, url, label]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,62}$', example: withhuman, description: "The key the runtime knows the server by; it prefixes the server's tools in the runtime's tool names." }
        url: { type: string, format: uri, example: "https://app.withhuman.ai/gateway/mcp", description: The streamable HTTP endpoint. }
        label: { type: string, example: withHuman MCP gateway, description: What the CLI calls the server to a person. }
    SocialProvider:
      type: object
      required: [key, label]
      properties:
        key: { type: string, example: google }
        label: { type: string, example: Google }
    LoginOrganization:
      type: object
      required: [id, slug, name, sso]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sso: { type: boolean, description: Signs in through the enterprise SSO flow }
    EscalationPathSummary:
      type: object
      additionalProperties: false
      description: One escalation path and a summary of its history.
      required: [path_key, name, latest_revision, revision_count, latest_created_at]
      properties:
        path_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
        name: { type: string, description: The name from the latest revision. }
        active_revision: { type: integer, format: int64, minimum: 1, description: "The revision requests are routed with. Absent while no revision is active, which is always the case for an archived path." }
        latest_revision: { type: integer, format: int64, minimum: 1, description: "The newest revision, active or not." }
        revision_count: { type: integer, format: int64, minimum: 1 }
        latest_created_at: { type: string, format: date-time, description: When the newest revision was created. }
        archived_at: { type: string, format: date-time, description: When the path was archived. Absent for a live path. }
    EscalationPathRevisionSummary:
      type: object
      additionalProperties: false
      description: One escalation path revision, without its document.
      required: [id, path_key, revision, is_active, name, created_by_actor_id, created_at]
      properties:
        id: { type: string, format: uuid }
        path_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
        revision: { type: integer, format: int64, minimum: 1, description: The revision number. Revisions count up from 1. }
        is_active: { type: boolean, description: Whether requests are routed with this revision. }
        name: { type: string, example: On-call engineers, description: The display name. }
        created_by_actor_id: { type: string, format: uuid, description: The membership or organization-key actor that created the revision. }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, description: "When the revision was first active. Absent for a draft, which can still be changed." }
        archived_at: { type: string, format: date-time, description: "When the path was archived. Absent for a revision of a live path; an archived revision can no longer be activated." }
    EscalationPathRevision:
      description: One escalation path revision with its full document.
      allOf:
        - $ref: "#/components/schemas/EscalationPathRevisionSummary"
        - type: object
          required: [working_hours, nodes, document_version, warnings]
          properties:
            working_hours:
              type: array
              description: The named working-hours sets the nodes refer to.
              items: { $ref: "#/components/schemas/WorkingHoursSet" }
            nodes:
              type: array
              description: The nodes, in order.
              items: { $ref: "#/components/schemas/EscalationPathNode" }
            repeat: { $ref: "#/components/schemas/EscalationPathRepeat" }
            document_version: { type: integer, minimum: 1, description: The version of the document format. }
            warnings:
              type: array
              description: >-
                Advisory findings about the document's targets. They are
                computed when a revision is created or activated, and the
                list is empty on plain reads. A warning never blocks
                anything: a path narrows who decides, it never grants.
              items: { $ref: "#/components/schemas/EscalationPathWarning" }
    EscalationPathWarning:
      type: object
      description: One advisory finding about the document. The team fields are present only for findings about a team target.
      required: [code]
      properties:
        code:
          type: string
          enum: [team_members_cannot_decide, path_may_reach_nobody]
          description: "`team_members_cannot_decide`: `count` of the team's `member_count` members cannot decide requests, so routing to the team reaches fewer deciders than its size suggests. `path_may_reach_nobody`: some request's conditions leave no level to run, so such a request is routed to nobody and only break-glass reviewers can decide it; the team fields are absent."
        team_id: { type: string, format: uuid }
        team_name: { type: string }
        count: { type: integer, description: Members of the team who cannot decide requests. }
        member_count: { type: integer, description: Active members of the team. }
    EscalationPathDocument:
      type: object
      additionalProperties: false
      description: The complete content of a new escalation path revision.
      required: [name, working_hours, nodes]
      properties:
        name: { type: string, example: On-call engineers, description: A display name. Reviewers see it on the requests the path routes. }
        working_hours:
          type: array
          description: "Named working-hours sets that `if_else` and `defer` nodes refer to by id. May be empty."
          items: { $ref: "#/components/schemas/WorkingHoursSet" }
        nodes:
          type: array
          minItems: 1
          description: The nodes, in order. At least one.
          items: { $ref: "#/components/schemas/EscalationPathNode" }
        repeat: { $ref: "#/components/schemas/EscalationPathRepeat" }
    EscalationPathCreate:
      type: object
      additionalProperties: false
      description: The first revision's document plus the key it creates.
      required: [path_key, name, working_hours, nodes]
      properties:
        path_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
        name: { type: string }
        working_hours:
          type: array
          items: { $ref: "#/components/schemas/WorkingHoursSet" }
        nodes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EscalationPathNode" }
        repeat: { $ref: "#/components/schemas/EscalationPathRepeat" }
    WorkingHoursSet:
      type: object
      additionalProperties: false
      description: A named set of weekly hours in one timezone.
      required: [id, name, timezone, intervals]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', example: uk-office, description: "A key for the set, unique within the document." }
        name: { type: string, example: UK office hours, description: A display name. }
        timezone: { type: string, example: Europe/London, description: "An IANA timezone name, such as `Europe/London`." }
        intervals:
          type: array
          minItems: 1
          description: The open windows. At least one.
          items: { $ref: "#/components/schemas/WeekdayInterval" }
    WeekdayInterval:
      type: object
      additionalProperties: false
      description: One window that repeats every week.
      required: [weekdays, start, end]
      properties:
        weekdays:
          type: array
          minItems: 1
          description: The days the window applies to.
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "09:00", description: "When the window opens, as `HH:MM` in 24-hour time." }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "18:00", description: "When the window closes, as `HH:MM` in 24-hour time." }
    EscalationPathNode:
      type: object
      additionalProperties: false
      description: One node of an escalation path. The type picks the kind of node, and only that kind's fields may be set. A level node notifies its targets and waits for a decision. If nobody decides before escalate_after runs out, the path moves to the next node. An if_else node runs then when every condition holds, otherwise else. A defer node parks the request until a working-hours window opens, notifying nobody.
      required: [id, type]
      properties:
        id: { type: string, format: uuid, description: "An id for the node, unique within the path." }
        type: { type: string, enum: [level, if_else, defer], description: The kind of node. }
        targets:
          type: array
          description: "`level` only. The people and teams to notify."
          items: { $ref: "#/components/schemas/EscalationTarget" }
        escalate_after: { type: string, example: 15m, description: "`level` only. How long to wait for a decision before moving to the next node. A duration from `1m` to `168h`." }
        raise_urgency: { type: boolean, description: "`level` only. Raise the request to `interrupt` urgency before notifying." }
        conditions:
          type: array
          minItems: 1
          maxItems: 10
          description: "`if_else` only. Every condition must hold for `then` to run. From 1 to 10."
          items: { $ref: "#/components/schemas/EscalationPathCondition" }
        then:
          type: array
          description: "`if_else` only. The nodes to run when every condition holds. An empty list moves on to the next node."
          items: { $ref: "#/components/schemas/EscalationPathNode" }
        else:
          type: array
          description: "`if_else` only. The nodes to run otherwise. An empty list moves on to the next node."
          items: { $ref: "#/components/schemas/EscalationPathNode" }
        working_hours_id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: "`defer` only. The working-hours set to wait for." }
        standard_only: { type: boolean, description: "`defer` only. Let `interrupt` requests skip the wait." }
    EscalationPathCondition:
      type: object
      additionalProperties: false
      description: One test in an if_else node. The type picks the kind of test, and only that kind's fields may be set.
      required: [type]
      properties:
        type: { type: string, enum: [working_hours, urgency, request], description: "The kind of test. `working_hours` tests whether a named window is open. `urgency` tests the request's current urgency. `request` tests the request itself." }
        working_hours_id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: "`working_hours` only. The set to test." }
        active: { type: boolean, description: "`working_hours` only. `true` tests that the window is open, `false` that it is closed." }
        urgency: { type: string, enum: [standard, interrupt], description: "`urgency` only. The urgency the request must have." }
        when: { $ref: "#/components/schemas/CELCondition" }
    EscalationTarget:
      type: object
      additionalProperties: false
      description: Who a level notifies. user names a membership and team names a team; both carry an id. broadcast notifies every current member of the team that owns a team escalation policy and carries no id. An organization escalation path accepts user and team; a team escalation policy accepts user (members of that team only) and broadcast.
      required: [type]
      properties:
        type: { type: string, enum: [user, team, broadcast] }
        id: { type: string, format: uuid, description: "Required for user and team, absent for broadcast." }
    TeamEscalationPolicyDocument:
      type: object
      additionalProperties: false
      description: The node program a team runs when a path level targets it. The same grammar as an escalation path document, without a name, whose levels name members of the team or broadcast to all of them.
      required: [working_hours, nodes]
      properties:
        working_hours:
          type: array
          items: { $ref: "#/components/schemas/WorkingHoursSet" }
        nodes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EscalationPathNode" }
        repeat: { $ref: "#/components/schemas/EscalationPathRepeat" }
    TeamEscalationPolicyRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, team_id, revision, is_active, created_by_actor_id, created_at]
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        is_active: { type: boolean }
        created_by_actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, description: "When the revision was first active. Absent for a draft, which can still be changed." }
    TeamEscalationPolicyRevision:
      allOf:
        - $ref: "#/components/schemas/TeamEscalationPolicyRevisionSummary"
        - type: object
          required: [working_hours, nodes, document_version, warnings]
          properties:
            working_hours:
              type: array
              items: { $ref: "#/components/schemas/WorkingHoursSet" }
            nodes:
              type: array
              items: { $ref: "#/components/schemas/EscalationPathNode" }
            repeat: { $ref: "#/components/schemas/EscalationPathRepeat" }
            document_version: { type: integer, minimum: 1 }
            warnings:
              type: array
              description: >-
                Advisory findings about the document against the team's
                roster and grants. Never a refusal: the policy narrows who
                is asked within the team, it never grants. Creation and
                activation report members who cannot decide; reads of the
                active revision report that and every target who left the
                team; reads of a historical revision report departed
                targets only.
              items: { $ref: "#/components/schemas/TeamEscalationPolicyWarning" }
    TeamEscalationPolicyWarning:
      type: object
      required: [code, count, member_count]
      properties:
        code:
          type: string
          enum: [team_members_cannot_decide, target_not_member]
          description: team_members_cannot_decide means count of the team's member_count members hold no request.decide grant. target_not_member means the user target in membership_id is no longer an active member of the team, so the level naming them skips them.
        membership_id: { type: string, format: uuid, description: The departed target. Present for target_not_member only. }
        display_name: { type: string, description: "The departed target's name, while the roster still lists them under another status." }
        count: { type: integer, description: Members of the team who cannot decide requests; 0 for target_not_member. }
        member_count: { type: integer, description: Active members of the team; 0 for target_not_member. }
    PinnedTeamPolicy:
      type: object
      additionalProperties: false
      description: One team escalation policy revision an escalated request runs inline when its pinned path reaches the team.
      required: [team_id, team_name, policy_revision_id, revision]
      properties:
        team_id: { type: string, format: uuid }
        team_name: { type: string }
        policy_revision_id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
    EscalationWalkerProgress:
      type: object
      additionalProperties: false
      description: One team policy walker's position while its policy runs inline.
      required: [team_id, phase, level_ordinal, level_count, repeat]
      properties:
        team_id: { type: string, format: uuid }
        phase: { $ref: "#/components/schemas/EscalationPhase" }
        current_node_id: { type: string, format: uuid, description: The node the walker stands on; absent once exhausted. }
        level_ordinal: { type: integer, description: 1-based position of the current level in walk order; 0 before the first level. }
        level_count: { type: integer, description: Level nodes in the document. }
        repeat: { type: integer, description: How many times the program has been repeated so far. }
        next_escalation_at: { type: string, format: date-time, description: "When the armed timer fires; absent while paused, exhausted, or waiting on nothing." }
    EscalationPhase:
      type: string
      enum: [level, deferred, repeat_wait, paused, exhausted]
      description: "Where a walker stands. `level`: a level is notified and its timer armed. `deferred`: waiting for a working hours window to open. `repeat_wait`: the program ran out and is waiting to repeat. `paused`: a claim holds escalation still. `exhausted`: nothing left to do."
    EscalationProgress:
      type: object
      additionalProperties: false
      description: Where the escalation machine stands after its latest tick. The organization path's walker is flattened onto the object; teams carries one entry per team policy running inline.
      required: [sequence, phase, urgency, level_ordinal, level_count, repeat, updated_at, teams]
      properties:
        sequence: { type: integer, format: int64, description: Monotonic tick counter; a later tick always carries a higher value. }
        phase: { $ref: "#/components/schemas/EscalationPhase" }
        urgency: { type: string, enum: [standard, interrupt], description: "The request's current urgency, raised by a level that asked to." }
        current_node_id: { type: string, format: uuid, description: The path node the walker stands on; absent once exhausted. }
        level_ordinal: { type: integer, description: 1-based position of the current level in walk order; 0 before the first level. }
        level_count: { type: integer, description: Level nodes in the path document. }
        repeat: { type: integer, description: How many times the path has been repeated so far. }
        next_escalation_at: { type: string, format: date-time, description: "When the path walker's armed timer fires; absent while paused, exhausted, or waiting on nothing." }
        updated_at: { type: string, format: date-time }
        teams:
          type: array
          items: { $ref: "#/components/schemas/EscalationWalkerProgress" }
    EscalationPathRepeat:
      type: object
      additionalProperties: false
      description: Run the path again from the top when the nodes run out without a decision. Every condition is evaluated again on each run.
      required: [times, after]
      properties:
        times: { type: integer, minimum: 1, maximum: 9, description: "How many extra runs, from 1 to 9." }
        after: { type: string, example: 1h, description: "How long to wait before each extra run. A duration from `1m` to `168h`." }
    ApprovalRouting:
      type: object
      additionalProperties: false
      description: Who was asked to review a request when it entered human review. agent_owner sends it to the person who owns the agent instance that made it; escalated pins an escalation path revision and the people it reaches for this request; default_queue means any authorized reviewer.
      required: [outcome, reason, urgency, targets, added_reviewers, team_policies, escalation, created_at]
      properties:
        outcome: { type: string, enum: [agent_owner, escalated, default_queue], example: escalated, description: "`agent_owner` when the agent's owner took the request; the path fields then describe the fallback pinned beside it. `escalated` when an escalation path took the request. `default_queue` when no path applied and every reviewer who can decide was asked." }
        reason:
          type: string
          enum: [block_escalation, pipeline_default, no_escalation, path_inactive, evaluation_error]
          example: block_escalation
          description: "How the outcome came about. `block_escalation`: the pipeline block that asked for a person named the route. `pipeline_default`: the pipeline's default route took it. `no_escalation`: the pipeline named no path. `path_inactive`: the named path had no active revision. `evaluation_error`: the path could not be resolved. The last three mean no path applied."
        urgency: { type: string, enum: [standard, interrupt], example: standard, description: "The urgency the request was routed with. Always `standard` today." }
        escalation_path_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', example: oncall, description: "The path that took the request, or for `agent_owner` the fallback pinned beside the owner. Absent for `default_queue`." }
        escalation_path_name:
          type: string
          example: On-call engineers
          description: "The name of the path revision that took the request, or the fallback revision for `agent_owner`. Absent for `default_queue`."
        escalation_path_revision_id: { type: string, format: uuid, description: "The path revision that was active at the time. Absent for `default_queue`, and for `agent_owner` when the fallback path had no active revision." }
        pipeline_revision_id: { type: string, format: uuid, description: "The pipeline revision that routed the request. Absent for `default_queue`." }
        block_id:
          type: string
          format: uuid
          description: "The pipeline block that named the path. Present for `block_escalation` only."
        agent_owner:
          $ref: "#/components/schemas/ApprovalRoutingTarget"
          description: "The person the request was sent to as the owner of the agent instance that made it. Present for `agent_owner` only."
        agent_owner_fallback:
          type: string
          enum: [no_agent_owner, agent_owner_inactive, agent_owner_cannot_decide]
          description: "Why a route that asks the agent's owner went to its fallback path when the request arrived. `no_agent_owner`: a service agent made it. `agent_owner_inactive`: the owner was suspended or removed. `agent_owner_cannot_decide`: the owner may not decide requests."
        agent_owner_handed_off_at:
          type: string
          format: date-time
          description: "When the agent's owner was suspended or removed and the fallback path took over the request. Present for `agent_owner` only."
        targets:
          type: array
          description: "Who may claim or decide the request. For `agent_owner`, the owner alone until a handoff. Otherwise the people and teams the pinned path reaches for this request, in path order: the levels whose request conditions hold for it, plus both branches of any working-hours or urgency test, at every level regardless of timing. Only these people, and `added_reviewers`, may claim or decide. Empty for `default_queue`. Empty for `escalated` means the path reaches nobody for this request and only a break-glass reviewer may decide it."
          items: { $ref: "#/components/schemas/ApprovalRoutingTarget" }
        added_reviewers:
          type: array
          description: People added to the request's routing after the snapshot was pinned, oldest first.
          items: { $ref: "#/components/schemas/ApprovalReviewer" }
        team_policies:
          type: array
          description: The team escalation policy revisions pinned beside the path, one per team the path reaches for this request that had an active policy at routing time. A team absent here is notified all at once when a level reaches it. Empty for `default_queue`.
          items: { $ref: "#/components/schemas/PinnedTeamPolicy" }
        escalation:
          description: The escalation executor's current position. Null before its first tick and for `default_queue`.
          oneOf:
            - $ref: "#/components/schemas/EscalationProgress"
            - type: "null"
        created_at: { type: string, format: date-time, example: "2026-09-08T12:00:00Z", description: When the request entered human review. }
    ApprovalRoutingTarget:
      type: object
      additionalProperties: false
      description: One person or team the pinned path reaches for the request.
      required: [type, id, name]
      properties:
        type: { type: string, enum: [user, team], description: "`user` names a membership, `team` a team." }
        id: { type: string, format: uuid }
        name: { type: string, description: The person's display name or the team's name. }
    ApprovalReviewer:
      type: object
      additionalProperties: false
      description: A person pulled into a pending request's routing after the fact by someone it was routed to.
      required: [membership_id, display_name, added_by_membership_id, added_by_display_name, created_at]
      properties:
        membership_id: { type: string, format: uuid }
        display_name: { type: string }
        added_by_membership_id: { type: string, format: uuid }
        added_by_display_name: { type: string }
        created_at: { type: string, format: date-time }
    ReviewViewer:
      type: object
      additionalProperties: false
      description: The reading person's own standing on the request. targeted says whether the pinned path reaches them for this request (directly, through a team, or by a later widening). decidable says whether a decision from them would pass the routing rule outright (yes), only with the outside_routing acknowledgement and request.decide.unrouted (break_glass), or not at all (no). reason names the rule in the way; it is absent when decidable is yes or the request is no longer pending. The decision itself still checks membership status, self-approval, and authentication freshness.
      required: [targeted, decidable]
      properties:
        targeted: { type: boolean }
        decidable: { type: string, enum: [yes, break_glass, "no"] }
        reason: { type: string, enum: [not_targeted, break_glass_only, no_permission] }
    ApprovalReview:
      type: object
      additionalProperties: false
      description: The request's routing and the reader's standing on it. routing is absent for requests the pipeline decided automatically.
      required: [added_reviewers, viewer]
      properties:
        routing: { $ref: "#/components/schemas/ApprovalRouting" }
        added_reviewers:
          type: array
          description: People added to the request's routing after it was pinned, oldest first. The same list the routing carries.
          items: { $ref: "#/components/schemas/ApprovalReviewer" }
        viewer: { $ref: "#/components/schemas/ReviewViewer" }
    PermissionPolicySpec:
      type: object
      additionalProperties: false
      required:
      - scope_kind
      - resource_ids
      - permissions
      properties:
        scope_kind:
          type: string
          enum:
          - organization
          - team
          - agent
        resource_ids:
          type: array
          items:
            type: string
          maxItems: 200
          uniqueItems: true
          description: Empty for organization scope; otherwise the selected team IDs or agent slugs.
        permissions:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
    PermissionPolicyInput:
      type: object
      additionalProperties: false
      required:
      - scope_kind
      - resource_ids
      - permissions
      - revision
      properties:
        scope_kind:
          type: string
          enum:
          - organization
          - team
          - agent
        resource_ids:
          type: array
          items:
            type: string
          maxItems: 200
          uniqueItems: true
          description: Empty for organization scope; otherwise the selected team IDs or agent slugs.
        permissions:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Required when updating an existing policy.
    PermissionResource:
      type: object
      required:
      - id
      - name
      - kind
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - organization
          - team
          - agent
    PermissionPolicy:
      type: object
      required:
      - id
      - revision
      - scope_kind
      - resource_ids
      - permissions
      - resources
      - source
      - can_edit
      properties:
        scope_kind:
          type: string
          enum:
          - organization
          - team
          - agent
        resource_ids:
          type: array
          items:
            type: string
          maxItems: 200
          uniqueItems: true
          description: Empty for organization scope; otherwise the selected team IDs or agent slugs.
        permissions:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        resources:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResource'
        source:
          type: string
          enum:
          - manual
          - directory
        via_team_id:
          type: string
          format: uuid
        via_team_name:
          type: string
        can_edit:
          type: boolean
        read_only_reason:
          type: string
    PermissionPoliciesPage:
      type: object
      required:
      - name
      - policies
      - resources
      - permissions
      - can_create
      - is_owner
      properties:
        name:
          type: string
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PermissionPolicy'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResource'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionDescriptor'
        can_create:
          type: boolean
        is_owner:
          type: boolean
        read_only_reason:
          type: string
