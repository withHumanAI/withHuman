        "403": { $ref: "#/components/responses/Error", description: "You cannot archive teams" }
        "404": { $ref: "#/components/responses/Error", description: "No such team" }
        "409": { $ref: "#/components/responses/Error", description: "The team is managed by your directory, is targeted by an escalation path or a pending request" }
  /api/v1/teams/{id}/members:
    put:
      summary: Replace a team's members
      operationId: setTeamMembers
      x-withhuman-permission: team.member.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Teams]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Replaces the members added by hand with the given set. Send an
        empty list to remove them all. Members added by your directory are
        not touched. A team's members are the union of both.

        Removing a member that the team's active escalation policy still
        names is refused with `team_member_in_escalation_policy`; `details`
        carries `team_id`, `revision`, and the `membership_ids` being
        removed. Pass `force` to remove them anyway. The level naming them
        then skips them until the policy is edited.
