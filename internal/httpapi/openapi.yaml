        "403": { $ref: "#/components/responses/Error", description: "You cannot edit webhook endpoints" }
        "409": { $ref: "#/components/responses/Error", description: "An active pipeline revision posts to this endpoint. `error.code` is `webhook_endpoint_in_use`, and `error.details.uses` lists the revisions" }
        "412": { $ref: "#/components/responses/PreconditionFailed", description: "`If-Match` does not match the active revision" }
        "428": { $ref: "#/components/responses/PreconditionRequired", description: "The `If-Match` header is missing" }
  /api/v1/webhook_endpoints/{endpoint_key}/rotate_secret:
    post:
      summary: Rotate the signing secret
      operationId: rotateWebhookEndpointSecret
      x-withhuman-permission: webhook.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Webhook endpoints]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Replaces the endpoint's signing secret with a new one. The old
        secret stops working at once, for every revision of the endpoint.
