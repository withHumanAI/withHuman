        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/onboarding/v1/sessions/exchange:
    post:
      summary: Redeem a setup code for the CLI bearer
      operationId: exchangeOnboardingSetupCode
      x-withhuman-permission: public
      security: []
      description: No authentication; the single-use code is the authorization. Records the machine and answers with the who_ bearer accepted only by /api/onboarding/v1 routes. 404 setup_code_invalid for an unknown, spent, or expired code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup_code]
              properties:
                setup_code: { type: string }
                machine: { $ref: "#/components/schemas/OnboardingMachine" }
      responses:
        "200":
          description: The bearer and the connected session
          content:
            application/json:
              schema:
                type: object
                required: [session_id, token, expires_at, provider_url, session]
                properties:
                  session_id: { type: string, format: uuid }
                  token: { type: string, description: "The who_ bearer, shown once" }
                  expires_at: { type: string, format: date-time }
                  provider_url: { type: string, format: uri }
                  session: { $ref: "#/components/schemas/OnboardingSession" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/onboarding/v1/session:
    get:
      summary: Read or long-poll the session
      operationId: waitOnboardingSession
      x-withhuman-permission: self
      security: [{ bearerAuth: [] }]
      description: With `wait`, returns as soon as the version exceeds `since` or the wait (capped at 30s) elapses.
      parameters:
        - name: wait
          in: query
          schema: { type: string, example: 25s }
        - name: since
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "401": { $ref: "#/components/responses/Error" }
  /api/onboarding/v1/session/detections:
    put:
      summary: Report which runtimes are installed
      operationId: reportOnboardingDetections
      x-withhuman-permission: self
      security: [{ bearerAuth: [] }]
      description: Every catalogued runtime must appear exactly once. Allowed in connected and detected; moves the session to detected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtimes]
              properties:
                runtimes:
                  type: array
                  items: { $ref: "#/components/schemas/OnboardingDetection" }
      responses:
        "200":
          description: The updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/onboarding/v1/session/tools:
    put:
      summary: Report the discovered tools
      operationId: reportOnboardingTools
      x-withhuman-permission: self
      security: [{ bearerAuth: [] }]
      description: One report per selected runtime, built-in tools plus MCP tools per server. The server judges every tool, pre-selects the suggested ones, and moves the session to tools_discovered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tools]
              properties:
                tools:
                  type: object
                  additionalProperties: { $ref: "#/components/schemas/OnboardingReportedTools" }
      responses:
        "200":
          description: The updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/onboarding/v1/session/enroll:
    post:
      summary: Mint one agent instance per selected runtime
      operationId: enrollOnboarding
      x-withhuman-permission: self
      security: [{ bearerAuth: [] }]
      description: Allowed in provisioning. Runs with a principal rebuilt from the session starter's current membership; the credentials in the answer exist nowhere else. Moves the session to enrolled; a repeat is 409 onboarding_session_state.
      responses:
        "200":
          description: Credentials and the hook plans
          content:
            application/json:
              schema:
                type: object
                required: [provider_url, enrollments, hooks, session]
                properties:
                  provider_url: { type: string, format: uri }
                  enrollments:
                    type: array
                    items: { $ref: "#/components/schemas/OnboardingEnrollmentIssued" }
                  hooks:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/OnboardingHookPlan" }
                  session: { $ref: "#/components/schemas/OnboardingSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/onboarding/v1/session/install-results:
    put:
      summary: Report hook installation
      operationId: reportOnboardingInstall
      x-withhuman-permission: self
      security: [{ bearerAuth: [] }]
      description: One result per selected runtime. Moves the session to installed. The test commands wait for the rules step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items: { $ref: "#/components/schemas/OnboardingInstallResult" }
      responses:
        "200":
          description: The updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/onboarding/v1/session/error:
    put:
      summary: Record a CLI-side failure
      operationId: reportOnboardingError
      x-withhuman-permission: self
      security: [{ bearerAuth: [] }]
      description: Sets last_error without changing the status, so the page can show what went wrong on the machine.
