      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Teams]
      description: >-
        Replaces the document of a draft revision, one that has never been
        active. The revision keeps its number. The document is checked
        exactly as a new revision's. Once a revision has been active it
        can no longer change.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/PipelineRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamEscalationPolicyDocument" }
