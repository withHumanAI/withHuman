        "200":
          description: The updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamEscalationPolicyRevision" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "The revision has been active (`revision_not_draft`), or the team is archived" }
  /api/v1/teams/{id}/escalation-policy/revisions/{revision}/activate:
