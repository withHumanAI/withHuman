    get:
      summary: Stream the caller's setup session
      operationId: onboardingSessionEvents
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: "Server-sent events. Emits `event: session` with the session (or `null` when none is open) whenever its version changes, and a keepalive comment every second otherwise."
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/onboarding/session/agents:
    put:
      summary: Choose the runtimes to protect
      operationId: selectOnboardingAgents
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Allowed in detected, agents_selected, and tools_discovered; every runtime must have been detected as installed (400 runtime_not_detected). Moves the session to agents_selected, which sends the CLI to tool discovery.
      requestBody:
        required: true
        content:
          application/json:
