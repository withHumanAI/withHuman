        "200":
          description: The session in tested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/onboarding/completion:
    post:
      summary: Finish or skip onboarding
      operationId: completeOnboarding
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Requires every onboarding permission. Closes the caller's open session with the outcome and marks the organization's onboarding complete the first time. `finished` needs the open session, when there is one, to be in tested (409 onboarding_session_state).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [finished, skipped] }
      responses:
        "204": { description: Recorded }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/organization/policy:
    get:
      summary: Read the organization's approval policy
      operationId: getOrganizationPolicy
      x-withhuman-permission: organization.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Requires organization.read. Durations are Go duration strings.
      responses:
        "200":
          description: The approval policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPolicyEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    patch:
      summary: Change the organization's approval policy
      operationId: updateOrganizationPolicy
      x-withhuman-permission: organization.settings.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Requires organization.settings.write. Any subset of the settable fields; omitted fields keep their stored values. Durations are strings such as 15m or 24h, never unitless numbers, and the claim window is at most 24h. The change is audited as organization.policy_updated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPolicyPatch" }
      responses:
        "200":
          description: The stored policy after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPolicyEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/installation:
    get:
      summary: Read the installation's update status
      operationId: getInstallation
      x-withhuman-permission: organization.settings.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Requires organization.settings.write. The running version, the latest release and the security advisories that affect this version, as the last daily heartbeat reported them. latest_version and checked_at are null until a heartbeat has been answered, which never happens with telemetry turned off.
      responses:
        "200":
          description: The installation's update status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/tool_presentations:
    get:
      summary: List tool presentations
      operationId: listToolPresentations
      x-withhuman-permission: organization.read
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Requires organization.read. The organization's own entries, the shipped catalog they layer over, and the field kinds a client may use.
      responses:
        "200":
          description: The organization's entries and the shipped catalog
          content:
            application/json:
              schema:
                type: object
                required: [presentations, built_in, kinds]
                properties:
                  presentations:
                    type: array
                    items: { $ref: "#/components/schemas/ToolPresentation" }
                  built_in:
                    type: array
                    items: { $ref: "#/components/schemas/BuiltInToolPresentation" }
                  kinds:
                    type: array
                    items: { $ref: "#/components/schemas/ToolPresentationKind" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a tool presentation
      operationId: createToolPresentation
      x-withhuman-permission: organization.settings.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Requires organization.settings.write. 409 tool_presentation_exists when the organization already has an entry for the same runtime, server, and tool. Audited as tool_presentation.created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolPresentationInput" }
      responses:
        "201":
          description: The stored presentation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolPresentation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tool_presentations/{id}:
    put:
