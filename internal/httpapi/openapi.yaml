            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointRevision" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read webhook endpoints" }
        "404": { $ref: "#/components/responses/Error", description: "No such endpoint, or no revision is active" }
  /api/v1/webhook_endpoints/{endpoint_key}/revisions:
    post:
      summary: Create a webhook endpoint revision
      operationId: createWebhookEndpointRevision
      x-withhuman-permission: webhook.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Webhook endpoints]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Creates a new revision of an endpoint from a name and a URL. If
        the key is new, this creates the endpoint and its signing secret.
        The secret is returned once, in this response, as
        `signing_secret`. Store it where your receiver can read it. It
        cannot be retrieved again.

        Later revisions change the name or the URL only. The secret stays
        the same, so your receiver keeps working. The URL must be a public
        HTTPS address and is checked against the egress policy before the
        revision is created. The revision is created inactive. Activate it
        to put it into use.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEndpointDocument" }
      responses:
        "201":
          description: "The new revision, inactive. `signing_secret` is present only for the endpoint's first revision"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointRevision" }
        "400": { $ref: "#/components/responses/Error", description: "The name is empty, or the URL fails the egress policy" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot edit webhook endpoints" }
        "501": { $ref: "#/components/responses/Error", description: "This deployment has no secrets key, so webhook endpoints are unavailable" }
    get:
      summary: List webhook endpoint revisions
      operationId: listWebhookEndpointRevisions
      x-withhuman-permission: webhook.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Webhook endpoints]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Returns the endpoint's revisions, newest first. Signing secrets are never included.

        Paging is by cursor. When more revisions follow, the response
        carries `next_cursor`. Pass it back as `cursor` to get the next
        page. The last page has no `next_cursor`. `total_count` is how
        many revisions there are across every page.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointKey"
        - name: cursor
          in: query
          description: "The `next_cursor` from the previous page."
          schema: { type: string }
        - name: limit
          in: query
          description: "How many revisions to return per page. Defaults to 50."
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: The revisions, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revisions, total_count]
                properties:
                  revisions:
                    type: array
                    description: The revisions on this page, newest first.
                    items: { $ref: "#/components/schemas/WebhookEndpointRevision" }
                  next_cursor:
                    type: string
                    description: Present when another page follows.
                  total_count:
                    type: integer
                    format: int64
                    description: How many revisions the endpoint has, across every page.
        "400": { $ref: "#/components/responses/Error", description: "`cursor` is not a cursor this endpoint issued" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read webhook endpoints" }
  /api/v1/webhook_endpoints/{endpoint_key}/revisions/{revision}:
    get:
      summary: Retrieve a webhook endpoint revision
      operationId: getWebhookEndpointRevision
      x-withhuman-permission: webhook.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Webhook endpoints]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Returns one revision of an endpoint, active or not. The signing secret is never included.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointKey"
        - $ref: "#/components/parameters/PipelineRevision"
