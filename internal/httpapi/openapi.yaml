    holders: [human, api_key, organization_api_key]
    resource: team
    dangerous: false
  - key: team.member.write
    area: team
    description: Change who is on a team
    holders: [human, api_key]
    resource: team
    dangerous: false
  - key: team.read
    area: team
    description: List teams and their rosters
    holders: [human, api_key, organization_api_key]
    resource: team
    dangerous: false
  - key: team.write
    area: team
    description: Create, rename, and archive teams
    holders: [human, api_key]
    resource: team
    dangerous: false
  - key: webhook.read
    area: webhook
    description: View webhook endpoints
    holders: [human, api_key, organization_api_key]
    resource: organization
    dangerous: false
  - key: webhook.write
    area: webhook
    description: Create, edit, rotate, and delete webhook endpoints
    holders: [human, api_key, organization_api_key]
    resource: organization
    dangerous: false
paths:
  /livez:
    get:
      summary: Check process liveness
      operationId: liveness
      x-withhuman-permission: public
      security: []
      responses:
        "200": { description: Process is live }
        "404": { $ref: "#/components/responses/Error" }
  /readyz:
    get:
      summary: Check dependency and compiled-pipeline readiness
      operationId: readiness
      x-withhuman-permission: public
      security: []
      responses:
        "200": { description: PostgreSQL and compiled pipelines are ready }
        "404": { $ref: "#/components/responses/Error" }
        "503": { description: A required dependency is unavailable or the server is draining before shutdown }
  /api/runtime-config:
    get:
      summary: Read public deployment configuration
      operationId: runtimeConfig
      x-withhuman-permission: public
      security: []
      description: >-
        Public origin, build version, which organization creation surfaces
        this edition wires, and which social login providers the edition
        registered. The social login routes themselves are edition routes
        outside this contract; the open edition registers no providers.
      responses:
        "200":
          description: Public deployment configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeConfig" }
        "404": { $ref: "#/components/responses/Error" }
  /api/openapi.yaml:
    get:
      summary: Read this OpenAPI document
      operationId: openAPISpec
      x-withhuman-permission: public
      security: []
      responses:
        "200": { description: OpenAPI 3.1 document }
        "404": { $ref: "#/components/responses/Error" }
  /api/mcp/v1:
    post:
      summary: Speak MCP to the management API
      operationId: mcpPost
      x-withhuman-permission: self
      security: [{ apiKeyAuth: [] }]
      description: >-
        The withHuman MCP server (Model Context Protocol, streamable HTTP
        transport). An AI agent connects with a personal whk_ or
        organization who_ API key as the bearer and calls tools that
        list agents, members and teams and set up approval pipelines,
        escalation paths, teams and webhook endpoints. Every tool runs
        the matching /api/v1 operation under the key's own permissions,
        so this operation carries no permission of its own. The body is
        a JSON-RPC 2.0 request; the server is stateless and answers
        application/json. Session cookies are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification.
              additionalProperties: true
      responses:
        "200":
          description: The JSON-RPC 2.0 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202": { description: Notification accepted }
        "401": { $ref: "#/components/responses/Error" }
    get:
      summary: Refused server-to-client stream
      operationId: mcpGet
      x-withhuman-permission: self
      security: [{ apiKeyAuth: [] }]
      description: The server is stateless and opens no standalone stream; it answers 405 as the protocol allows.
      responses:
        "405": { description: Method Not Allowed }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: Refused session termination
      operationId: mcpDelete
      x-withhuman-permission: self
      security: [{ apiKeyAuth: [] }]
      description: The server keeps no sessions to terminate; it answers 405 as the protocol allows.
      responses:
        "405": { description: Method Not Allowed }
        "401": { $ref: "#/components/responses/Error" }
  /.well-known/oauth-authorization-server:
    get:
      summary: Read the MCP server's OAuth authorization server metadata
      operationId: oauthAuthorizationServerMetadata
      x-withhuman-permission: public
      security: []
      description: >-
        RFC 8414 discovery for the management MCP server. An MCP client
        reads this to find the consent page, the token endpoint and the
        registration endpoint. Scopes are permission keys a personal API
        key may carry; only the authorization_code grant with PKCE S256
        and public clients are supported.
      responses:
        "200":
          description: Authorization server metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthAuthorizationServerMetadata" }
        "404": { $ref: "#/components/responses/OAuthError" }
  /.well-known/oauth-protected-resource:
    get:
      summary: Read the MCP server's protected resource metadata
      operationId: oauthProtectedResourceMetadataRoot
      x-withhuman-permission: public
      security: []
      description: RFC 9728 metadata for the management MCP endpoint, served at the root for clients that look there first.
      responses:
        "200":
          description: Protected resource metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthProtectedResourceMetadata" }
        "404": { $ref: "#/components/responses/OAuthError" }
  /.well-known/oauth-protected-resource/api/mcp/v1:
    get:
      summary: Read the MCP endpoint's protected resource metadata
      operationId: oauthProtectedResourceMetadata
      x-withhuman-permission: public
      security: []
      description: RFC 9728 metadata for the management MCP endpoint, the URL its WWW-Authenticate challenge names.
      responses:
        "200":
          description: Protected resource metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthProtectedResourceMetadata" }
        "404": { $ref: "#/components/responses/OAuthError" }
  /auth/oauth/register:
    post:
      summary: Register an MCP client
      operationId: oauthRegisterClient
      x-withhuman-permission: public
      security: []
      description: >-
        RFC 7591 dynamic client registration for the management MCP
        server. Every client is public: no secret is issued and PKCE is
        required. Redirect URIs must be https, http on a loopback address,
        or a private-use scheme. Errors use the OAuth error shape.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthClientRegistration" }
      responses:
        "201":
          description: The registered client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthRegisteredClient" }
        "400": { $ref: "#/components/responses/OAuthError" }
        "404": { $ref: "#/components/responses/OAuthError" }
  /auth/oauth/token:
    post:
      summary: Exchange an authorization code for an access token
      operationId: oauthToken
      x-withhuman-permission: public
      security: []
      description: >-
        RFC 6749 token endpoint, form-encoded. The access token is a
        personal whk_ API key minted when the person approved the client
        on the consent page; it is shown once here and lives until it
        expires or is revoked. There is no refresh token: a client whose
        key stopped working authorizes again. Errors use the OAuth error
        shape.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, client_id, code_verifier]
              properties:
                grant_type: { type: string, enum: [authorization_code] }
                code: { type: string }
                redirect_uri: { type: string }
                client_id: { type: string, format: uuid }
                code_verifier: { type: string }
      responses:
        "200":
          description: The access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthTokenResponse" }
        "400": { $ref: "#/components/responses/OAuthError" }
        "404": { $ref: "#/components/responses/OAuthError" }
  /auth/bootstrap:
    post:
      summary: Create the first organization owner
      operationId: bootstrapOwner
      x-withhuman-permission: public
      security: []
      description: Creates the first organization and owner. Permanently disables itself after one owner exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, organization_slug, organization_name, display_name, email, password]
              properties:
                secret: { type: string }
                organization_slug: { type: string }
                organization_name: { type: string }
                display_name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "201": { description: Owner created and browser session set }
        "409": { description: Bootstrap is already disabled }
  /auth/login/methods:
    post:
      summary: Discover the login methods available for an email
      description: >-
        The email-first step. Unknown emails still answer with the password
        field so the form never confirms whether an address exists; the SSO
        organization list is the deliberate home-realm-discovery exception.
      operationId: loginMethods
      x-withhuman-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Available login methods
          content:
            application/json:
              schema:
                type: object
                required: [password, sso_organizations]
                properties:
                  password:
                    type: boolean
                    description: Whether a password field applies to this email
                  sso_organizations:
                    type: array
                    items: { $ref: "#/components/schemas/LoginOrganization" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      summary: Sign in with an email and password
      description: >-
        Verifies the password globally. A user with exactly one organization
        gets a session immediately; a multi-organization user receives a
        short-lived single-use ticket and the organization list for the
        selection step. Organizations with an enterprise connection are never
        reachable with a password: when every organization is connected the
        response is status sso_required with the connected organizations and
        no ticket, and the client continues through the SSO flow. A phone
        app names itself in client, which gives its session the longer
        native lifetime; a browser omits it.
      operationId: login
      x-withhuman-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 1024 }
                client:
                  type: object
                  description: The phone app signing in. Omitted by the browser.
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [ios, android] }
                    context:
                      type: object
                      description: What the app reports about itself (app version, OS version, device model, device id), stored as given.
      responses:
        "200":
          description: Session set, an organization selection step, or a hand-off to enterprise SSO
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [complete, select_organization, sso_required] }
                  principal: { type: object, description: Present when status is complete }
                  ticket: { type: string, description: "Single-use selection ticket, present when status is select_organization" }
                  expires_at: { type: string, format: date-time }
                  organizations:
                    type: array
                    description: The selectable organizations (select_organization) or the connected organizations to continue with through SSO (sso_required)
                    items: { $ref: "#/components/schemas/LoginOrganization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/login/select:
    post:
      summary: Redeem a login ticket for one organization
      description: Consumes the single-use ticket and creates a session for the chosen organization. The ticket preserves the authentication method and originating client, including device context for native sign-in.
      operationId: loginSelect
      x-withhuman-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, organization_id]
              properties:
                ticket: { type: string }
                organization_id: { type: string, format: uuid }
      responses:
        "200": { description: Session cookie set for the originating client }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke the current browser session
      operationId: logout
      x-withhuman-permission: public
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Error" }
  /auth/agent_enrollments:
    post:
      tags: [Agent enrollment]
      summary: Start an enrollment
      description: "Starts an enrollment and returns two codes. The `enrollment_code` stays on the machine. The `user_code` is for a person to enter at the `verification_uri`. Both expire at `expires_at`, ten minutes after this call. The person selects an existing agent or creates one in the browser, then authorizes the instance. An optional requested agent name fixes the target within the organization they sign into."
      operationId: beginAgentEnrollment
      x-withhuman-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runtime, instance_name]
              properties:
                runtime: { type: string, minLength: 1, example: claude-code, description: "The runtime being installed, independent of its parent agent." }
                requested_agent_slug: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', example: codex, description: "Optional slug of an existing agent. The browser must authorize this target; it cannot create or substitute another agent." }
                instance_name: { type: string, example: eces-macbook, description: "A name for this instance, unique within the agent. The CLI defaults to the machine's hostname plus a unique suffix. Reviewers see it next to the agent's name." }
                instance_metadata: { type: object, additionalProperties: true, example: { hostname: eces-macbook, os: darwin }, description: "Any JSON object to store with the instance, such as the hostname or operating system." }
      responses:
        "201":
          description: The codes and where to use them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentCode" }
        "400": { description: A required field is missing or blank }
  /auth/agent_enrollments/token:
    post:
      tags: [Agent enrollment]
      summary: Exchange an enrollment code
      description: "Exchanges an authorized enrollment code for the new instance and its credential. Call this every few seconds after starting an enrollment. It returns `404` until a person has authorized the user code. Once it succeeds, the code is used up and a second call returns `404` as well. The credential's token appears only in this response, so store it right away."
      operationId: exchangeAgentEnrollment
      x-withhuman-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enrollment_code]
              properties:
                enrollment_code: { type: string, example: whe_7c1f2a9e-4b3d-4f2e-9a1c-2d6e8b5f0a11_3f6b9c1d0e7a4b2c, description: "The `enrollment_code` returned when the enrollment started." }
      responses:
        "200":
          description: The instance and its credential. The credential's token appears only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnrollmentCredential" }
        "401": { description: The enrollment code is not in the expected format }
        "403": { description: The agent or the instance has been disabled since it was authorized }
        "404": { description: "The code has not been authorized yet, has expired, or has already been exchanged" }
  /api/aap/v1/instances:
    post:
      summary: Create an agent instance
      description: "Creates a new instance of the agent the provisioner token belongs to and returns it together with its agent credential. Use this from a fleet or platform that starts agent replicas itself, so each replica gets a credential of its own. The bearer token must be a provisioner token (`whp_`); an agent credential is rejected. Requires an `Idempotency-Key` header scoped to the provisioner: repeating the same submission with the same key within seven days answers `200` with the original instance and credential, without creating another instance, renewing the credential or verifying the receiver again. Reusing a key with different input answers `409` with code `idempotency_conflict`, a key whose attempt is still running answers `409` with code `idempotency_in_progress`, and replaying a key whose instance was deleted answers `409` with code `instance_deleted`. Pass `delivery` to use the Agent Approval Protocol's asynchronous mode: before the instance is created, withHuman sends a signed `webhook.verification` message to the receiver, which must answer `200` with the same `challenge` within ten seconds, or the call fails with `422` and code `webhook_verification_failed` and no instance is created (the same key may be retried). A malformed or non-public receiver URL answers `400` with code `invalid_webhook_url`. Afterwards, every request of the instance that becomes approved, denied, expired or cancelled sends one signed `request.resolved` notification to the receiver, retried with backoff for up to seven days until it answers `2xx`; notifications wait while the instance is disabled. The notification carries only IDs; read the decision with `GET /api/aap/v1/requests/{id}`. Both messages are signed with the Standard Webhooks scheme (`webhook-id`, `webhook-timestamp` and `webhook-signature` headers). Requires the deployment's secrets key; without it, delivery is refused with `501`."
      operationId: mintAgentInstance
      x-withhuman-permission: public
      tags: [Agent Approval Protocol]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                instance_name: { type: string, example: ci-runner-07, description: "A name for the instance, unique within the agent. Reviewers see it next to the agent's name." }
                instance_metadata: { type: object, additionalProperties: true, example: { region: eu-west }, description: "Any JSON object to store with the instance, such as a region or pod name." }
                ttl_seconds: { type: integer, format: int64, minimum: 0, example: 86400, description: "How long the credential stays valid, in seconds. A value above the provider's default is reduced to the default." }
                delivery: { $ref: "#/components/schemas/AgentInstanceDeliveryInput" }
      responses:
        "201":
          description: The new instance and its credential. Keep the credential's token; only a replay with the same provisioner token and idempotency key returns it again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AAPProvisionedInstance" }
        "200":
          description: The instance and credential an earlier submission with the same idempotency key created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AAPProvisionedInstance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/aap/v1/instances/{id}:
    get:
      summary: Retrieve an agent instance
      description: "Returns an instance of the provisioner token's agent with its receiver, if any. The signing secret and credentials are never returned. A deleted instance, or one of another agent, answers `404`."
      operationId: getProvisionedInstance
      x-withhuman-permission: public
      tags: [Agent Approval Protocol]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AAPInstance" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update an agent instance
      description: "Renames an instance of the provisioner token's agent, replaces its receiver, or removes it. A `delivery` object replaces the whole configuration, signing secret included, and is verified first exactly as at creation: the old configuration and name stay in place until verification succeeds, and a failure answers `422` with code `webhook_verification_failed`. Queued notifications then go to the new receiver with the new secret, with unchanged IDs and bodies. `delivery: null` removes the receiver and ends outstanding deliveries and retries. Requires an `Idempotency-Key` header scoped to the provisioner and the instance: repeating the same submission answers the original response without applying it again. A deleted instance answers `404`."
      operationId: updateProvisionedInstance
      x-withhuman-permission: public
      tags: [Agent Approval Protocol]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                instance_name: { type: string, minLength: 1, example: ci-runner-07 }
                delivery:
                  description: Omit to keep the receiver, pass a complete configuration to replace it, or `null` to remove it.
                  oneOf: [{ $ref: "#/components/schemas/AgentInstanceDeliveryInput" }, { type: "null" }]
      responses:
        "200":
          description: The updated instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AAPInstance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete an agent instance
      description: "Retires an instance of the provisioner token's agent: its credentials are revoked, its receiver is removed with every outstanding delivery, and each of its pending requests is cancelled without a notification. Requests that already reached an outcome are unchanged. The instance stays listed in the product, disabled, and cannot be enabled again. Deleting it again answers `204`."
      operationId: deleteProvisionedInstance
      x-withhuman-permission: public
      tags: [Agent Approval Protocol]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: The instance is deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/aap/v1/requests:
    post:
      summary: Create an approval request
      operationId: createApprovalRequest
      x-withhuman-permission: request.create
      description: "Asks for approval to run a tool call. The organization's approval pipeline evaluates the request first and may approve or deny it on the spot, in which case the response already carries the decision. Otherwise the request goes to reviewers and comes back as `pending`; retrieve it with a `wait` to learn the outcome. A request nobody decides before its timeout becomes `expired`: the adapter does not run the call and tells the agent the approval timed out. An adapter that stops waiting should cancel the request so reviewers stop seeing it. Requires an `Idempotency-Key` header scoped to this operation and the authenticated instance. Reusing it with changed input returns 409."
      tags: [Agent Approval Protocol]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApproval" }
      responses:
        "201":
          description: The request, either already decided by the pipeline or pending review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AAPApprovalRequest" }
              examples:
                pending:
                  $ref: "#/components/examples/AAPPendingRequest"
                approved:
                  $ref: "#/components/examples/AAPApprovedRequest"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { description: The idempotency key was already used for a different request }
        "429": { description: The organization has reached its limit of pending requests }
  /api/aap/v1/requests/{id}:
    get:
      summary: Retrieve an approval request
      operationId: getApprovalDecision
      x-withhuman-permission: request.read
      description: "Returns the request and, once it has been decided, its decision. Pass `wait` to hold the response until the request is decided or the wait runs out, whichever comes first. Only the instance that created the request may retrieve it. A request stops changing once it is `approved`, `denied`, `expired`, or `cancelled`."
      tags: [Agent Approval Protocol]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: wait
          in: query
          description: "How long to hold the response for a decision, as a duration such as `30s`. Capped at 30 seconds. Omit to return immediately."
          schema: { type: string, example: 30s }
      responses:
        "200":
          description: The request in its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AAPApprovalRequest" }
              examples:
                pending:
                  $ref: "#/components/examples/AAPPendingRequest"
                approved:
                  $ref: "#/components/examples/AAPApprovedRequest"
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel an approval request
      operationId: cancelApprovalRequest
      x-withhuman-permission: request.create
      description: "Withdraws a pending request. Use it when the runtime that asked stops waiting for the answer: it was interrupted, timed out locally, or is shutting down. Reviewers stop seeing the request, notifications stop, and anyone holding it is released. Only the instance that created the request may cancel it; another instance of the same agent gets a `403`. A cancelled request is final and answers `cancelled` with a protocol decision, so a long poll in flight returns at once. Cancelling again returns the same cancelled request. A request that was already `approved`, `denied`, or `expired` is unchanged and answers `409` with code `already_terminal`. This is an optional capability of the Agent Approval Protocol: adapters must treat a `404` or `405` from a provider that does not offer it as nothing to do."
      tags: [Agent Approval Protocol]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The request, now cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AAPApprovalRequest" }
              examples:
                cancelled:
                  $ref: "#/components/examples/AAPCancelledRequest"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "The request was already decided or expired (code `already_terminal`)" }
  /api/aap/v1/requests/{id}/consume:
    post:
      summary: Consume an approval
      operationId: consumeApprovalRequest
      x-withhuman-permission: request.create
      description: "Marks an approved request as used, right before the adapter runs the call. Each approval runs one call: only one consume succeeds, so a second attempt to run the same call is refused. Call it after checking `decision.expires_at`, and do not start the call until it succeeds. Only the instance that created the request may consume it; another instance gets a `403`. Requires an `Idempotency-Key` header that identifies this execution attempt: repeating the key returns the request as it is now, even after `expires_at`. The request takes no body; an empty body or `{}` is accepted. Answers `409` with code `already_consumed` when another key already consumed it, `not_approved` when the request is not `approved`, and `approval_expired` once `expires_at` has passed."
      tags: [Agent Approval Protocol]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: The request, now consumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AAPApprovalRequest" }
              examples:
                consumed:
                  $ref: "#/components/examples/AAPConsumedRequest"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "The approval was already used (code `already_consumed`), the request is not approved (`not_approved`), or the approval expired (`approval_expired`)" }
  /api/aap/v1/requests/{id}/outcome:
    post:
      summary: Report an approved call's outcome
      operationId: reportApprovalOutcome
      x-withhuman-permission: request.create
      description: "Records whether the approved call succeeded, after the adapter consumed the approval and ran it. The outcome is for the record only: it never changes the request's status or decision. Report it once. Repeating the same body returns the same request; a different outcome answers `409` with code `outcome_conflict`. A request that was not consumed answers `409` with code `not_consumed`. Only the instance that created the request may report its outcome; another instance gets a `403`."
      tags: [Agent Approval Protocol]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportApprovalOutcome" }
      responses:
        "200":
          description: The request with the outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AAPApprovalRequest" }
              examples:
                reported:
                  $ref: "#/components/examples/AAPReportedRequest"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "The approval was not consumed (code `not_consumed`), or a different outcome was already reported (`outcome_conflict`)" }
  /api/v1/enterprise/slack:
