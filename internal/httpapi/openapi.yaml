  /api/v1/onboarding/sessions:
    post:
      summary: Start a guided setup session
      operationId: beginOnboarding
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Opens the caller's setup session, superseding any open one. Requires every onboarding permission (agent.write, agent.credential.issue, pipeline.write, pipeline.activate, escalation_path.write, escalation_path.activate, organization.settings.write, request.read, request.decide). The setup code is returned exactly once, inside the command to paste.
      responses:
