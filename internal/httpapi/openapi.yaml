                properties:
                  team: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/Error", description: "The name is empty" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot change teams" }
        "404": { $ref: "#/components/responses/Error", description: "No such team" }
        "409": { $ref: "#/components/responses/Error", description: "The team is archived or managed by your directory, or a live team with this name already exists" }
    delete:
      summary: Archive a team
      operationId: archiveTeam
      x-withhuman-permission: team.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Teams]
