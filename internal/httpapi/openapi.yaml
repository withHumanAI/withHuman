  /api/v1/requests:
    get:
      summary: List the review queue
      description: >-
        Returns the list of approval requests that reached human review: pending, decided
        by a person, or expired while waiting. Approval requests the
        pipeline decided automatically are not included. They stay in the
        audit log
        and can still be retrieved by id. Requests are returned newest
        first.

        Pass `agent_slug` to list one agent's requests instead. That list
        includes the requests the pipeline decided automatically.

        Pass `per_agent` to list every agent's recent history instead: at
        most that many of each agent's newest requests, automatic decisions
        included, newest first overall.
      operationId: listReviewerQueue
      x-withhuman-permission: request.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Review queue]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: limit
          in: query
          description: "How many requests to return. Defaults to 50, at most 200."
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: agent_slug
          in: query
          required: false
          description: "Show one agent's requests instead of the queue, including the ones the pipeline decided."
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
        - name: per_agent
          in: query
          required: false
          description: "Show each agent's newest requests instead of the queue, at most this many per agent, including the ones the pipeline decided. `limit` still caps the whole list, and the other filters apply to those newest requests."
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: offset
          in: query
          description: Number of visible matching requests to skip before returning this page.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: q
          in: query
          description: Case-insensitive literal substring of the tool or instance name.
          schema: { type: string }
        - name: status
          in: query
          description: Return only requests with this outcome.
          schema: { type: string, enum: [pending, approved, denied, expired, cancelled] }
        - name: scope
          in: query
          description: >-
            Which layer of the queue to return, from the caller's standpoint.
            `notified` is what the caller was told about: requests a
            notification addressed to them, or a colleague handed them.
            `decidable` is what the caller may decide outright: requests
            routed to them directly, through a team, or by being added,
            plus unrouted requests where any reviewer may take them.
            `visible` (the default) is everything the caller may see,
            whoever decides it. Each layer contains the one before it.
            Ignored for API keys, which have no membership.
          schema: { type: string, enum: [notified, decidable, visible] }
      responses:
        "200":
          description: "The requests, newest first"
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/QueueApprovalRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read requests" }
  /api/v1/me:
    get:
      summary: Retrieve the current member
      description: "Returns who the session belongs to. The `principal` is what the API checks permissions against on every call. The rest is for display: the person's name and email, the organization, and the role assignments the membership holds. Call this after signing in to learn what the session can do."
      operationId: currentPrincipal
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Account]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: The member behind the session
          content:
            application/json:
              schema:
                type: object
                required: [principal]
                properties:
                  principal: { $ref: "#/components/schemas/Principal" }
                  user:
                    type: object
                    description: The person who signed in.
                    properties:
                      display_name: { type: string, example: Ada Lovelace, description: The name shown in the product. }
                      email: { type: string, example: ada@example.com, description: The primary email address on the account. }
                      has_password: { type: boolean, example: true, description: "Whether the account has a password. False for an account that only signs in through an identity provider; such an account cannot change or reset a password." }
                  organization:
                    type: object
                    description: The organization the session is scoped to.
                    properties:
                      name: { type: string, example: Northwind, description: The organization's display name. }
                      slug: { type: string, example: northwind, description: The organization's URL-safe identifier. }
                  assignments:
                    type: array
                    description: "The membership's role assignments: its own, plus the ones it inherits through its teams. The `grants` in the principal are flattened from these."
                    items: { $ref: "#/components/schemas/RoleAssignment" }
                  onboarding:
                    type: object
                    description: Whether the product's guided setup should open for this person.
                    required: [required, skipped, completed_at]
                    properties:
                      required: { type: boolean, example: false, description: "`true` while nobody in the organization has finished or skipped the guided setup and this person has the permissions to run it." }
                      skipped: { type: boolean, example: false, description: "`true` while the organization skipped the guided setup, nobody has finished it since, and this person has the permissions to run it." }
                      completed_at: { type: [string, "null"], format: date-time, description: "When the organization finished or skipped the guided setup. `null` until then." }
        "401": { description: "No session cookie, or the session has expired or been signed out" }
  /api/v1/requests/{id}:
    get:
      summary: Retrieve a request
      description: "Returns one approval request. The response includes its current status, its decision once there is one, and any claim a reviewer holds on it. Pass `wait` to hold the response until the request is decided."
      operationId: getProductApprovalRequest
      x-withhuman-permission: request.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Review queue]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: wait
          in: query
          description: "How long to hold the response for a decision, as a duration such as `30s`. Capped at 30 seconds. Omit to return immediately."
          schema: { type: string, example: 30s }
      responses:
        "200":
          description: The request in its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueApprovalRequest" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read requests" }
        "404": { $ref: "#/components/responses/Error", description: "No such request" }
  /api/v1/requests/{id}/claim:
    post:
      summary: Claim a request
      operationId: claimApprovalRequest
      x-withhuman-permission: request.claim
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Review queue]
      description: >-
        Marks a pending request as being looked at by you. Other reviewers
        see who has it, and its notifications pause. A claim is advisory:
        anyone allowed to decide the request can still decide it.

        A claim lapses after the organization's claim timeout, 15 minutes
        by default. It also lapses at the request's deadline if that comes
        first. Claiming a request you already hold returns the same claim.
        You cannot claim a request another reviewer holds. Wait for their
        claim to lapse, or for them to release it.

        Owners and reviewers can claim. If the request was routed to an
        escalation path, only the people on that path can claim it. Owners
        can always claim.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The claim you hold
          content:
            application/json:
              schema:
                type: object
                required: [claim]
                properties:
                  claim: { $ref: "#/components/schemas/Claim" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot claim this request. Your membership is inactive, you lack permission to decide, or the request was routed to other people" }
        "404": { $ref: "#/components/responses/Error", description: "No such request" }
        "409": { $ref: "#/components/responses/Error", description: "Another reviewer holds the claim, or the request is no longer pending" }
    delete:
      summary: Release a claim
      operationId: releaseApprovalRequestClaim
      x-withhuman-permission: request.claim
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Review queue]
      description: "Releases your claim on a request. Other reviewers then see it as unclaimed. Only the reviewer holding a claim can release it. Other reviewers' claims lapse on their own."
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "204": { description: The claim is released }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error", description: "Another reviewer holds the claim" }
        "404": { $ref: "#/components/responses/Error", description: "No live claim on this request" }
  /api/v1/requests/{id}/decision:
    post:
      summary: Approve or deny a request
      operationId: decideApprovalRequest
      x-withhuman-permission: request.decide
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Review queue]
      description: >-
        Records your decision on a pending request and returns once it is
        durably stored. The agent waiting on the request sees the decision
        on its next read.

        Every call needs an `Idempotency-Key` header. Repeating a call with
        the same key returns the decision already recorded.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, denied], description: "The decision." }
                note: { type: string, example: "OK, but flag this account for review.", description: "A note for the agent. It is returned with the decision." }
                channel: { type: string, default: web, example: web, description: "Where the decision was made, recorded on the decision, for example `web` or `slack`. Defaults to `web`." }
                outside_routing:
                  type: boolean
                  default: false
                  description: The reviewer's explicit acknowledgement that they are deciding outside the request's routing (break glass). Required, alongside request.decide.unrouted, when routing did not hand them the request; without it such a decision is refused with reason outside_routing_required. Part of the decision's intent under the idempotency key.
      responses:
        "200":
          description: The recorded decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionOperation" }
        "400": { $ref: "#/components/responses/Error", description: "The `Idempotency-Key` header is missing, or `status` is not `approved` or `denied`" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "You cannot decide this request. Your membership is inactive, you lack permission to decide, the request was routed to other people, or your sign-in is too old or not strong enough. A routing refusal carries RoutingRejectionDetails in error.details, whose reason is not_targeted, break_glass_only, or outside_routing_required."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/Error", description: "No such request" }
        "409": { $ref: "#/components/responses/Error", description: "The request already has a decision or has expired, or the idempotency key was already used with different parameters" }
  /api/v1/requests/{id}/routing:
    get:
      summary: Retrieve a request's routing
      operationId: getApprovalRouting
      x-withhuman-permission: request.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Review queue]
      description: >-
        Returns who was asked to review a request when it entered human
        review. If an escalation path took the request, the people on that
        path were notified, and only they can decide it. If no path
        applied, every reviewer who can decide was notified, and any of
        them can decide it. Routing is fixed when the request enters human
        review. Later changes to pipelines or paths do not move it.

        Requests the pipeline decided automatically never entered human
        review and have no routing.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Where the request was routed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRouting" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read requests" }
        "404": { $ref: "#/components/responses/Error", description: "No such request, or it never reached human review" }
  /api/v1/requests/{id}/review:
    get:
      summary: Read where a request was routed and whether you may decide it
      operationId: getApprovalReview
      x-withhuman-permission: request.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      description: Product read only, gated by request.read alone. The routing snapshot, the reviewers added since it was pinned, and the reader's own standing (viewer), so the request page knows who may decide. What the pipeline concluded and what has happened to the request since is the hosted edition's request timeline, served from its audit log.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The request's routing and the reader's standing on it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalReview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/requests/{id}/reviewer-candidates:
    get:
      summary: List who a request could be handed to
      operationId: listReviewerCandidates
      x-withhuman-permission: request.decide
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Review queue]
      description: Active members who hold request.decide and are not yet reviewers of the request. Gated like deciding rather than by membership.read, so a targeted reviewer without the members page can still hand off.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Candidates sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [membership_id, display_name, email]
                      properties:
                        membership_id: { type: string, format: uuid }
                        display_name: { type: string }
                        email: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/requests/{id}/reviewers:
    post:
      summary: Add a reviewer to a pending request
      operationId: addApprovalReviewer
      x-withhuman-permission: request.decide
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags: [Review queue]
      description: The handoff. Someone the request was routed to (or a holder of request.decide.unrouted) pulls one more active member who may decide into the request's routing. Widening never removes anyone and is audited as request.reviewer_added. Refused when the request is not pending or was never routed (409), when the actor is not targeted (403), or when the member is inactive or cannot decide (400).
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [membership_id]
              properties:
                membership_id: { type: string, format: uuid }
      responses:
        "200":
          description: The request's review after the widening
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalReview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/me/contact-methods:
    get:
      summary: List the addresses that reach you
      operationId: listContactMethods
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      description: Your account address first, marked primary, then every address you added, plus the Slack workspace and Discord server you could link to. Self-service; no permission beyond being signed in.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Your contact methods
          content:
            application/json:
              schema:
                type: object
                required: [contact_methods, slack_workspace, discord_server]
                properties:
                  contact_methods:
                    type: array
                    items: { $ref: "#/components/schemas/ContactMethod" }
                  slack_workspace:
                    description: The organization's connected Slack workspace, or null when none is connected (or the deployment has no Slack app), so the page can say whether linking is possible yet.
                    oneOf:
                      - type: object
                        required: [team_name]
                        properties:
                          team_name: { type: string }
                      - type: "null"
                  discord_server:
                    description: The organization's connected Discord server, or null when none is connected (or the deployment has no Discord app). Only the server name is exposed to members.
                    oneOf:
                      - type: object
                        required: [guild_name]
                        properties:
                          guild_name: { type: string }
                      - type: "null"
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Add an address or number and send it a code
      operationId: addContactMethod
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      description: The address receives nothing but the verification code until somebody confirms it. An email address is the kind every edition takes; the hosted edition also takes phone numbers, as sms and whatsapp methods, with their own format rules and code allowances.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                kind: { type: string, default: email, description: "email, or a kind the edition registers as typed in and proved by a code (the hosted edition's sms and whatsapp). Any other kind is refused." }
                value: { type: string, description: "An email address, or the value the kind takes (the hosted edition's phone kinds take a number in international format such as +447911123456)." }
                consent: { type: boolean, default: false, description: "The person's express agreement to receive messages there, given on a box that is unchecked by default. Required for kinds the edition registers as needing it (the hosted edition's phone kinds); ignored for email." }
      responses:
        "201":
          description: The unverified method, its code on its way. A kind the edition registers may carry the code differently and adds fields of its own beside the method (the hosted edition's whatsapp method answers with whatsapp_confirmation_url and whatsapp_confirmation_qr, a click-to-chat link and its QR code, instead of sending the code).
          content:
            application/json:
              schema:
                type: object
                required: [contact_method]
                additionalProperties: true
                properties:
                  contact_method: { $ref: "#/components/schemas/ContactMethod" }
        "400": { description: "Not a valid value for the kind, a kind that needs consent given without it, or a kind that is not typed in" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { description: "Already your account address, or already on your account" }
        "429": { description: "The kind's allowance of verification codes is used up" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/me/contact-methods/{id}/verify:
    post:
      summary: Confirm an address with its code
      operationId: verifyContactMethod
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      description: A wrong code costs one attempt and leaves the challenge alive. After five attempts, or once the code expires, request a new one.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: The verified method
          content:
            application/json:
              schema:
                type: object
                required: [contact_method]
                properties:
                  contact_method: { $ref: "#/components/schemas/ContactMethod" }
        "400": { description: Wrong or expired code }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Already verified, or out of attempts" }
  /api/v1/me/contact-methods/{id}/resend:
    post:
      summary: Send a fresh code
      operationId: resendContactMethodCode
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      description: Rotating the code invalidates the previous one and restores the attempt budget. A kind the edition registers may wait between codes.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The method with a new code on its way, plus whatever the kind adds beside it (the hosted edition's whatsapp method carries a fresh confirmation link).
          content:
            application/json:
              schema:
                type: object
                required: [contact_method]
                additionalProperties: true
                properties:
                  contact_method: { $ref: "#/components/schemas/ContactMethod" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: That address is already verified }
        "429": { description: "The kind is still waiting between codes, or its allowance is used up" }
  /api/v1/me/contact-methods/{id}:
    delete:
      summary: Remove an address
      operationId: removeContactMethod
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      description: Your account address is not a removable method; it is the sign-in identity.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me/notification-rules:
    get:
      summary: Read your notification ladders
      operationId: listNotificationRules
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      description: Both ladders for the current organization. A ladder you have not shaped shows the computed default; customized says which is which.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Your ladders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRules" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/me/notification-rules/{urgency}:
    put:
      summary: Replace one ladder
      operationId: saveNotificationRules
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      description: Rungs are ordered by delay. A null contact_method_id is the account email. Every rung must name a method you hold; the ladder must keep at least one rung, so it cannot be emptied to go silent.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: urgency
          in: path
          required: true
          schema: { type: string, enum: [standard, interrupt] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: "#/components/schemas/NotificationRule" }
      responses:
        "200":
          description: Both ladders after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRules" }
        "400": { description: "Rungs out of order, too many, or an unusable delay" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { description: A rung names a method you do not hold }
  /api/v1/events:
    get:
      summary: Stream live reviewer queue snapshots
      description: Same contents and filtering as the reviewer queue listing, for the queue layer `scope` names.
      operationId: streamQueue
      x-withhuman-permission: request.read
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: scope
          in: query
          description: "The queue layer to stream: `notified`, `decidable`, or `visible` (the default), as on the listing."
          schema: { type: string, enum: [notified, decidable, visible] }
      responses:
        "200": { description: Server-sent queue snapshots }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/agents:
    get:
      summary: List agents
      description: >-
        Returns the organization's agents. Each entry carries the
        agent's instance counts, when it was last seen, and how many
        requests it has made. Active agents come first, then disabled
        ones, then archived ones, each group sorted by name. Archived
        agents are left out unless `status` says otherwise.

        An agent is live when one of its instances holds a credential that
        is neither expired nor revoked. `last_seen_at` is the newest
        authenticated call from any of its instances. Agents only call in
        when they have something to approve, so a quiet agent is not a
        broken one.
      operationId: listAgents
      x-withhuman-permission: agent.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: "Which agents to return. `live` (the default) returns active and disabled agents, `archived` returns only archived ones, and `all` returns every agent."
          schema: { type: string, enum: [live, archived, all], default: live }
        - name: limit
          in: query
          description: "How many agents to return. Defaults to 50."
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The agents
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/AgentSummary" }
        "400": { $ref: "#/components/responses/Error", description: "`status` is not live, archived, or all" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read agents" }
    post:
      summary: Create an agent
      description: >-
        Creates an agent. An agent is a stable identity for one AI system,
        such as a support bot or a deploy assistant. Its slug is the
        identity: chosen here, never changed, never reused. Agents own no
        pipeline of their own: every request starts in the organization's
        entry pipeline, and rules for one agent are a branch or a delegate
        on `agent.slug` there.

        Creating an agent does not issue a credential. Register an
        instance, or create a provisioner token, to let it call the API.
      operationId: createAgent
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
                  example: support-bot
                  description: "The agent's identity. Lowercase letters, digits, dots, underscores and hyphens, up to 63 characters. It cannot change and is never reused, so a slug an archived agent holds is refused."
                name:
                  type: string
                  example: Support bot
                  description: "A display name. Reviewers see it on every request the agent makes. It can be changed later and must be unique among the organization's live agents."
                kind:
                  type: string
                  enum: [service, personal]
                  default: service
                  description: "Whose behalf the agent's instances act on. `service` for an agent the organization runs, `personal` for one people run for themselves; see the Agent schema. It cannot be changed later."
      responses:
        "201":
          description: The new agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot create agents" }
        "409": { $ref: "#/components/responses/Error", description: "The slug is taken by a live or archived agent (`agent_slug_taken`), or a live agent already has the name (`agent_name_taken`)" }
        "429": { description: The organization is at its agent limit }
  /api/v1/agents/{slug}:
    get:
      summary: Retrieve an agent
      description: >-
        Returns one agent with a page of instances, each instance's credentials,
        and its provisioner tokens. Secrets are never included. Instances
        are sorted by last seen, then creation time and id, newest first. Counts and connection state cover all instances, independent of the page and filters.
      operationId: getAgent
      x-withhuman-permission: agent.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AgentSlug"
        - name: instance_limit
          in: query
          description: Number of instances in this page.
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: instance_offset
          in: query
          description: Number of matching instances to skip.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: instance_q
          in: query
          description: Case-insensitive literal substring of the instance name.
          schema: { type: string }
        - name: instance_status
          in: query
          description: Filter by whether an instance is enabled or disabled, independently of its credentials.
          schema: { type: string, enum: [active, disabled] }
        - name: provisioner_limit
          in: query
          description: Number of provisioner tokens in this page, sorted by issued time and id, newest first.
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: provisioner_offset
          in: query
          description: Number of matching provisioner tokens to skip.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: provisioner_q
          in: query
          description: Case-insensitive literal substring of the token identifier or displayed identifier suffix. Searches identifiers, never secrets.
          schema: { type: string }
        - name: provisioner_status
          in: query
          description: Token state, with revocation taking precedence over expiry.
          schema: { type: string, enum: [active, expired, revoked] }
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read agents" }
        "404": { $ref: "#/components/responses/Error", description: "No such agent" }
    patch:
      summary: Update an agent
      operationId: updateAgent
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Changes an agent's status or its display name, the two fields
        that can change after creation. The slug never changes. Who
        manages an agent is decided by the role assignments at the agent,
        not by a property of it.

        Disabling an agent keeps its instances and credentials in place,
        but none of them can authenticate until the agent is enabled
        again. An archived agent is past both switches; restore it first.
      parameters:
        - $ref: "#/components/parameters/AgentSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status:
                  type: string
                  enum: [active, disabled]
                  description: "`active` or `disabled`."
                name:
                  type: string
                  example: Support bot
                  description: "A new display name, unique among the organization's live agents. Audited as `agent.renamed`."
      responses:
        "200":
          description: The updated agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error", description: "Neither status nor name was given, or the status is invalid" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot change agents" }
        "404": { $ref: "#/components/responses/Error", description: "No such agent" }
        "409": { $ref: "#/components/responses/Error", description: "The agent is archived (`agent_archived`), or a live agent already has the name (`agent_name_taken`)" }
    delete:
      summary: Archive an agent
      operationId: archiveAgent
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Archives the agent. Every live credential and provisioner token
        is revoked. Nothing is deleted: the agent is still listed with
        `status=archived` or `all`, it can still be retrieved with its
        instances and revoked credentials, and its requests and audit
        trail stay readable. But no instance or provisioner token can be
        created for it and its status cannot change. Its name is freed
        for a new agent; its slug is not, and never will be. Pipelines are
        the organization's, not the agent's, and are untouched.
      parameters:
        - $ref: "#/components/parameters/AgentSlug"
      responses:
        "204": { description: The agent is archived }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot change agents" }
        "404": { $ref: "#/components/responses/Error", description: "No such agent" }
        "409": { $ref: "#/components/responses/Error", description: "The agent is already archived (`agent_archived`)" }
  /api/v1/agents/{slug}/restore:
    post:
      summary: Restore an archived agent
      operationId: restoreAgent
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Brings an archived agent back to `active`. Credentials and provisioner
        tokens revoked when the agent was archived stay revoked; register
        instances or connect them again to let it call the API. The name
        must still be free among the organization's live agents.
      parameters:
        - $ref: "#/components/parameters/AgentSlug"
      responses:
        "200":
          description: The restored agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot change agents" }
        "404": { $ref: "#/components/responses/Error", description: "No such agent" }
        "409": { $ref: "#/components/responses/Error", description: "The agent is not archived (`agent_not_archived`), or a live agent took its name meanwhile (`agent_name_taken`)" }
  /api/v1/agent_instances/{id}:
    patch:
      summary: Update an instance
      operationId: updateAgentInstance
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Changes an instance's status or its display name, the two fields
        that can change after enrollment. The agent and its other
        instances are not affected.

        Disabling an instance keeps its credentials, but none of them can
        authenticate until it is enabled again. Renaming changes what the
        instance is called from now on: nothing addresses an instance by
        name after enrollment, so the running agent needs no change, and
        requests already made keep the name the instance had at the time.
      parameters:
        - $ref: "#/components/parameters/AgentInstanceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status:
                  type: string
                  enum: [active, disabled]
                  description: "`active` or `disabled`."
                name:
                  type: string
                  example: support-server-01
                  description: "A new display name, unique within the agent. Audited as `agent_instance.renamed`."
      responses:
        "200":
          description: The updated instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInstance" }
        "400": { $ref: "#/components/responses/Error", description: "Neither status nor name was given, or the status is invalid" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot change agents" }
        "404": { $ref: "#/components/responses/Error", description: "No such instance" }
        "409": { $ref: "#/components/responses/Error", description: "The instance's agent is archived (`agent_archived`), or another instance of the agent already has the name (`agent_instance_name_taken`)" }
  /api/v1/agents/{slug}/instances:
    post:
      summary: Register an instance
      description: >-
        Registers an instance of an agent and issues its credential. An
        instance is one running copy of the agent, such as a CI runner or
        a pod. The credential's token is returned once, in this response.
        Store it where the instance can read it. It cannot be retrieved
        again.

        Use this when you set up an instance by hand. For a fleet that
        starts replicas itself, create a provisioner token instead and let
        each replica create its own instance through the Agent Approval
        Protocol (AAP).
      operationId: createAgentInstance
      x-withhuman-permission: agent.credential.issue
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AgentSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: ci-runner-07
                  description: A name for the instance, unique within the agent. Reviewers see it next to the agent's name.
                metadata:
                  type: object
                  additionalProperties: true
                  example: { region: eu-west }
                  description: Any JSON object to store with the instance, such as a region or pod name.
                delivery: { $ref: "#/components/schemas/AgentInstanceRegistrationDelivery" }
      responses:
        "201":
          description: The new instance and its credential. The token appears only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInstanceCredential" }
        "400": { $ref: "#/components/responses/Error", description: "An organization key tried to register an instance of a personal agent, which belongs to a person (`agent_owner_required`), or the receiver URL is not allowed (`invalid_webhook_url`)" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot issue credentials" }
        "404": { $ref: "#/components/responses/Error", description: "No such agent, or no registration you started for it" }
        "409": { $ref: "#/components/responses/Error", description: "The agent is archived (`agent_archived`)" }
        "410": { $ref: "#/components/responses/Error", description: "The registration expired or was used (`instance_registration_expired`). Start a new one." }
        "422": { $ref: "#/components/responses/Error", description: "The receiver did not answer the verification (`webhook_verification_failed`). The registration is kept, so you can fix the receiver and try again." }
        "501": { $ref: "#/components/responses/Error", description: "This server has no secrets key, so it cannot deliver webhooks (`webhook_unconfigured`)" }
  /api/v1/agents/{slug}/instance_registrations:
    post:
      summary: Start a webhook registration
      description: >-
        Starts registering an instance that is notified when its requests
        are decided, so the agent can pause instead of polling. The
        response holds a registration ID and a signing secret. The secret
        appears only in this response.

        Configure your receiver with both, then register the instance with
        `delivery` naming this registration and the receiver URL. The
        receiver must answer a signed `webhook.verification` challenge
        before the instance is created. The registration expires after
        one hour.
      operationId: createAgentInstanceRegistration
      x-withhuman-permission: agent.credential.issue
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AgentSlug"
      responses:
        "201":
          description: The registration. The signing secret appears only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInstanceRegistration" }
        "400": { $ref: "#/components/responses/Error", description: "An organization key tried to register an instance of a personal agent, which belongs to a person (`agent_owner_required`)" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot issue credentials" }
        "404": { $ref: "#/components/responses/Error", description: "No such agent" }
        "409": { $ref: "#/components/responses/Error", description: "The agent is archived (`agent_archived`)" }
        "501": { $ref: "#/components/responses/Error", description: "This server has no secrets key, so it cannot deliver webhooks (`webhook_unconfigured`)" }
  /api/v1/agents/{slug}/provisioners:
    post:
      summary: Create a provisioner token
      description: >-
        Creates a provisioner token for an agent. A provisioner token lets
        a fleet or platform create instances of this agent on its own,
        each with a credential of its own, through the Agent Approval
        Protocol (AAP). It cannot create approval requests itself.

        The token is returned once, in this response. It cannot be
        retrieved again.
      operationId: createAgentProvisioner
      x-withhuman-permission: agent.credential.issue
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AgentSlug"
      responses:
        "201":
          description: The provisioner and its token. The token appears only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProvisionerCredential" }
        "400": { $ref: "#/components/responses/Error", description: "The agent is personal, and personal agents have no provisioner tokens (`personal_agent`)" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot issue credentials" }
        "404": { $ref: "#/components/responses/Error", description: "No such agent" }
        "409": { $ref: "#/components/responses/Error", description: "The agent is archived (`agent_archived`)" }
  /api/v1/agent-provisioners/{id}:
    delete:
      summary: Revoke a provisioner token
      description: >-
        Revokes a provisioner token. It stops working immediately. The
        instances it already created, and their credentials, are not
        affected.
      operationId: revokeAgentProvisioner
      x-withhuman-permission: agent.credential.revoke
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProvisionerID"
      responses:
        "204": { description: The token is revoked }
        "403": { $ref: "#/components/responses/Error", description: "You cannot revoke credentials" }
        "404": { $ref: "#/components/responses/Error", description: "No such provisioner" }
  /api/v1/agent-credentials/{id}:
    delete:
      summary: Revoke a credential
      description: >-
        Revokes one instance credential. It stops working immediately. The
        instance stays registered, and the agent and its other instances
        are not affected.
      operationId: revokeAgentCredential
      x-withhuman-permission: agent.credential.revoke
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Agents]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "204": { description: The credential is revoked }
        "403": { $ref: "#/components/responses/Error", description: "You cannot revoke credentials" }
        "404": { $ref: "#/components/responses/Error", description: "No such credential" }
  /api/v1/oauth_authorizations/preview:
    post:
      summary: Preview an MCP client's authorization request
      operationId: previewOAuthAuthorization
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      tags: [API keys]
      security: [{ cookieAuth: [] }]
      description: >-
        What the consent page shows for the request an MCP client sent the
        browser to: the client, the permissions it asked for that the
        person could grant, the person's full vocabulary, and whether keys
        may be scoped or are allowed at all. The whole request is validated
        first, so a redirect URI the client did not register is refused
        before anything is shown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthAuthorizationRequest" }
      responses:
        "200":
          description: The consent preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthAuthorizationPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/oauth_authorizations:
    post:
      summary: Approve or decline an MCP client
      operationId: createOAuthAuthorization
      x-withhuman-permission: api_key.issue
      x-withhuman-credential-kinds: [session]
      tags: [API keys]
      security: [{ cookieAuth: [] }]
      description: >-
        The person's decision on the consent page. Approval mints a
        personal API key named after the client, narrowed to the chosen
        permissions where scoping is available, under the same freshness
        and MFA rules as a hand-made key, and answers the client's redirect
        URI carrying a single-use code. Declining answers the redirect URI
        carrying access_denied. The browser navigates to the answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthAuthorizationDecision" }
      responses:
        "200":
          description: Where the browser goes next
          content:
            application/json:
              schema:
                type: object
                required: [redirect_url]
                properties:
                  redirect_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/agent_enrollments/preview:
    post:
      summary: Preview an enrollment in the current organization
      operationId: previewAgentEnrollment
      description: "Shows what a pending code would connect. Any member may connect their own instance of a personal agent; a service agent needs `agent.credential.issue` on it, and a code that requests one the member may not issue for answers 403."
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_code]
              properties:
                user_code: { type: string }
      responses:
        "200":
          description: Runtime, instance, expiry and any fixed or already authorized agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/agent_enrollments/agents:
    get:
      summary: Search agents eligible for instance enrollment
      operationId: listEnrollmentAgents
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive literal substring of the agent name or type.
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Number of eligible matching agents to skip.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: Maximum number of agents to return.
      responses:
        "200":
          description: "Every active personal agent, plus the active service agents within the person's credential issuance scope, sorted by name and ID"
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
                  next_offset: { type: integer, minimum: 0, description: Omitted when no more results remain. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/agent_enrollments/authorize:
    post:
      summary: Authorize a pending agent instance enrollment
      description: "Attaches the instance to an existing active agent in the current organization. The selected agent must match any requested agent slug. An instance of a personal agent belongs to the member authorizing it, and any active member may connect one; a service agent needs `agent.credential.issue` on it. The enrollment code identifies the retry: repeating the same organization and agent returns the same instance, including after token exchange; changing the target returns a conflict. Codes expire after ten minutes."
      operationId: authorizeAgentEnrollment
      x-withhuman-permission: self
      x-withhuman-credential-kinds: [session]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_code, agent_slug]
              properties:
                user_code: { type: string }
                agent_slug: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: The slug of the agent to attach the instance to. }
      responses:
        "200":
          description: Agent instance authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInstance" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/request-approval-pipelines:
    get:
      summary: List pipelines
      description: >-
        Returns every pipeline in the organization: the entry pipeline,
        where every request starts, first, then every pipeline a delegate
        block can hand requests to. Each entry carries the key, the name,
        the active revision number and a summary of its history.

        A pipeline always has an active revision. An empty revision passes
        every request that enters the pipeline through to a person. An
        archived pipeline has no active revision, carries `archived_at`,
        and is left out unless `status` says otherwise. The list is
        narrowed to the pipelines you may read.
      operationId: listRequestApprovalPipelines
      x-withhuman-permission: pipeline.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Approval pipelines]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: "Which pipelines to return. `live` (the default) leaves archived pipelines out, `archived` returns only them, and `all` returns both."
          schema: { type: string, enum: [live, archived, all], default: live }
        - name: limit
          in: query
          description: "How many pipelines to return. Defaults to 50."
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The pipelines
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_approval_pipelines]
                properties:
                  request_approval_pipelines:
                    type: array
                    items: { $ref: "#/components/schemas/RequestApprovalPipelineSummary" }
        "400": { $ref: "#/components/responses/Error", description: "`status` is not live, archived, or all" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read pipelines" }
    post:
      summary: Create a pipeline
      description: >-
        Creates a pipeline that a delegate block in another pipeline can
        hand requests to, with its first revision active at once. You
        choose the key; it is taken for good, archived pipelines included,
        and can never be `entry`, which every organization already has.

        Creating a pipeline is an organization-wide act: it needs
        `pipeline.write` at the organization. Grant a team `pipeline.read`,
        `pipeline.write` and `pipeline.activate` at `pipeline:<key>` and
        they can edit the new pipeline and nothing else.
      operationId: createRequestApprovalPipeline
      x-withhuman-permission: pipeline.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Approval pipelines]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestApprovalPipelineCreate" }
      responses:
        "201":
          description: The new pipeline's first revision, active
          headers:
            ETag:
              description: The active revision number, quoted
              schema: { type: string, example: '"1"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestApprovalPipelineRevision" }
        "400": { $ref: "#/components/responses/Error", description: "The key, the name, or the document is invalid, or a delegate names a pipeline that does not exist (`request_approval_pipeline_not_found`)" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot create pipelines" }
        "409": { $ref: "#/components/responses/Error", description: "The key was ever used (`request_approval_pipeline_exists`), or is `entry` (`request_approval_pipeline_entry`)" }
  /api/v1/request-approval-pipelines/{pipeline_key}:
    get:
      summary: Retrieve a pipeline's active revision
      description: >-
        Returns the pipeline's active revision, with its blocks in the
        order they run. `entry` is the pipeline every request starts in;
        any other pipeline runs for the requests a delegate block hands
        to it.

        The `ETag` header carries the active revision number. Pass it as
        `If-Match` when you activate another revision.
      operationId: getActiveRequestApprovalPipeline
      x-withhuman-permission: pipeline.read
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Approval pipelines]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PipelineKey"
      responses:
        "200":
          description: The active revision
          headers:
            ETag:
              description: The active revision number, quoted
              schema: { type: string, example: '"3"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestApprovalPipelineRevision" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read this pipeline" }
        "404": { $ref: "#/components/responses/Error", description: "No pipeline with this key exists, or it is archived" }
    delete:
      summary: Archive a pipeline
      description: >-
        Archives the pipeline: every revision is stamped, none is active,
        and its key stays taken. Its revisions remain readable with
        `status=archived` or `all`.

        The entry pipeline cannot be archived, and neither can a pipeline
        that a delegate block in an active revision still hands requests
        to; remove those blocks first. `GET .../uses` lists them.
      operationId: archiveRequestApprovalPipeline
      x-withhuman-permission: pipeline.activate
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Approval pipelines]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PipelineKey"
      responses:
        "204": { description: The pipeline is archived }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot archive this pipeline" }
