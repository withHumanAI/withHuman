            application/json:
              schema:
                type: object
                required: [session, setup_code, setup_command]
                properties:
                  session: { $ref: "#/components/schemas/OnboardingSession" }
                  setup_code: { type: string, example: ABCD-EFGH-JKLM }
                  setup_command: { type: string, description: "One line that installs the CLI and runs its setup with the code" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/onboarding/session:
    get:
      summary: Read the caller's open setup session
      operationId: getOnboardingSession
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: The open session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
