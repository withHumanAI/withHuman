              properties:
                runtimes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/onboarding/session/channels:
    post:
      summary: Confirm the caller's channels
      operationId: confirmOnboardingChannels
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Allowed from agents_selected until the session ends; the status does not move. Records that the caller chose how withHuman reaches them (the contact methods and notification rules themselves are written through /api/v1/me) by stamping channels_set_at, which provisioning requires because the path it writes notifies the caller. Passing the steps again re-stamps.
      responses:
        "200":
          description: The session with channels_set_at stamped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/onboarding/session/provision:
    post:
      summary: Write the generated objects
      operationId: provisionOnboarding
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Allowed in tools_discovered with channels_set_at stamped (400 channels_not_set otherwise). Creates and activates the escalation path that notifies the caller, and one agent and its starting pipeline per selected runtime (the suggested tools to a human, the rest approved), then moves the session to provisioning. On failure the session keeps its status with last_error set and the answer is 502 onboarding_provision_failed.
      responses:
        "200":
          description: The session in provisioning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/onboarding/session/gated-tools:
    put:
      summary: Pick one agent's gated tools by hand
      operationId: setOnboardingGatedTools
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Allowed from provisioning until the session ends, once the agents exist. The quick-try alternative to writing the rules with a coding agent. Rewrites the runtime's branch of the entry pipeline with the starting shape, the named tools to a human and every other call approved; an empty list makes every call run. 409 entry_pipeline_changed when the entry pipeline moved under the write. Every name must have been discovered for the runtime (400 tool_not_discovered); the runtime must be one the session selected (400 runtime_not_selected).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime, tools]
              properties:
                runtime: { type: string, description: "The runtime key, which is the agent's slug." }
                tools:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The session after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/onboarding/session/rules:
    post:
      summary: Leave the rules step
      operationId: recordOnboardingRules
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Allowed in installed and tested; the status does not move. Stamps rules_set_at the first time, so the test step counts the gated calls that arrive after it, and chooses `test_commands` against the active entry pipeline each time. A runtime gets the first stock test call (a shell command, a file write, then an MCP tool) that previews as `human` under the active rules, and no command when none does. Previewing really calls any webhook block the call reaches.
      responses:
        "200":
          description: The session with rules_set_at stamped and its test commands chosen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/onboarding/session/test:
    post:
      summary: Record the decided test request
      operationId: recordOnboardingTest
      x-withhuman-permission: agent.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: Allowed in installed. The request must be the organization's (400 test_request_unknown), come from an agent this session enrolled (400 test_request_not_enrolled), and be decided (400 test_request_pending). Moves the session to tested with test_request_id and tested_at set; finishing follows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id: { type: string, format: uuid }
