      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Teams]
      description: Refused when the team is archived. Otherwise, a path level that targets the team falls back to notifying every member at once; requests already routed keep their pinned revision.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/ActiveRevisionIfMatch"
      responses:
        "204": { description: Current revision deactivated }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "The team is archived" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/invitations:
    get:
      summary: List invitations
      operationId: listInvitations
      x-withhuman-permission: membership.invite
      x-withhuman-credential-kinds: [session, personal_api_key]
      tags:
      - Invitations
      security:
      - cookieAuth: []
      - apiKeyAuth: []
      description: Returns the organization's invitations in every status, newest first.
      parameters:
      - name: limit
        in: query
        description: How many invitations to return. Defaults to 100.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: The invitations
          content:
            application/json:
              schema:
                type: object
                required:
                - invitations
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Error'
          description: You are not signed in
        '403':
          $ref: '#/components/responses/Error'
          description: You cannot invite people
    post:
      summary: Invite a person
      operationId: createInvitation
      x-withhuman-permission: membership.invite
      x-withhuman-credential-kinds: [session]
      tags:
      - Invitations
      security:
      - cookieAuth: []
      description: Invite a member with a predefined role, or, where the edition offers custom permissions
        (`custom_permissions_enabled` in the runtime config), with explicit permission policies. Send exactly one of `role`
        and `permission_policies`. Only an owner may invite an owner, every permission must be held by the inviter at the
        selected scope or wider, and a role or policy holding a sensitive permission needs a fresh sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  description: Where to send the invitation. The person must accept with this address.
                role:
                  $ref: '#/components/schemas/RoleKey'
                  description: The predefined role the person receives everywhere in the organization.
                permission_policies:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/PermissionPolicySpec'
                  description: Custom permissions instead of a role. Refused with 403 `custom_permissions_unavailable`
                    where the edition offers predefined roles alone.
              additionalProperties: false
      responses:
        '201':
          description: The invitation and its link. The link appears only in this response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationWithURL'
        '400':
          $ref: '#/components/responses/Error'
          description: Neither or both of `role` and `permission_policies` were sent, or the role is unknown
        '403':
          $ref: '#/components/responses/Error'
          description: You cannot invite people, a grant exceeds what you hold or needs a fresher sign-in, or custom
            permissions are not available in this edition (`custom_permissions_unavailable`)
        '409':
          $ref: '#/components/responses/Error'
          description: A member or a pending invitation with this email already exists, or the organization is at its seat
            limit
