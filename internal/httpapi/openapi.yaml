        "400": { $ref: "#/components/responses/Error", description: "`endpoint_key` is malformed" }
        "401": { $ref: "#/components/responses/Error", description: "You are not signed in" }
        "403": { $ref: "#/components/responses/Error", description: "You cannot read webhook endpoints" }
  /api/v1/webhook_endpoints/{endpoint_key}/active:
    delete:
      summary: Archive a webhook endpoint
      operationId: archiveWebhookEndpoint
      x-withhuman-permission: webhook.write
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Webhook endpoints]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      description: >-
        Deactivates the endpoint's current revision, so the endpoint has no
        active revision. Its history and its signing secret are kept, and
        you can activate a revision again later.

        Archiving is refused while an active pipeline revision posts to the
        endpoint. Activate pipeline revisions without that block first.
