    post:
      summary: Activate a pipeline revision
      operationId: activateRequestApprovalPipelineRevision
      x-withhuman-permission: pipeline.activate
      x-withhuman-credential-kinds: [session, personal_api_key, organization_api_key]
      tags: [Approval pipelines]
      description: >-
        Makes a revision the active one. New requests use it from then on.
        Activating an older revision is how you roll back.

