      operationId: updateToolPresentation
      x-withhuman-permission: organization.settings.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: Requires organization.settings.write. Replaces the binding and the specification. 409 tool_presentation_exists when the new binding collides with another entry. Audited as tool_presentation.updated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolPresentationInput" }
      responses:
        "200":
          description: The stored presentation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolPresentation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a tool presentation
      operationId: deleteToolPresentation
      x-withhuman-permission: organization.settings.write
      x-withhuman-credential-kinds: [session, personal_api_key]
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
