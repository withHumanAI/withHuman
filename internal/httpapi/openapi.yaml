  - key: request.read
    area: request
    description: Read approval requests and their outcomes
    holders: [human, api_key, organization_api_key, agent]
    resource: request
    dangerous: false
  - key: request.read.unrouted
    area: request
    description: Read requests that were routed to other people, whatever the visibility policy
    holders: [human, api_key, organization_api_key]
