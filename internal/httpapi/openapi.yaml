openapi: 3.1.0
info:
  title: withHuman provider API
  version: 1.0.0
  description: Agent Approval Protocol and reviewer product endpoints.
servers:
  - url: /
tags:
  - name: Agent Approval Protocol
    description: What an adapter calls on behalf of a running agent. Create an instance and get its credential, ask for approval of a tool call, and wait for the answer.
  - name: Review queue
    description: "The review queue is where approval requests wait for a person to approve or deny them. These endpoints list the queue, retrieve one request, claim it while you look at it, and record your decision."
  - name: Agent enrollment
    description: Connect an agent from a developer machine. The agent asks for a code, a person approves it in the browser, and the agent exchanges the code for a credential. A withHuman extension, not part of the protocol.
  - name: Account
    description: Who the session belongs to. Read the current member, their organization and permissions.
  - name: Agents
    description: "Agents are the AI systems that ask for approval. Each agent has instances, and each instance holds a credential it uses to call the API."
  - name: Approval pipelines
    description: "The rules every approval request runs through, as an ordered list of blocks. A block can approve or deny a request, send it to a person, or pass it to the next block."
  - name: Escalation paths
    description: "An escalation path decides who reviews a request once the pipeline hands it to a person, and what happens when nobody answers in time."
  - name: Webhook endpoints
    description: "A webhook endpoint is a URL on a service of yours that a pipeline's webhook block can ask for an outcome."
  - name: Members
    description: "The people in the organization, their status, and their permissions."
  - name: Teams
    description: "Groups of members. A team can be an escalation target, and its members inherit the team's permissions."
  - name: Invitations
    description: "Invite people to the organization by email."
  - name: API keys
    description: "Personal API keys let a script act as you outside the browser: a whk_ bearer that carries a subset of your own permissions, changes with your permissions, and dies with your membership. Mint one, list yours, revoke it, and verify what a key can do."
x-withhuman-permissions:
  - key: agent.credential.issue
    area: agent
    description: Issue instance credentials and provisioner tokens
    holders: [human, api_key, organization_api_key]
    resource: agent
    dangerous: true
  - key: agent.credential.revoke
    area: agent
    description: Revoke instance credentials and provisioner tokens
    holders: [human, api_key, organization_api_key]
    resource: agent
    dangerous: false
  - key: agent.read
    area: agent
    description: View agents, their instances, and credential state
    holders: [human, api_key, organization_api_key]
    resource: agent
    dangerous: false
  - key: agent.write
    area: agent
    description: Create agents, rename agents and instances, and change their status
    holders: [human, api_key, organization_api_key]
    resource: agent
    dangerous: false
  - key: api_key.issue
    area: api_key
    description: Mint personal API keys and manage your own
    holders: [human]
    resource: organization
    dangerous: false
  - key: api_key.read
    area: api_key
    description: List every API key in the organization
    holders: [human]
    resource: organization
    dangerous: false
  - key: api_key.revoke
    area: api_key
    description: Revoke any API key in the organization
    holders: [human]
    resource: organization
    dangerous: false
  - key: connection.read
    area: connection
    description: View SSO, directory, chat, and domain connections
    holders: [human, api_key]
    resource: organization
    dangerous: false
  - key: connection.write
    area: connection
    description: Connect and disconnect SSO, directories, chat apps, and domains
    holders: [human, api_key]
    resource: organization
    dangerous: true
  - key: escalation_path.activate
    area: escalation_path
    description: Activate, roll back, and archive escalation paths
    holders: [human, api_key, organization_api_key]
    resource: organization
    dangerous: false
  - key: escalation_path.read
    area: escalation_path
    description: Read escalation paths and their revisions
    holders: [human, api_key, organization_api_key]
    resource: organization
    dangerous: false
  - key: escalation_path.write
    area: escalation_path
    description: Create escalation paths and their revisions
    holders: [human, api_key, organization_api_key]
    resource: organization
    dangerous: false
  - key: membership.invite
    area: membership
    description: Invite people and manage pending invitations
    holders: [human, api_key]
    resource: organization
    dangerous: false
  - key: membership.read
    area: membership
    description: List members and pending invitations
    holders: [human, api_key, organization_api_key]
    resource: organization
    dangerous: false
  - key: membership.write
    area: membership
    description: Suspend, reactivate, and remove members
    holders: [human, api_key]
    resource: organization
    dangerous: false
  - key: organization.delete
    area: organization
    description: Schedule the organization for deletion
    holders: [human, api_key]
    resource: organization
    dangerous: true
  - key: organization.read
    area: organization
    description: Read organization settings and policy
    holders: [human, api_key, organization_api_key]
    resource: organization
    dangerous: false
  - key: organization.settings.write
    area: organization
    description: Change organization settings and policy
    holders: [human, api_key]
    resource: organization
    dangerous: false
  - key: permission_policy.read
    area: permission_policy
    description: Read permission policies and available permissions
    holders: [human, api_key]
    resource: scope
    dangerous: false
  - key: permission_policy.write
    area: permission_policy
    description: Grant and revoke permission policies for people and teams
    holders: [human, api_key]
    resource: scope
    dangerous: true
  - key: pipeline.activate
    area: pipeline
    description: Activate, roll back, and archive pipelines
    holders: [human, api_key, organization_api_key]
    resource: pipeline
    dangerous: false
  - key: pipeline.read
    area: pipeline
    description: Read request approval pipelines and their revisions
    holders: [human, api_key, organization_api_key]
    resource: pipeline
    dangerous: false
  - key: pipeline.write
    area: pipeline
    description: Create pipelines and preview and create their revisions
    holders: [human, api_key, organization_api_key]
    resource: pipeline
    dangerous: false
  - key: request.claim
    area: request
    description: Claim a pending request while reviewing it
    holders: [human, api_key]
    resource: request
    dangerous: false
  - key: request.create
    area: request
    description: Create approval requests
    holders: [agent]
    resource: organization
    dangerous: false
  - key: request.decide
    area: request
    description: Approve or deny requests routed to you
    holders: [human, api_key]
    resource: request
    dangerous: false
  - key: request.decide.unrouted
    area: request
    description: Decide requests that were routed to other people (break glass)
    holders: [human, api_key]
